profile_id: profile:plumb-software-2026.1
profile_version: 2026.1-draft.1
metamodel: 3.0-draft.1
status: implementation draft
rule_classes:
  external_standard: Rule operationalizes a recognized standard concept. Unless clause-level coverage has been independently
    verified, Plumb claims alignment/compatibility, not full standard compliance.
  external_interop: Rule validates an interchange format/model against an external specification or a controlled subset.
  plumb_core: Normative Plumb semantic invariant or gate rule.
  profile_policy: Optional rule enabled by industry/company profile.
  organization_policy: Customer-specific rule pack.
result_states:
- PASS
- FAIL
- WARN
- NOT_APPLICABLE
- WAIVED
- ERROR
standards:
  ISO29148:
    standard: ISO/IEC/IEEE 29148
    version: '2018'
    role: semantic_alignment
    note: Current published requirements-engineering standard; successor DIS under development.
  ISO25010:
    standard: ISO/IEC 25010
    version: '2023'
    role: taxonomy
    note: Product quality model with nine characteristics.
  ISO42010:
    standard: ISO/IEC/IEEE 42010
    version: '2022'
    role: semantic_alignment
    note: Architecture-description concepts and conformance targets.
  ISO12207:
    standard: ISO/IEC/IEEE 12207
    version: '2026'
    role: lifecycle_alignment
    note: Software life-cycle process framework.
  ISO15289:
    standard: ISO/IEC/IEEE 15289
    version: '2019'
    role: information_item_alignment
    note: Life-cycle information items; current edition confirmed 2025 and under revision.
  ISO29119-2:
    standard: ISO/IEC/IEEE 29119-2
    version: '2021'
    role: test_process_alignment
    note: Software test processes.
  BPMN:
    standard: OMG BPMN
    version: 2.0.2
    role: interchange
    note: Process-model interchange and familiar notation.
  DMN:
    standard: OMG DMN
    version: '1.6'
    role: interchange
    note: Decision-model and decision-table interchange.
  SYSML:
    standard: OMG SysML
    version: '2.0'
    role: interchange
    note: Systems-model interoperability, not Plumb core semantics.
  PPMN:
    standard: OMG PPMN
    version: '1.0'
    role: interchange
    note: Pedigree/provenance interoperability.
  RBAC:
    standard: INCITS 359
    version: '2012'
    role: semantic_alignment
    note: 'RBAC reference-model concepts: users, roles, permissions, operations, objects.'
  OPENAPI:
    standard: OpenAPI Specification
    version: 3.2.1
    role: interchange
    note: HTTP API description.
  ASYNCAPI:
    standard: AsyncAPI Specification
    version: 3.0.0
    role: interchange
    note: Message-driven API description.
  ARAZZO:
    standard: Arazzo Specification
    version: 1.1.0
    role: interchange
    note: API workflow description.
  JSONSCHEMA:
    standard: JSON Schema
    version: 2020-12
    role: interchange
    note: Schema validation baseline where applicable.
