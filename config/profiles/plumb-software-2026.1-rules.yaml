rules:
- id: PLUMB.I0.SOURCE.CONTENT_ADDRESSED
  gate: I0
  title: Every source artifact is content-addressed
  severity: blocker
  rule_class: plumb_core
  applies_when: All in-scope accepted elements of the relevant type.
  check: Each SourceArtifact has a stable content_hash over the stored source bytes or normalized connector snapshot.
  pass_condition: No in-scope SourceArtifact lacks content_hash or stored content/snapshot.
  waiver_policy: forbidden
  evaluation: deterministic
  finding_status_on_fail: Open
- id: PLUMB.I0.EVIDENCE.LOCATABLE
  gate: I0
  title: Evidence fragments are locatable
  severity: blocker
  rule_class: plumb_core
  applies_when: All in-scope accepted elements of the relevant type.
  check: Every EvidenceFragment resolves to an existing SourceArtifact and a valid locator/range.
  pass_condition: Every EvidenceFragment resolves to an existing SourceArtifact and a valid locator/range.
  waiver_policy: forbidden
  evaluation: deterministic
  finding_status_on_fail: Open
- id: PLUMB.I0.EVIDENCE.HASH_MATCH
  gate: I0
  title: Evidence fragment hashes match extracted content
  severity: blocker
  rule_class: plumb_core
  applies_when: All in-scope accepted elements of the relevant type.
  check: Re-reading the fragment locator yields the same content_hash after canonical text extraction.
  pass_condition: Re-reading the fragment locator yields the same content_hash after canonical text extraction.
  waiver_policy: forbidden
  evaluation: deterministic
  finding_status_on_fail: Open
- id: PLUMB.I0.SOURCE.PARSE_STATUS
  gate: I0
  title: Required sources are parseable enough for evidence extraction
  severity: blocker
  rule_class: plumb_core
  applies_when: SourceArtifact is included in the active gate scope.
  check: Source parse_status is complete or partial-with-explicit-unparsed-regions; fatal parse failures are absent.
  pass_condition: Source parse_status is complete or partial-with-explicit-unparsed-regions; fatal parse failures are absent.
  waiver_policy: decision_required
  remediation: Repair/import with another adapter or explicitly exclude the source from scope by ResolutionDecision.
  evaluation: deterministic
  finding_status_on_fail: Open
- id: PPMN.I0.PROVENANCE.AGENT_IDENTIFIED
  gate: I0
  title: Provenance-producing agent is identified
  severity: error
  rule_class: external_interop
  applies_when: A derivation, import or human action created semantic output.
  check: DerivationRecord references a known Agent and activity kind.
  pass_condition: DerivationRecord references a known Agent and activity kind.
  waiver_policy: profile_allow
  standard_reference:
    standard: OMG PPMN
    version: '1.0'
    role: interchange
    note: Pedigree/provenance interoperability.
    mapping_strength: compatible
  evaluation: deterministic
  finding_status_on_fail: Open
- id: PLUMB.I0.BASELINE.HASHABLE
  gate: I0
  title: Evidence baseline is reproducibly hashable
  severity: blocker
  rule_class: plumb_core
  applies_when: All in-scope accepted elements of the relevant type.
  check: Evidence hash can be recomputed from scoped sources and equals the baseline evidence_hash.
  pass_condition: Evidence hash can be recomputed from scoped sources and equals the baseline evidence_hash.
  waiver_policy: forbidden
  evaluation: deterministic
  finding_status_on_fail: Open
- id: ISO29148.F1.REQ.STATEMENT_PRESENT
  gate: F1
  title: Accepted requirements have an explicit statement
  severity: blocker
  rule_class: external_standard
  applies_when: Requirement status = Accepted.
  check: Requirement.statement is non-empty after normalization.
  pass_condition: Requirement.statement is non-empty after normalization.
  waiver_policy: forbidden
  standard_reference:
    standard: ISO/IEC/IEEE 29148
    version: '2018'
    role: semantic_alignment
    note: Current published requirements-engineering standard; successor DIS under development.
    mapping_strength: compatible
  evaluation: deterministic
  finding_status_on_fail: Open
- id: PLUMB.F1.REQ.GROUNDED
  gate: F1
  title: Accepted requirements are grounded in evidence or explicit human origin
  severity: blocker
  rule_class: plumb_core
  applies_when: All in-scope accepted elements of the relevant type.
  check: At least one evidenced_by/derived_from path reaches EvidenceFragment, or the requirement carries an explicit human-origin
    ResolutionDecision.
  pass_condition: At least one evidenced_by/derived_from path reaches EvidenceFragment, or the requirement carries an explicit
    human-origin ResolutionDecision.
  waiver_policy: decision_required
  remediation: Attach source evidence or record the requirement as an explicit human-origin decision.
  evaluation: deterministic
  finding_status_on_fail: Open
- id: ISO29148.F1.REQ.LINEAGE
  gate: F1
  title: Requirements have intent lineage
  severity: error
  rule_class: external_standard
  applies_when: Requirement is not a root stakeholder need.
  check: Requirement addresses/refines/decomposes from at least one Goal, Need, Concern, parent Requirement, or explicit origin
    decision.
  pass_condition: Requirement addresses/refines/decomposes from at least one Goal, Need, Concern, parent Requirement, or explicit
    origin decision.
  waiver_policy: profile_allow
  standard_reference:
    standard: ISO/IEC/IEEE 29148
    version: '2018'
    role: semantic_alignment
    note: Current published requirements-engineering standard; successor DIS under development.
    mapping_strength: compatible
  evaluation: deterministic
  finding_status_on_fail: Open
- id: PLUMB.F1.REQ.TYPE_KNOWN
  gate: F1
  title: Requirement kind and level are known
  severity: error
  rule_class: plumb_core
  applies_when: All in-scope accepted elements of the relevant type.
  check: requirement_kind and level are set to registered values.
  pass_condition: requirement_kind and level are set to registered values.
  waiver_policy: decision_required
  remediation: Classify as functional, quality, interface, constraint, data, security, etc., and set stakeholder/system/software/interface
    level.
  evaluation: deterministic
  finding_status_on_fail: Open
- id: PLUMB.F1.REQ.NO_DUPLICATE_ACCEPTED
  gate: F1
  title: Accepted requirement set has no unresolved semantic duplicates
  severity: blocker
  rule_class: plumb_core
  applies_when: All in-scope accepted elements of the relevant type.
  check: No open blocking duplicate finding links two accepted requirements with equivalent obligation semantics.
  pass_condition: No open blocking duplicate finding links two accepted requirements with equivalent obligation semantics.
  waiver_policy: decision_required
  evaluation: deterministic
  finding_status_on_fail: Open
- id: PLUMB.F1.REQ.NO_CONTRADICTION
  gate: F1
  title: Accepted requirements have no unresolved blocking contradiction
  severity: blocker
  rule_class: plumb_core
  applies_when: All in-scope accepted elements of the relevant type.
  check: No open blocking conflict finding exists between accepted requirements in the same scope.
  pass_condition: No open blocking conflict finding exists between accepted requirements in the same scope.
  waiver_policy: decision_required
  evaluation: deterministic
  finding_status_on_fail: Open
- id: PLUMB.F1.REQ.TERMS_RESOLVED
  gate: F1
  title: Requirement terms needed for interpretation resolve to concepts
  severity: blocker
  rule_class: plumb_core
  applies_when: All in-scope accepted elements of the relevant type.
  check: All terms classified as semantic dependencies resolve to accepted Term/Concept nodes or are explicitly declared external
    identifiers.
  pass_condition: All terms classified as semantic dependencies resolve to accepted Term/Concept nodes or are explicitly declared
    external identifiers.
  waiver_policy: decision_required
  evaluation: deterministic
  finding_status_on_fail: Open
- id: PLUMB.F1.REQ.MODALITY_EXPLICIT
  gate: F1
  title: Normative requirement modality is explicit
  severity: error
  rule_class: plumb_core
  applies_when: Requirement expresses an obligation, prohibition or option.
  check: Requirement obligation strength is classified and contradictions in modality are absent.
  pass_condition: Requirement obligation strength is classified and contradictions in modality are absent.
  waiver_policy: profile_allow
  evaluation: deterministic
  finding_status_on_fail: Open
- id: PLUMB.F1.REQ.CRITERIA_FOR_BEHAVIOR
  gate: F1
  title: Behavioral requirements have acceptance criteria or executable semantics
  severity: error
  rule_class: plumb_core
  applies_when: Requirement kind is functional/interface/security behavior and is in implementation scope.
  check: Requirement has AcceptanceCriterion, specified_by links, or an explicit deferred-verification decision.
  pass_condition: Requirement has AcceptanceCriterion, specified_by links, or an explicit deferred-verification decision.
  waiver_policy: decision_required
  evaluation: deterministic
  finding_status_on_fail: Open
- id: PLUMB.F1.REQ.QUALITY_FINDINGS_CLEAR
  gate: F1
  title: No unresolved high-severity requirement-quality findings
  severity: blocker
  rule_class: plumb_core
  applies_when: All in-scope accepted elements of the relevant type.
  check: All requirement-quality findings marked blocker/error by active profile are resolved or validly waived.
  pass_condition: All requirement-quality findings marked blocker/error by active profile are resolved or validly waived.
  waiver_policy: decision_required
  evaluation: deterministic
  finding_status_on_fail: Open
- id: PLUMB.F1.REQ.SUPERSEDED_EXCLUDED
  gate: F1
  title: Superseded requirements do not count as active obligations
  severity: blocker
  rule_class: plumb_core
  applies_when: All in-scope accepted elements of the relevant type.
  check: Superseded requirements are excluded from gate scope, coverage denominators and generated contracts.
  pass_condition: Superseded requirements are excluded from gate scope, coverage denominators and generated contracts.
  waiver_policy: forbidden
  evaluation: deterministic
  finding_status_on_fail: Open
- id: PLUMB.F2.DOMAIN.ATTRIBUTE_OWNER
  gate: F2
  title: Every attribute has exactly one owning entity in the core profile
  severity: blocker
  rule_class: plumb_core
  applies_when: All in-scope accepted elements of the relevant type.
  check: Each accepted Attribute has exactly one incoming has_attribute from an accepted Entity.
  pass_condition: Each accepted Attribute has exactly one incoming has_attribute from an accepted Entity.
  waiver_policy: decision_required
  evaluation: deterministic
  finding_status_on_fail: Open
- id: PLUMB.F2.DOMAIN.RELATION_TYPED
  gate: F2
  title: Domain relationships have known endpoints and cardinality when semantically required
  severity: error
  rule_class: plumb_core
  applies_when: All in-scope accepted elements of the relevant type.
  check: Relationship endpoints exist and any required cardinality/optionality constraints are resolved.
  pass_condition: Relationship endpoints exist and any required cardinality/optionality constraints are resolved.
  waiver_policy: decision_required
  evaluation: deterministic
  finding_status_on_fail: Open
- id: PLUMB.F2.STATE.TRANSITION_COMPLETE
  gate: F2
  title: State transitions are complete
  severity: blocker
  rule_class: plumb_core
