glossary:
- id: concept:07dd6fe2a0bce670
  name: annual leave balance
  definition: Approving annual leave shall deduct the approved leave duration from the employee's annual-leave balance.
  aliases: []
- id: concept:118361c3ae7fdb29
  name: public holiday
  definition: The system shall exclude public holidays from requested leave duration.
  aliases: []
- id: concept:2827eed8baa8839e
  name: contractor
  definition: A contractor shall not be eligible for paid annual leave.
  aliases: []
- id: concept:3efaa81157fa3474
  name: approval record
  definition: Approval records shall be retained for five years.
  aliases: []
- id: concept:43b710e37aec1004
  name: employee
  definition: A leave request shall identify the employee, leave type, start date, and end date.
  aliases: []
- id: concept:49963694af6aeb67
  name: rejection reason
  definition: A manager shall be allowed to reject leave requests for employees who report directly to that manager and shall record a rejection reason.
  aliases: []
- id: concept:5127e8d3843cdf84
  name: leave balance
  definition: Rejecting a leave request shall not change the employee's leave balance.
  aliases: []
- id: concept:837ac0803014d8a0
  name: audit record
  definition: The system shall create an audit record for every approval, rejection, withdrawal, and cancellation decision.
  aliases: []
- id: concept:86e7c78c4992d64f
  name: decision timestamp
  definition: An approval or rejection shall record the deciding manager and decision timestamp.
  aliases: []
- id: concept:a48f8b1f68ddc591
  name: leave type
  definition: A leave request shall identify the employee, leave type, start date, and end date.
  aliases: []
- id: concept:b6913206f2ea03fd
  name: leave start date
  definition: An employee shall be allowed to cancel an Approved leave request before the leave start date.
  aliases: []
- id: concept:bf7d7f558fad688c
  name: end date
  definition: A leave request shall identify the employee, leave type, start date, and end date.
  aliases: []
- id: concept:c721bb7b1f0237e9
  name: leave request
  definition: Cancelling a leave request shall change its status to Cancelled.
  aliases: []
- id: concept:c8c4d50e078bab10
  name: half day
  definition: The system shall support a half-day leave request.
  aliases: []
- id: concept:e686b064114a5777
  name: working day
  definition: The system shall calculate the requested leave duration in working days from the start date to the end date.
  aliases: []
- id: concept:ed729da8f50aa53b
  name: start date
  definition: A leave request shall identify the employee, leave type, start date, and end date.
  aliases: []
- id: concept:fb4582e25c7e05a9
  name: manager
  definition: A submitted leave request shall require a manager decision before it can become Approved or Rejected.
  aliases: []
