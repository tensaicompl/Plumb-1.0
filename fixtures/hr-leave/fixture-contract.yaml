        nullable: false
      end_date:
        type: Date
        nullable: false
      day_fraction:
        type: Decimal(2)
        nullable: false
        default: '1.0'
      status:
        type: Enum
        values:
        - Draft
        - Submitted
        - Approved
        - Rejected
        - Withdrawn
        - Cancelled
        nullable: false
      rejection_reason:
        type: String
        nullable: true
      created_at:
        type: DateTime
        nullable: false
