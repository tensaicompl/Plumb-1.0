        - Contractor
        nullable: false
  ManagerAssignment:
    attributes:
      employee_id:
        type: String
        nullable: false
      manager_id:
        type: String
        nullable: false
  LeaveType:
    attributes:
      code:
        type: Enum
        values:
        - Annual
        - Unpaid
        - Sick
        nullable: false
      deducts_annual_balance:
        type: Bool
        nullable: false
  ApprovalRecord:
    attributes:
      request_id:
        type: String
        nullable: false
      manager_id:
        type: String
        nullable: false
      decision:
        type: Enum
        values:
        - Approved
        - Rejected
        nullable: false
      reason:
        type: String
        nullable: true
      decided_at:
        type: DateTime
        nullable: false
  Department:
    attributes:
      department_id:
        type: String
        nullable: false
      name:
        type: String
        nullable: false
  AuditRecord:
    attributes:
      request_id:
        type: String
        nullable: false
      actor_id:
        type: String
        nullable: false
      action:
        type: Enum
        values:
        - approve
        - reject
        - withdraw
        - cancel
        nullable: false
      at:
        type: DateTime
        nullable: false
