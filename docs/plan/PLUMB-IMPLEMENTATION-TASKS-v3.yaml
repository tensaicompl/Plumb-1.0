    - Construction/IDs: duplicate node ID, duplicate edge ID and node/edge ID collision rejected; exact SourceArtifact and EvidenceFragment IDs
    accepted and mismatches rejected.

    - Status: Proposed or Rejected Attribute without has_attribute passes; Accepted, Suspect, Superseded and Deprecated Attributes participate;
    Proposed and Rejected edges do not count toward cardinality; a baseline edge to a Proposed or Rejected endpoint is rejected.

    - Relation shape: malformed Proposed and Rejected relations still fail type compatibility; every edge requires existing endpoints.

    - Evidence/provenance references: valid EvidenceRef/DerivationRef resolve; missing and wrong-type targets rejected; EvidenceFragment source
    must exist and be a SourceArtifact; baseline provenance refs cannot point to Proposed/Rejected provenance.

    - Duplicates: duplicate baseline ordinary relation rejected; duplicate schema_for with the same role rejected; schema_for with different valid
    roles accepted; duplicate extension relation with identical canonical properties rejected; distinct extension properties allowed; a Proposed
    duplicate of a baseline relation does not invalidate the baseline.

    - Symmetry: canonical conflicts_with accepted; reverse orientation and self conflicts rejected.

    - Indexes: NodeType, RelationKind, outgoing and incoming indexes exact, including Proposed/Rejected elements.

