- id: S1.1
  title: Implement Requirement, Need, Goal, Concern and Constraint compilation
  phase: S1
  scope: NOW
  depends_on:
  - S0.4
  files:
  - crates/plumb-functional/Cargo.toml
  - crates/plumb-functional/src/lib.rs
  - crates/plumb-functional/src/requirements.rs
  - crates/plumb-functional/src/intent.rs
  - crates/plumb-functional/tests/requirements.rs
  - prompts/s1-classify-requirement.md
  - schemas/inference/s1-requirement-classification.schema.json
  - Cargo.lock
  steps:
  - Compile candidate requirement statements into Proposed Requirement nodes with evidence.
  - Use deterministic modality extraction for shall, should, may and shall not (the first-normative-token rule below); must, must not, can,
    should not and may not are reported as UnsupportedModality and produce no Requirement proposal, and no other normative interpretation is
    guessed.
  - Classification inference may propose requirement_kind and level but evaluate rejects values outside metamodel enums.
  - Create optional Need/Goal/Concern/Constraint proposals only when they contain evidence refs.
  - Requirement IDs are deterministic from project namespace plus stable evidence fragment key; re-import of unchanged evidence preserves IDs.
  - Boundary and dependencies (Hotfix 026). S1.1 compiles S0.4 SegmentCandidates classified requirement_candidate, their EvidenceFragments and
    an optional validated S1 classification inference into human-confirmable Proposals, each a PatchSet with one SemanticPatch::AddNode of a
    Proposed Requirement, Goal, Need, Concern or Constraint. It never creates accepted semantics, mutates a Graph, applies a proposal, calls
    intake, persists artifacts, calls an LLM/provider, materializes an LLM DerivationRecord (materialize_derivation_record) or creates a ResolutionDecision;
    acquisition and its provenance belong to the caller. crates/plumb-functional/Cargo.toml adds exactly plumb-import = { path = "../plumb-import"
    } (no cycle; Cargo.lock changes only as Cargo requires for that edge; no new third-party dependency, schema validator, regex engine, NLP
    tokenizer, ID library, proposal model or inference model). S1.1 reuses plumb-import SegmentCandidate and SegmentClassification without duplicating
    or moving them, and plumb-core, plumb-psg, plumb-patch (Proposal, PatchSet, SemanticPatch, ProposalMateriality, AcceptancePolicy) and plumb-inference
    (InferenceRequest, InferenceArtifact, ProviderPolicy, StageId). lib.rs exports REQUIREMENT_CLASSIFICATION_CONTEXT_VERSION, REQUIREMENT_CLASSIFICATION_OUTPUT_VERSION,
    REQUIREMENT_CLASSIFICATION_TASK_KIND, SegmentOrigin, RequirementClassificationContext, RequirementClassificationContextCandidate, RequirementClassificationStakeholder,
    RequirementClassificationRequest, RequirementClassificationInference, RequirementCompilationAudit, RequirementCompilationIssue, RequirementCompilationResult,
    RequirementCompilationError, build_requirement_classification_request and compile_requirement_candidates; parser internals stay private.
    Production requirements.rs and intent.rs contain no fixture-specific values (HR identifiers, Europe/Warsaw, leave request, fixture counts).
  - 'Requirement and intent identity (Hotfix 026). The S0.4 SegmentCandidate.id is the stable sub-fragment key; the v2 project prefix + counter
    scheme is superseded. A node created from a candidate has id <prefix>:<first 16 lowercase hex of SHA-256 of the RFC 8785 JSON {"project_id":
    Graph.project_id(), "candidate_ref": candidate.id, "node_type": <requirement|goal|need|concern|constraint>}> with prefix req, goal, need,
    concern or constraint respectively, so one candidate may yield distinct typed proposals and a Requirement with kind constraint and a Constraint
    node never collide or merge. IDs exclude counters, random values, timestamps, source display names, models, proposal IDs and derivation
    refs, so re-import of the same evidence with the same project_id preserves them, and changing project_id or candidate.id changes them; the
    same requirement in different source documents may have different IDs (S1.3 owns duplicates). Every such node has evidence exactly [EvidenceRef(candidate.fragment_ref)]
    (the actual input-graph EvidenceFragment, no synthetic fragment, no change to EvidenceRef, EvidenceFragment, EvidenceLocator or plumb-psg),
    derivations [], standards [], tags [], revision 1, status Proposed, audit created_by/created_at from the caller-supplied RequirementCompilationAudit
    { created_by: Id, created_at: Timestamp } (no clock) with updated_by/updated_at None, and exactly one extension plumb_functional:segment_origin
    holding SegmentOrigin { candidate_ref: Id, fragment_ref: Id, start: u64, end: u64 } (deny_unknown_fields) with the candidate''s exact range;
    Node::validate() passes before proposal construction.'
  - 'Candidate text and source prefix (Hotfix 026). Only candidates with classification requirement_candidate are compiled; non_requirement
    candidates are ignored. Each candidate''s fragment_ref must resolve in the supplied Graph to an EvidenceFragment with extracted_text Some,
    with start < end <= text byte length on UTF-8 boundaries; its exact source slice is read from that text, never from a caller-supplied statement.
    For semantic parsing only, the slice is trimmed of outer ASCII space, tab, CR and LF. An optional metadata prefix is then matched as a whole:
    an optional single list marker (ASCII digits followed by ''.'' or '')'', or one of ''-'', ''*'', ''+'', then one or more space/tab), a source
    identifier TOKEN or **TOKEN** with TOKEN matching [A-Za-z][A-Za-z0-9._-]*, one or more space/tab, exactly one of [functional], [quality],
    [interface], [data], [security], [operational], [compliance], [transition] or [constraint] (case-sensitive; [Functional] is not a label),
    and at least one ASCII whitespace byte. When the complete prefix matches, source_identifier is TOKEN exactly, the explicit requirement kind
    is the label''s RequirementKind and the statement is the remainder with outer ASCII whitespace removed; otherwise source_identifier and
    explicit kind are None and the statement is the trimmed slice, with no number, identifier, Markdown or bracket text removed (no partial
    stripping). An empty statement is EmptyStatement. The statement is the deterministic clean source text: no EARS rewriting, actor or modal
    rewording, splitting or grammar normalization (S1.2), no duplicate merging (S1.3), no lint (S1.4) and no Term, Concept, Actor or BusinessRole
    extraction (S1.5).'
  - 'Mandatory fields and modality (Hotfix 026). requirement_kind, level and modality are never defaulted, placeholder-filled or taken as the
    first enum value; a candidate missing one yields an unresolved issue and no Requirement proposal. Kind comes from the explicit source label,
    which overrides classification inference, otherwise from validated inference. Level comes only from validated inference; no label, wording
    or actor noun implies a level. Modality is never proposed by inference and is not in the classification schema: on the clean statement,
    scan left to right for the first whole ASCII word token (word bytes [A-Za-z0-9_], ASCII case-insensitive, no Unicode folding) among shall,
    should, may, must and can; the first such token controls even if later tokens differ or repeat. shall followed by the next word token not
    gives ShallNot (whitespace between may be space, tab, CR or LF), otherwise Shall; should gives Should, but should not is UnsupportedModality
    { token: "should not" }; may gives May, but may not is UnsupportedModality { token: "may not" }; must and must not are UnsupportedModality
    with tokens "must" and "must not"; can is UnsupportedModality { token: "can" }; with none of the five tokens (cannot is not can) the issue
    is MissingModality. S0.4''s segmentation triggers (shall, must, should, can) are unchanged; S1.1 never maps must or can to a canonical modality.'
  - 'Classification request (Hotfix 026). Constants REQUIREMENT_CLASSIFICATION_CONTEXT_VERSION: u32 = 1, REQUIREMENT_CLASSIFICATION_OUTPUT_VERSION:
    u32 = 1 and REQUIREMENT_CLASSIFICATION_TASK_KIND = "requirement_classification". RequirementClassificationContext { version, project_id:
    Id, candidates: Vec<RequirementClassificationContextCandidate { candidate_ref: Id, fragment_ref: Id, text: String }>, stakeholders: Vec<RequirementClassificationStakeholder
    { stakeholder_ref: Id, name: String }> }, all deny_unknown_fields: version 1, candidates exactly the input requirement candidates with their
    exact source slices (not the clean statement), sorted unique by candidate_ref and at least one (an empty candidate input is InvalidInput),
    stakeholders exactly the Graph''s Stakeholder nodes with status Accepted (name = Stakeholder.name), sorted unique by stakeholder_ref; stakeholders.yaml
    or any file is never read. context_hash is the Generic SHA-256 of the RFC 8785 context. RequirementClassificationRequest { request: InferenceRequest,
    context } validates both and their binding. build_requirement_classification_request(graph, candidates, provider_policy) builds the InferenceRequest
    with stage StageId::S1 (never S0), task_kind requirement_classification, input_refs the sorted unique candidate IDs and context stakeholder
    IDs, evidence_refs the sorted unique candidate fragment IDs, the context hash, and prompt_template_hash and schema_hash as the Generic SHA-256
    of the exact committed bytes of prompts/s1-classify-requirement.md and schemas/inference/s1-requirement-classification.schema.json (bound
    by include_bytes!/include_str!, no filesystem read); the provider policy is the caller''s and production has no default provider. compile_requirement_candidates
    first rebuilds the context from the graph and candidates and requires equality with the request context and validity of stage, task_kind,
    input_refs, evidence_refs, context hash and prompt/schema hashes, otherwise InvalidInput (never a silent rebuild). The two runtime files
    are not added to docs/plan/SUPPORTING-DOCS.sha256.'
  - 'Classification prompt and schema (Hotfix 026). prompts/s1-classify-requirement.md carries the Hotfix 026 instructions: one classification
    per supplied candidate with candidate_ref copied exactly; requirement_kind from functional, quality, interface, data, security, operational,
    compliance, transition, constraint and level from stakeholder, system, software, subsystem, component, interface, or null when the evidence
