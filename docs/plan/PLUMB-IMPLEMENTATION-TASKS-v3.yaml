  steps:
  - Import bytes into SourceArtifact with source_kind, display_name, content_hash and media_type.
  - Decode UTF-8; reject invalid UTF-8 for .md/.txt with E_SOURCE_ENCODING. Normalize CRLF and CR to LF; do not trim internal whitespace.
  - Create a content-addressed source-extracted artifact from the normalized UTF-8 text.
  - 'Markdown heading fragment: one ATX heading matching `^#{1,6}[ \t]+(.+?)\s*$`; fragment includes the full normalized source line.'
  - 'Markdown unordered-list fragment: one line matching `^[ \t]*[-+*][ \t]+(.+)$`; ordered-list fragment: one line matching `^[ \t]*[0-9]+[.)][
    \t]+(.+)$`.'
  - 'Markdown table fragment: a contiguous pipe-delimited block is a table only when its second nonblank line matches a GFM delimiter row whose
    cells match `^:?-{3,}:?$`; emit one EvidenceFragment per subsequent data row and include header cells in fragment metadata.'
  - 'Paragraph fragment: maximal contiguous nonblank lines not already classified as heading/list/table; preserve embedded newlines.'
  - Plain-text import emits paragraph fragments using the same paragraph rule and ordered/unordered list recognition; it has no heading or table
    inference.
  - TextRange start/end are zero-based UTF-8 byte offsets into normalized extracted text with end exclusive; slicing those bytes must equal the
    exact fragment text.
  tests:
  - cargo test -p plumb-import md_text
  acceptance:
  - All classification regexes above are covered by tests; fragment ranges round-trip exactly; no other Markdown construct receives a special
    fragment kind in NOW scope.
