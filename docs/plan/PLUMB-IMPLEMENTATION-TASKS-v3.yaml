    Edge>, and private deterministic indexes NodeType -> BTreeSet<Id>, RelationKind -> BTreeSet<Id>, source node -> BTreeSet<edge Id> and target
    node -> BTreeSet<edge Id>. Indexes contain all persisted elements including Proposed and Rejected; status filtering belongs to semantic operations.
