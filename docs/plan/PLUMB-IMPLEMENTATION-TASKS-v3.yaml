  - 'Classification evaluation (Hotfix 026). The optional input is RequirementClassificationInference { artifact: &InferenceArtifact, derivation_ref:
    DerivationRef }, the already-acquired artifact and the caller''s provenance ref. Absent inference succeeds deterministically with no fallback
    classifier: every requirement candidate gets ClassificationUnavailable only (no cascading kind/level issues) and no proposal, and no intent
    is proposed. A supplied inference is checked in order: request validation, InferenceArtifact::validate_for, Draft 2020-12 schema validation,
    typed decoding, version 1, exactly one classification per context candidate (missing, extra or unknown candidates and duplicates reject),
    then intents (every candidate_ref in the context, no duplicate (candidate_ref, intent_kind) pair, need refs present in the context and resolving
    in the Graph to Accepted Stakeholder nodes, concern name and description without leading/trailing whitespace or control characters); any
    failure is a typed RequirementCompilationError and the whole output is rejected, never treated as absence or partially used. RequirementCompilationError
    covers at least InvalidInput, InferenceConstruction, InvalidInferenceArtifact, SchemaCompilation, SchemaInvalid, ClassificationCoverage,
    UnknownCandidate, DuplicateClassification, DuplicateIntent, InvalidIntentReference, InvalidProposal and Core, with no stable public codes.
    A null requirement_kind with an explicit source kind uses the source kind; without one it is RequirementKindUnknown. A null level is RequirementLevelUnknown.
    A null kind or level is the classifier declining, not an inference failure.'
  - 'Proposals and results (Hotfix 026). When kind, level and modality are known the Requirement payload is { statement, requirement_kind, level,
    modality, title: None, rationale: None, priority: None, source_identifier, verification_method: None, owner_refs: None, stakeholder_refs:
    None }. Valid intents create Goal { statement: clean statement, success_measures: None, priority: None }, Need { statement: clean statement,
    stakeholder_refs: sorted supplied refs, goal_refs: None, context: None }, Concern { name, description } from the inference and Constraint
    { statement: clean statement, constraint_category, strength } from the inference with no defaults; an explicit [constraint] label never
    creates a Constraint node, and wording never creates Goal, Need or Concern. No relation (addresses, refines, decomposes_to, depends_on,
    implements or any other) is created and same-candidate evidence implies no intent lineage. Each node gets its own Proposal::new with stage
    S1, PatchSet { base_semantic_hash: graph.semantic_hash(), patch: SemanticPatch::AddNode { node } }, evidence_refs exactly [the candidate''s
    EvidenceFragment], derivation_refs [classification derivation_ref], materiality Semantic, acceptance_policy HumanConfirm and confidence
    None; never AUTO_DERIVATION or AUTO_NON_SEMANTIC and never an Accepted node. RequirementCompilationResult { proposals: Vec<Proposal>, unresolved:
    Vec<RequirementCompilationIssue> } has proposals sorted by proposed node ID and issues sorted by candidate_ref, issue kind and token; RequirementCompilationIssue
    is ClassificationUnavailable, RequirementKindUnknown, RequirementLevelUnknown, MissingModality, UnsupportedModality { token } or EmptyStatement,
    each with candidate_ref; issues are compilation outcomes, not Finding nodes, and have no rule IDs. Results are independent of the order
