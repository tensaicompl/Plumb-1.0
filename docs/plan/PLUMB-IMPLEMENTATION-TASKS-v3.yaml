  - SRCREF-563DAF2FEF
  forbidden:
  - Do not call an LLM from segment evaluation.
  - Do not create a requirement without an EvidenceFragment reference.
  - Do not persist artifacts, mutate a Graph, create a SemanticPatch, Requirement node or Agent, or materialize an LLM DerivationRecord
    in S0.4.
  - Do not modify plumb-inference, plumb-psg or plumb-validation.
  commands:
  - cargo test -p plumb-import segment
  - cargo test -p plumb-import
  - cargo fmt --check
  - cargo clippy --workspace --all-targets -- -D warnings
