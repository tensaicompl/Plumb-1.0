  steps:
  - 'Implement the serializable model of metamodel §20: PatchSet { base_semantic_hash: Hash (HashKind::Semantic), patch: SemanticPatch }, ElementPrecondition
    { id, expected_hash: Hash (HashKind::Generic) }, MergePolicy { KeepPayloadUnionMetadata } (serialized keep_payload_union_metadata) and SemanticPatch
    with exactly 12 variants AddNode, RemoveNode, ReplacePayload, SetStatus, AddEdge, ReplaceEdge, RemoveEdge, MergeNodes, Supersede, AttachEvidence,
    AttachStandardMapping, Compound (tag op = variant name). Unknown variants/fields are rejected; there is no generic escape hatch.'
  - 'Implement apply_patch(base: &Graph, patch_set: &PatchSet) -> Result<ApplyResult { graph: Graph, delta: GraphDelta }, PatchError>. Check base_semantic_hash
    against base.semantic_hash() before any operation; never mutate the base Graph.'
  - Apply the leaf operations of metamodel §20.4 exactly (AddNode, AddEdge, ReplacePayload with same NodeType and derived-identity protection,
    SetStatus, ReplaceEdge preserving id/status/evidence/derivations/standards/audit, RemoveNode/RemoveEdge without cascade and with the incident-edge
    check and the conservative exact-ID JSON reference guard, MergeNodes for Requirement/Term only with the union rules and MergeExtensionConflict,
    Supersede with an explicitly supplied Accepted supersedes edge, AttachEvidence, AttachStandardMapping), checking every ElementPrecondition
    against the working element hash immediately before its leaf operation and running local Node/Edge validation immediately after each local
    change. IDs that existed or were removed in the PatchSet cannot be reused.
  - 'Compound is non-empty, flattened depth-first, and atomic: do not call Graph::new() between children or enforce graph-wide constraints between
    them; construct and validate exactly one final Graph after all leaves. Any child or final failure discards the candidate and returns no Graph
    or GraphDelta.'
  - 'Before final Graph construction finalize element revisions once per PatchSet by the element-hash rule of metamodel §4.5 (changed surviving
    element: base revision + 1; unchanged: base revision; new: 1; overflow from u32::MAX fails the PatchSet).'
  - 'Return GraphDelta { base_semantic_hash, result_semantic_hash, touched_nodes, touched_edges, added_nodes, removed_nodes, modified_nodes, added_edges,
    removed_edges, modified_edges, diff: Vec<DiffEntry> }. touched_* contains every element touched by any evaluated leaf; added/removed/modified
    are the net base-vs-final persisted difference (modified uses persisted equality). DiffEntry { element_kind: Node|Edge, id, operation_ordinal
    (depth-first leaf ordinal; automatic changes of one leaf share it), change: Added|Removed|Modified, before_hash, after_hash } with generic
    element hashes (None before for Added, None after for Removed); diff is sorted by element ID, then operation ordinal, then Node before Edge.'
  - Use a typed PatchError distinguishing at least InvalidBaseHashKind, StaleBase, InvalidExpectedHashKind, ElementNotFound, ExpectedNode, ExpectedEdge,
    ElementHashMismatch, IdAlreadyExists, IdReused, NewElementRevisionNotOne, StatusMismatch, StatusNoOp, NodeTypeChange, DerivedIdentityChange,
    IncidentEdgesPreventRemoval, ReferencedElement, EmptyCompound, EmptyMerge, DuplicateMergeTarget, MergeContainsKeep, MergeTypeMismatch, MergeTypeUnsupported,
    MergeExtensionConflict, InvalidSupersede, DuplicateEvidenceAttachment, DuplicateStandardMappingAttachment, RevisionOverflow, InvalidLocalNode,
    InvalidLocalEdge, FinalGraphInvalid(Vec<GraphViolation>) and Canonicalization.
  - 'Implement SemanticPatch::inverse() -> Result<Option<SemanticPatch>, CoreError>: AddNode -> RemoveNode and AddEdge -> RemoveEdge using the
    supplied element hash; Compound only when every child is invertible (children reversed); None for every other variant. Do not fabricate missing
    previous values and do not provide a PatchSet inverse.'
  - 'Tests in crates/plumb-patch/tests/patch.rs cover at minimum: hand-authored fixed JSON round-trips for PatchSet, all 12 variants, ElementPrecondition
    and MergePolicy, and rejection of unknown fields/ops and wrong hash kinds; base CAS and element preconditions (stale base, Node/Edge hash
    mismatch, Proposed/Rejected elements, later child seeing earlier child state); Compound atomicity (Add Attribute alone fails, Attribute +
    has_attribute succeeds, edge before endpoint succeeds, child/final failures return no Graph, base unchanged, depth-first order, empty Compound
    rejected); revision semantics (new revision 1, single increment, two edits increment once, edit+reversal restores, View layout-only unchanged,
    added-then-modified stays 1, u32::MAX overflow fails, audit/derivation exclusion); ReplacePayload, ReplaceEdge, removal/reference guard, MergeNodes
    (Requirement and Term), Supersede, AttachEvidence/AttachStandardMapping, GraphDelta/diff and inverse behaviors of metamodel §20.4; and proptest
    determinism (equal inputs give equal Graph and byte-identical GraphDelta, deterministic Compound, AddNode/AddEdge inverse round trips).'
  tests:
  - cargo test -p plumb-patch
  - cargo test --workspace
  acceptance:
  - PatchSet and all 12 SemanticPatch variants round-trip through fixed JSON fixtures; apply_patch enforces the semantic-hash base precondition,
    per-leaf element-hash preconditions and all metamodel §20.4 operation rules; Compound is atomic with one final Graph validation and no partial
    result on failure; element revisions follow the element-hash rule; GraphDelta and diff are deterministic; inverses exist only where derivable
    from patch input; property tests cover determinism and AddNode/AddEdge inverse round trips.
  source_refs:
  - SRCREF-4C3A2D5489
  - SRCREF-76F0A59202
  forbidden:
  - Do not use Box<dyn Patch>.
  - Do not mutate Graph in place.
  - Do not add a generic operation or property escape hatch to SemanticPatch, and do not cascade removals or rewrite references automatically.
  commands:
  - cargo test -p plumb-patch
  - cargo fmt --check
  - cargo clippy --workspace --all-targets -- -D warnings
  - cargo test --workspace
