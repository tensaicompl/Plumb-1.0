  - 'Provide Graph::new(project_id, profile_id, nodes: Vec<Node>, edges: Vec<Edge>) -> Result<Graph, Vec<GraphViolation>>, Graph::validate(&self),
    project_id(), profile_id(), node(&Id), edge(&Id), nodes(), edges(), and read-only deterministic index lookups by NodeType, RelationKind, outgoing
    node and incoming node. Graph::new detects duplicate node IDs, duplicate edge IDs and node/edge ID collisions before building maps and never
    silently overwrites.'
  - 'Graph validation performs, in order, and reports typed deterministic GraphViolations without stopping at the first (except when duplicate
    IDs make map construction impossible): (1) node local validation; (2) edge local validation; (3) global ID uniqueness; (4) relation shape
    validation for every edge regardless of status; (5) baseline edge endpoints must be baseline-participating; (6) EvidenceRef resolution to
    an existing EvidenceFragment, baseline-participating when the owner is; (7) DerivationRef resolution to an existing DerivationRecord, baseline-participating
    when the owner is; (8) EvidenceFragment.source_ref resolution to an existing SourceArtifact, baseline-participating when the fragment is;
    (9) SourceArtifact/EvidenceFragment content_hash must be HashKind::Generic; (10) SourceArtifact ID = src:<first16 hex of content_hash>; (11)
    EvidenceFragment ID = evd:<first16 hex of SHA-256(source_ref || "|" || RFC 8785 JSON of locator)>; (12) no two baseline-participating edges
    share a semantic relation key (metamodel §17.9); (13) baseline relation cardinality; (14) baseline relation cycles.'
