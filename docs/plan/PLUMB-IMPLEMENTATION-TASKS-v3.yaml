- id: S1.3
  title: Implement duplicate detection and supersession proposals
  phase: S1
  scope: NOW
  depends_on:
  - S1.2
  files:
  - crates/plumb-functional/src/lib.rs
  - crates/plumb-functional/src/duplicates.rs
  - crates/plumb-functional/tests/duplicates.rs
  steps:
  - Implement normalized Jaccard duplicate score using the threshold from profile configuration, supplied by the caller as an already-resolved
    DuplicatePolicy (never hard-coded or read from a file by S1.3).
  - Return duplicate/near-duplicate matches, F1 finding material for Accepted/Accepted matches and merge/supersede proposals; never auto-merge,
    auto-supersede or apply anything.
  - Use MergeNodes only when the two requirements assert the same active obligation (an Exact match with identical Requirement payloads) and
    neither is identified as a later replacement; preserve evidence from both, and propose a merge only when the canonical patch engine accepts
    it.
  - Use Supersede only when an explicit governed Accepted human ResolutionDecision identifies one requirement as replacing the other; evidence
    wording alone never establishes direction. Preserve both nodes and the supersedes relation.
  - 'Scope, policy and boundary (Hotfix 028). S1.3 has three distinct responsibilities: deterministic detection of active duplicate and near-duplicate
    Requirement pairs, F1-compatible duplicate finding material for Accepted/Accepted pairs, and governed merge or supersession Proposals only
    when the patch is unambiguous and valid; a match never implies a safe merge and lexical similarity never implies supersession. The allowlist
    adds crates/plumb-functional/src/lib.rs; Cargo.toml and Cargo.lock do not change (existing plumb-core, plumb-psg, plumb-patch, plumb-validation,
    serde, serde_json, serde_yaml, unicode-normalization, rust_decimal and thiserror suffice; an unexpected dependency need blocks the task).
    DuplicatePolicy { jaccard_threshold: Decimal } requires 0 < threshold <= 1 (otherwise InvalidPolicy) and is supplied by the caller from
    active project/compiler profile configuration; S1.3 reads no profile.yaml, fixture, filesystem, CompileContext or environment, and the
    HR test resolves duplicate_jaccard: 0.8 from fixtures/hr-leave/profile.yaml in test code. duplicate_jaccard is not added to the rules YAML.
    analyze_requirement_duplicates(graph, policy) -> Result<DuplicateAnalysisResult, DuplicateError> reads every Requirement from the Graph
    (no caller payload copies), takes no provider, clock, store or filesystem, and requires graph.profile_id() to equal the profile_id of load_builtin_software_profile()
    (otherwise InvalidInput). DuplicateError covers at least InvalidPolicy, InvalidInput, ValidationProfile, GeneratedFinding, InvalidSupersessionDecision,
    AmbiguousSupersessionDecision, InvalidProposal and Core. lib.rs exports DuplicatePolicy, JaccardScore, DuplicateMatchKind, MergeDisposition,
    DuplicateMatch, DuplicateResolutionProposal, DuplicateAnalysisResult, DuplicateError and analyze_requirement_duplicates; tokenizer internals
    stay private. Production duplicates.rs has no fixture-specific values (HR identifiers, leave, a hard-coded 0.8 policy, fixture file names).'
  - 'Detection (Hotfix 028). Pairs are formed from Requirement nodes with status Proposed or Accepted (Rejected, Superseded, Deprecated and
    Suspect are excluded), compared pairwise (O(n^2) is acceptable; no approximate index or embedding), and include cross-source pairs such
    as corresponding Markdown/DOCX HR requirements; equal source identifiers or different source kinds never suppress a comparison. The input
    is the current Requirement.statement (an accepted EARS rewrite is the current canonical wording; source text is not recovered). Normalization:
    Unicode NFKC, Rust Unicode lowercase, tokens as maximal runs of char::is_alphanumeric characters with every other character a separator,
    empty tokens discarded; no stopword removal, stemming, lemmatization, singularization, LLM, locale collation, modal removal or number removal.
    Each statement yields a token sequence (order and repetition) and a token set; an empty token set matches nothing. Two Requirements are
    candidates only when requirement_kind, level and modality are equal and owner_refs and stakeholder_refs are equal as sets (None equals
    Some([]); order and repetition ignored); title, rationale, priority, source_identifier and verification_method do not affect detection.
    JaccardScore { intersection: u32, union: u32 } holds exact integer counts of the token sets; a pair matches when union > 0 and intersection/union
    >= threshold, compared exactly with rust_decimal (equality matches, e.g. 4/5 at 0.8), never with binary floating point. DuplicateMatchKind
    is Exact when the token sequences are equal and Near otherwise (a set-equal score of 1 with different sequences is Near). DuplicateMatch
    { left_ref, right_ref, match_kind, score, merge_disposition } is stored with left_ref < right_ref, and matches are sorted by left_ref then
    right_ref independently of graph insertion order.'
  - 'Finding material (Hotfix 028). Only Accepted/Accepted matches produce F1 material; Proposed/Proposed and Proposed/Accepted matches remain
    DuplicateMatch data only, and no new finding code (no warning, info or S1-specific code) is introduced. The material is plumb_validation::GeneratedFinding::for_violation
    over the actual PLUMB.F1.REQ.NO_DUPLICATE_ACCEPTED RuleMetadata of the built-in profile (severity, family, status and standard reference
    come from that metadata: Blocker, F1, Open, no standard ref, no waiver), targets [left_ref, right_ref], semantic_condition_key active_requirement_duplicate
    for both match kinds, so key = SHA-256(rule_id 0x00 left_ref 0x00 right_ref 0x00 active_requirement_duplicate) and id = fnd:<first 16 hex>
    by the existing finding_key/finding_id (no second identity algorithm). The message is ''Accepted requirements <left> and <right> have identical
    normalized obligation text.'' for Exact and ''Accepted requirements <left> and <right> meet the configured duplicate Jaccard threshold
    (<intersection>/<union>).'' for Near; the suggested resolution is ''Review the pair and either merge a lossless exact duplicate, supersede
    a replaced requirement through a governed decision, or resolve/waive the finding as intentionally distinct.'' Findings are sorted unique
    by Finding ID. S1.3 returns finding material only and builds or persists no Finding node envelope (compiler architecture §29); the detector
    flags a possible unresolved duplicate and does not claim proof of semantic equivalence.'
  - 'Merge (Hotfix 028). MergeDisposition is one of ReviewOnly, UnavailablePayloadDifference, UnavailableExtensionConflict { key }, UnavailablePatchConstraint
    { reason } (diagnostic only, never part of any identity or hash), MergeProposed { proposal_ref } and SupersessionDirected { decision_ref,
    proposal_ref }. Near matches are ReviewOnly with no merge proposal. An Exact match with unequal Requirement payloads (including source_identifier,
    priority, rationale, verification_method, owner_refs or stakeholder_refs) is UnavailablePayloadDifference, because MergeNodes keeps only
    the keep payload. For an Exact match with equal payloads the keep node is the Accepted one when exactly one is Accepted, otherwise the
    lexicographically smaller ID, and the patch is MergeNodes { keep: ElementPrecondition(keep, node_element_hash), merge: [ElementPrecondition(other,
    node_element_hash)], field_policy: KeepPayloadUnionMetadata } on base graph.semantic_hash(), in a Proposal with evidence_refs the sorted
    unique union of both nodes'' evidence, derivation_refs [], materiality MaterialDecision, acceptance_policy HumanDecision and confidence
    None (never Semantic/HumanConfirm, AutoDerivation, AutoNonSemantic or ProfilePolicy). S1.3 dry-validates it with plumb_patch::apply_patch
    in memory and discards the candidate graph; PatchError::MergeExtensionConflict { key } gives UnavailableExtensionConflict { key } and any
    other rejection (incident edges, surviving references, preconditions) gives UnavailablePatchConstraint, never a top-level error and never
    a proposal. Generic MergeNodes, MergePolicy, plumb-patch and metamodel §20 are not changed; S1.1 requirements with distinct plumb_functional:segment_origin
    values are detected (and get F1 material when both are Accepted) but receive no merge proposal, and no origin is discarded, chosen or rewritten.
    No Compound, RemoveEdge, ReplaceEdge, reference rewrite or relation rewiring is created to force a merge. A merge proposal is never applied
    by S1.3 and is still a human decision even when lossless.'
  - 'Supersession (Hotfix 028). Supersession is never inferred from wording, Jaccard, order, dates, IDs or words such as new, replaces, updated
    or version, and may target a pair below the threshold. It is driven only by an Accepted ResolutionDecision node whose answer is exactly
    {"kind": "requirement_supersession", "old_ref": <Id>, "new_ref": <Id>} (case-sensitive kind, no other fields), with a non-empty rationale
    without leading/trailing whitespace or control characters (not trimmed), and at least one Accepted resolves edge from the decision to an
    Accepted Finding or Question; old_ref != new_ref and both resolve to Accepted Requirements. Answers of other kinds and decisions that are
    not Accepted are ignored; an Accepted decision with kind requirement_supersession that is malformed, ungoverned, lacks rationale or targets
    a non-Accepted (Proposed, already Superseded, Rejected, Deprecated or Suspect) Requirement is InvalidSupersessionDecision. Two or more
    qualifying decisions for the same old_ref, whether to different or the same new_ref, are AmbiguousSupersessionDecision (no selection by
    time, ID or rationale). S1.3 does not reinterpret decision.patch_ref or decision.proposal_ref; F3 owns decision/application consistency.
    The patch is Supersede { old: ElementPrecondition(old), new: ElementPrecondition(new), edge } with edge id rel:<first 16 lowercase hex
    of SHA-256 of the RFC 8785 JSON {"kind": "supersedes", "from": new_ref, "to": old_ref}>, revision 1, status Accepted, kind supersedes,
    from new_ref, to old_ref, properties None, evidence the sorted unique union of both requirements'' evidence, derivations [], standards
    [], audit created_by/created_at = decision decided_by/decided_at and updated_by/updated_at None; base graph.semantic_hash(); Proposal evidence_refs
    the same union, derivation_refs [], MaterialDecision, HumanDecision, confidence None. It is dry-validated with apply_patch in memory (graph
    discarded); any failure, including a supersession cycle, is InvalidSupersessionDecision and no proposal is returned. A valid supersession
    of an Exact duplicate pair takes precedence over merge (disposition SupersessionDirected, no MergeNodes proposal). Applying it (only in
    tests) marks the old Requirement Superseded, keeps the new one and adds the edge, after which the pair leaves active duplicate scope; S1.3
    creates no ResolutionDecision, Finding node, close patch or ignore_duplicate extension, and false positives are resolved through governed
    finding resolution or waiver.'
  - 'Result, guard and tests (Hotfix 028). DuplicateAnalysisResult { matches, findings: Vec<GeneratedFinding>, proposals: Vec<DuplicateResolutionProposal>
    } with DuplicateResolutionProposal::Merge { left_ref, right_ref, proposal } and Supersede { old_ref, new_ref, decision_ref, proposal },
    merges ordered by (left_ref, right_ref) before supersessions ordered by (old_ref, new_ref, decision_ref); results are independent of graph
    insertion order. Production duplicates.rs contains no std::fs, File::open, ArtifactStore, rusqlite, SystemClock, Clock::now, Utc::now,
    Instant::now, reqwest, InferenceProvider, InferenceRequest, MockProvider, RevisionStore, branch commit or unsafe, and calls apply_patch
    only to dry-validate merge and supersession proposals; there is no LLM, prompt, schema or persistence. Tests (all selected by the filter
    duplicates) cover policy validation and the HR profile threshold, normalization goldens (case, punctuation, hyphen, composed/decomposed
    Unicode, numbers, repeated tokens, stopwords kept, punctuation-only statements), an independently computed Jaccard golden and the exact
    4/5 boundary, threshold sensitivity, Exact versus Near, scope mismatches (kind, level, modality, owner_refs, stakeholder_refs), source_identifier
    differences, current EARS statements, status pairs (Proposed/Proposed, Proposed/Accepted, Accepted/Accepted, Accepted/Superseded, Accepted/Suspect),
    finding metadata from the real profile with independently computed finding key and ID goldens, the synthetic exact-duplicate merge fixture
    built in tests/duplicates.rs (no fixture file is added or edited: one Exact match, one finding, one MergeNodes proposal applied in test
    code leaving one Requirement with the keep payload and the exact evidence union), the segment_origin conflict, payload-difference, near,
    incident-edge and surviving-reference cases, keep-node policy, proposal provenance, the supersession marker parser, governance, rationale,
    status, ambiguity, cycle and low-similarity cases with an independently computed rel: edge ID golden and test-code application, and the
    HR cross-format integration (all 32 corresponding Markdown/DOCX pairs detected as Exact matches, findings only for an Accepted variant,
    no merge proposals).'
  tests:
  - cargo test -p plumb-functional duplicates
  - cargo test -p plumb-functional
  - cargo test --workspace --no-fail-fast
  acceptance:
  - Exact duplicate fixture (a deterministic synthetic fixture built inside tests/duplicates.rs) is detected deterministically; accepting merge
    preserves all evidence references.
  - The threshold is caller/profile supplied, matching is exact and deterministic over Proposed/Accepted pairs, F1 finding material reuses
    the existing GeneratedFinding identity only for Accepted/Accepted pairs, near duplicates and payload-different or provenance-conflicting
    pairs never receive a merge proposal, and S1.1 segment-origin conflicts block merge without losing provenance.
  - Supersession comes only from a governed Accepted human ResolutionDecision, may target a pair below the threshold, uses a deterministic
    supersedes edge and is dry-validated; every merge and supersede proposal is MaterialDecision / HumanDecision, and S1.3 applies nothing,
    calls no LLM and persists nothing.
  source_refs:
  - SRCREF-BB7E8B02A9
  - SRCREF-97536C2180
  forbidden:
  - Do not change MergeNodes, MergePolicy, plumb-patch or the metamodel merge semantics, and do not discard, choose or rewrite segment_origin
    provenance to make a merge possible.
  - Do not infer supersession from wording, similarity, ordering or dates, and do not create a ResolutionDecision, Finding node or new finding
    code.
  - Do not apply, commit or persist any proposal; apply_patch is used only for in-memory dry-validation.
  commands:
  - cargo test -p plumb-functional duplicates
  - cargo test -p plumb-functional
  - cargo fmt --check
  - cargo clippy --workspace --all-targets -- -D warnings
  - cargo test --workspace --no-fail-fast
  commit_message: 'S1.3: Implement duplicate detection and supersession proposals'
- id: S1.4
  title: Implement deterministic requirement lint pack and benchmark framework
  phase: S1
  scope: NOW
  depends_on:
  - S1.3
  files:
  - crates/plumb-lint/Cargo.toml
  - crates/plumb-lint/src/lib.rs
  - crates/plumb-lint/src/rules.rs
  - crates/plumb-lint/src/benchmark.rs
  - crates/plumb-lint/tests/rules.rs
  - Cargo.lock
  steps:
  - Implement the 15 pilot lint rules listed in v2 M2.1 with stable IDs.
  - Every lint diagnostic has an exact UTF-8 byte range in the current Requirement.statement. When the current statement is byte-identical
    to an anchored source statement, Plumb additionally records the exact corresponding EvidenceFragment byte range. When no exact one-to-one
    evidence mapping exists, evidence_range is None. Plumb never fabricates source offsets for transformed text.
  - Benchmark precision/recall per rule on an externally supplied human-labelled corpus; if measured precision is below 0.85, the benchmark
    recommends warn as the effective severity through caller configuration, never by code or registry mutation.
  - Regression test fails if precision drops by more than 0.03 from baseline.
  - Scope and corpus boundary (Hotfix 029). S1.4 separates implementation qualification from external empirical corpus qualification. It implements
    the fifteen deterministic lint rules, typed diagnostics, exact statement spans, honest optional evidence spans, the severity policy, the
    corpus parser/validator, benchmark metrics, agreement counts, the precision-regression check and the severity recommendation, tested on
    obviously synthetic data inside tests/rules.rs. It does not create or modify fixtures/lint-corpus/* (corpus.jsonl and baseline.json stay
    reserved for externally supplied human-labelled qualification data, and their absence must not break cargo test -p plumb-lint), and never
    fabricates sentences, human labels, annotator identities, agreement, precision, recall or baseline values; until a real corpus is run,
    Plumb claims only that the benchmark framework is implemented and deterministically tested. The 200-sentence / two-domain / two-human-annotator
    corpus remains a pilot qualification artifact to be supplied externally; its absence does not block S1.5. crates/plumb-lint/Cargo.toml
    adds exactly serde_json = { workspace = true } (Cargo.lock only as Cargo requires); no other dependency, and in particular no plumb-functional
    dependency (plumb-validation must later be able to depend on plumb-lint without a cycle) and no plumb-validation dependency. Outputs are
    deterministic analysis material (LintDiagnostic, LintRuleEvaluation, LintResult, BenchmarkReport), never Finding, Question or ResolutionDecision
    nodes, SemanticPatch or Proposal; production code has no filesystem, network, LLM/provider/inference, store, clock or graph capability
    and parses caller-supplied text only.
  - 'Input, ranges and policy (Hotfix 029). The lint subject is the current Requirement.statement (after an accepted S1.2 rewrite it is the
    canonical wording; the original is never silently substituted). LintInput { requirement_ref, statement, evidence_refs (sorted unique),
    source_anchor: Option<EvidenceStatementAnchor { fragment_ref, fragment_text, statement_start, statement_end }>, term_context: Option<TermLintContext>
    } and the other wire structs deny unknown fields. A valid anchor has statement_start < statement_end <= fragment_text byte length on UTF-8
    boundaries, fragment_text[statement_start..statement_end] equal to the statement and fragment_ref in evidence_refs, otherwise InvalidSourceAnchor;
    it is None whenever the current statement differs from the evidence-derived source statement (no partial or fuzzy mapping). LintTextRange
    { start, end } is a valid UTF-8 range of the statement; LintEvidenceRange { fragment_ref, start, end } is the statement range shifted
    by statement_start and is emitted only after asserting the fragment bytes equal the statement bytes. An empty or whitespace-only statement
    is InvalidInput (F1 already has ISO29148.F1.REQ.STATEMENT_PRESENT). LintSeverity is exactly info, warn, error; LintPolicy { severity_overrides:
    BTreeMap<LintRuleId, LintSeverity> } (default empty) gives the effective severity as override else default, and changes nothing but effective_severity.
    All input is validated before any rule runs. lint_requirement(input, policy) -> Result<LintResult, LintError> and lint_requirements(inputs,
    policy) (unique requirement_ref, otherwise InvalidInput; results sorted by requirement_ref) are pure. LintResult { requirement_ref, evaluations
    (exactly fifteen LintRuleEvaluation { rule_id, applicability: Evaluated | NotEvaluated { reason }, diagnostics }, one per rule), diagnostics
    }; LintDiagnostic { rule_id, default_severity, effective_severity, requirement_ref, statement_range, evidence_range, message } sorted
    by rule_id wire value, start, end, message and unique (different rules are never suppressed against each other). LintError covers at least
    InvalidInput, InvalidPolicy, InvalidSourceAnchor, InvalidTermContext, CorpusParse, CorpusValidation, Benchmark and Core.'
  - 'The fifteen rules (Hotfix 029). LintRuleId is a closed enum whose ALL lists exactly, in order, with default severities: PLUMB.LINT.REQ.VAGUE_TERM
    warn, PASSIVE_NO_ACTOR warn, UNMEASURABLE_QUALIFIER error, COMPOUND_MODAL warn, NEGATION_STACK warn, ESCAPE_CLAUSE warn, OPEN_LIST error,
    PRONOUN_NO_ANTECEDENT warn, UI_PHRASED warn, UNDEFINED_TERM error, EARS_ORDER warn, NUMBER_NO_UNIT error, RELATIVE_TIME_NO_ANCHOR error,
    MISSING_ACTOR error, AMBIGUOUS_QUANTIFIER warn (all prefixed PLUMB.LINT.REQ.); each LintRuleDefinition { id, description, default_severity
    } is an immutable registry entry. These are lint codes, not validation-rule metadata. Dictionary phrases match ASCII case-insensitively
    with word characters [A-Za-z0-9_] and match boundaries outside word characters; lexical tokens are maximal [A-Za-z0-9_] runs with exact
    byte offsets; the persisted statement is never normalized. Vocabularies are exactly those of Hotfix 029 §§43-82 and may not be expanded:
    VAGUE_TERM appropriate, adequate, reasonable, suitable, sufficient, acceptable, normal; PASSIVE_NO_ACTOR a modal (shall, should, may,
    must, can), optional not, be and a participle (lowercase token ending in ed or en, or built, done, given, kept, known, made, read, sent,
    set, shown, taken, written) with no whole-word by before the next ; . ? ! (range be..participle); UNMEASURABLE_QUALIFIER quickly, promptly,
    rapidly, efficiently, easily, seamlessly, reliably, user-friendly, intuitive; COMPOUND_MODAL each whole-word shall after the first; NEGATION_STACK
    each of not, no, never, without after the first in a clause split by ; . ? !; ESCAPE_CLAUSE if possible, where possible, if practical,
    where practical, as applicable, where applicable, unless otherwise specified, unless otherwise stated, as needed, as necessary; OPEN_LIST
    etc, etc. (longest match, one diagnostic), and so on, and the like, including but not limited to, including without limitation, among
    others; PRONOUN_NO_ANTECEDENT it, they, them, he, she in subject position (first token, or for a statement beginning When/While/Where/If
    with a comma before the first modal the first token after that comma, skipping then); UI_PHRASED an action (click, tap, press, swipe as
    words; double-click as a phrase) together with a noun (button, link, icon, checkbox, dropdown, menu, tab, screen, page, dialog, window),
    ranged from the action to the nearest following noun or else from the nearest preceding noun to the action; UNDEFINED_TERM only through
    a supplied TermLintContext { defined_term_keys, mentions: [TermMention { range, normalized_key }] } (mentions valid, clean, sorted, unique;
    a diagnostic exactly at each mention whose key is undefined; without context NotEvaluated with reason ''term mention context is unavailable
    until vocabulary analysis'', and no heuristic term discovery); EARS_ORDER a when/while/where/if beginning after the first modal, or a
    then before the first modal with no preceding if; NUMBER_NO_UNIT a [0-9]+ or [0-9]+.[0-9]+ token not followed by optional whitespace and
    %, not followed (only ASCII whitespace between, no clause punctuation) by a lexical token, and not preceded by version, release, section,
    id, code, step or phase; RELATIVE_TIME_NO_ANCHOR within, no later than or no earlier than followed by a number and a time unit (ms, s,
    sec, second(s), min, minute(s), h, hr, hrs, hour(s), day(s), week(s), month(s), year(s), millisecond(s)) with none of of, after, from,
    following, upon among the next three tokens (range starter..unit); MISSING_ACTOR the first modal when the text since the nearest preceding
    , ; : . ? ! (or the start) holds no token other than a, an, the, when, while, where, if, then; AMBIGUOUS_QUANTIFIER some, several, many,
    few, most, various, multiple, numerous, frequently, occasionally, regularly, often. Messages are the exact Hotfix 029 texts. Only UNDEFINED_TERM
    may be NotEvaluated; the other fourteen are always Evaluated for a valid statement. The S1.4 undefined-term lint is auxiliary; PLUMB.F1.REQ.TERMS_RESOLVED
    remains the canonical gate rule for unresolved vocabulary.'
  - 'Benchmark framework (Hotfix 029). parse_corpus_jsonl(&str) -> Result<LintCorpus, LintError> ignores only completely empty lines and requires
    the first record to be the metadata object {record_type: metadata, version: 1, corpus_id, annotators: [exactly two distinct clean IDs]}
    and every later record a sentence {record_type: sentence, id (clean, unique), domain (clean), text, annotations (exactly two, one per
    metadata annotator, each with sorted unique positive_rule_ids), adjudicated_positive_rule_ids (sorted unique)}; unknown fields, unknown
    rule IDs, other versions, a second or late metadata record and missing metadata are errors. Adjudicated labels are the human-approved
    benchmark truth (never derived from the annotators); raw annotations are used only for exact binary agreement counts per sentence and
    rule (AgreementReport { agreements, disagreements, per_rule: RuleAgreement }), with no kappa, alpha or agreement pass threshold. validate_pilot_qualification_corpus
    requires exactly 200 sentences, two annotators, at least two domains and the fifteen known rule IDs; synthetic test corpora are not padded
    to qualify. run_benchmark computes per evaluated rule RuleBenchmarkMetrics { rule_id, true_positive, false_positive, false_negative, true_negative
    } with explicit applicability; UNDEFINED_TERM is NotEvaluated without corpus term context (version 1 carries none) and is never counted
    as all-negative. Precision TP/(TP+FP) and recall TP/(TP+FN) are undefined (never 0 or 1) when the denominator is zero and are compared
    by u128 cross-multiplication, never binary floating point. An evaluated rule with defined precision below 85/100 (0.85 itself does not)
    gets SeverityRecommendation { rule_id, recommended_severity: warn, reason }; nothing is ever upgraded and the registry is never mutated.
    BenchmarkReport { corpus_id, sentence_count, metrics, agreement, severity_recommendations } and BenchmarkBaseline { version, corpus_id,
    corpus_sentence_count, per_rule, agreement } are canonical and serializable but never written by S1.4. compare_to_baseline(report, baseline)
    requires the same corpus_id and rule set and fails a rule when old minus new precision exceeds 3/100 (exactly 0.03 passes); a rule with
    undefined precision on either side, or not evaluated, is NotComparable. Tests (cargo test -p plumb-lint) cover the registry snapshot,
    a positive and negative fixture for every rule (UNDEFINED_TERM also NotEvaluated), the Hotfix 029 examples, UTF-8 spans, exact evidence
    mapping, absent and bad anchors, severity overrides, batch ordering and the synthetic benchmark (corpus_id synthetic-test, annotators
    test-a and test-b) with hard-coded confusion counts, agreement counts, the 17/20 and 16/20 precision boundary, undefined precision, the
    0.03 regression boundary, NotComparable, parser strictness and 199/201-sentence qualification rejection; no wording anywhere claims a
    measured lint precision.'
  tests:
  - cargo test -p plumb-lint
  - cargo test --workspace --no-fail-fast
  acceptance:
  - All 15 deterministic lint rules have positive/negative fixtures.
  - Every diagnostic reports an exact current-statement UTF-8 byte range.
  - Exact EvidenceFragment subranges are emitted only when a validated byte-identical source anchor exists.
  - Undefined-term lint is explicitly NotEvaluated without vocabulary context.
  - The strict human-corpus parser, benchmark metrics, agreement calculation, 0.85 severity recommendation and >0.03 precision-regression
    check are implemented and tested on synthetic labelled data.
  - No 200-sentence human corpus or empirical precision claim is fabricated.
  source_refs:
  - SRCREF-EE31682F6E
  forbidden:
  - Do not create or modify fixtures/lint-corpus/*, and do not fabricate corpus sentences, labels, annotators, agreement, precision, recall
    or baselines.
  - Do not depend on plumb-functional or plumb-validation, and do not create Finding nodes, SemanticPatch or Proposal.
  - Do not expand the Hotfix 029 rule vocabularies or let the benchmark mutate rules or severities.
  commands:
  - cargo test -p plumb-lint
  - cargo fmt --check
  - cargo clippy --workspace --all-targets -- -D warnings
  - cargo test --workspace --no-fail-fast
  commit_message: 'S1.4: Implement deterministic requirement lint pack and benchmark framework'
- id: S1.5
  title: Implement vocabulary normalization and typed concept proposals
  phase: S1
  scope: NOW
  depends_on:
  - S1.4
  files:
  - crates/plumb-functional/Cargo.toml
  - crates/plumb-functional/src/lib.rs
  - crates/plumb-functional/src/vocabulary.rs
  - crates/plumb-functional/src/vocabulary_exceptions.rs
  - crates/plumb-functional/tests/vocabulary.rs
  - prompts/s1-vocabulary.md
  - schemas/inference/s1-vocabulary.schema.json
  - Cargo.lock
  steps:
  - Implement NFKC, case normalization, determiner stripping and the explicit singularization exception table stored in crates/plumb-functional/src/vocabulary_exceptions.rs.
  - Generate Term candidates with frequency and co-occurrence.
  - Inference may propose Concept kind only from object_type, fact_type, value_type, role, other.
  - Conflicting type proposals create deterministic vocabulary conflicts, and F1 TERMS_RESOLVED finding material when Accepted
    Requirements are involved; they do not overwrite accepted concepts.
  - Scope and dependencies (Hotfix 030). S1.5 turns current Proposed/Accepted Requirement statements, span-anchored vocabulary
    inference, deterministic normalization and the Accepted vocabulary already in the PSG into vocabulary candidates, frequency/co-occurrence
    statistics, S1.4 TermLintContext values, Proposed Term nodes, optional grounded Proposed Concept nodes, vocabulary conflicts
    and F1 finding material. It never mutates a Graph, applies or commits proposals, calls an LLM/provider, persists inference,
    materializes a DerivationRecord, invents Concept definitions, creates Question, ResolutionDecision or Assumption nodes,
    question rounds or a glossary export (v2 M3.3 is out of scope), creates Entity, Attribute, Actor, BusinessRole or Operation
    nodes (S2 owns domain semantics), creates relations between Requirements and vocabulary, merges vocabulary or replaces
    an Accepted Term or Concept. The allowlist adds crates/plumb-functional/Cargo.toml, crates/plumb-functional/src/lib.rs
    and Cargo.lock; Cargo.toml adds exactly plumb-lint = { path = "../plumb-lint" } so S1.5 produces the real plumb-lint
    TermMention, TermLintContext and LintTextRange (plumb-lint keeps no dependency on plumb-functional or plumb-validation;
    no NLP, stemming, inflection, tokenizer, dictionary, embedding or model library). The F0.14 guard still forbids the token
    Proposal in lib.rs, so lib.rs adds pub mod vocabulary and mod vocabulary_exceptions and exports PILOT_VOCABULARY_LANGUAGE,
    VOCABULARY_CONTEXT_VERSION, VOCABULARY_OUTPUT_VERSION, VOCABULARY_NORMALIZATION_VERSION, VOCABULARY_TASK_KIND, VOCABULARY_ORIGIN_EXTENSION,
    VocabularyPolicy, VocabularyRequirementContext, VocabularyContext, VocabularyRequest, VocabularyInference, VocabularyGroundedRange,
    VocabularyMention, VocabularyTermCandidate, VocabularyCooccurrence, VocabularyOriginMention, VocabularyOrigin, VocabularyLintContext,
    VocabularyConflict, VocabularyIssue, VocabularyAudit, VocabularyAnalysisResult, VocabularyError, build_vocabulary_request,
    analyze_vocabulary and normalize_vocabulary_term. Production vocabulary code contains no fixture-specific words (HR identifiers,
    leave request, employee, manager, Europe/Warsaw, fixture paths) beyond the authorized exception-table entries.
  - 'Normalization (Hotfix 030). The pilot is English-only: PILOT_VOCABULARY_LANGUAGE = "en", VocabularyPolicy { language
    } (deny_unknown_fields, no other field) must have language exactly "en" (otherwise UnsupportedLanguage), and VOCABULARY_NORMALIZATION_VERSION
    = 1. normalize_vocabulary_term applies to the exact selected substring of the current statement: Unicode NFKC; Unicode
    lowercase (char::to_lowercase, not locale-specific; proper nouns are not exempt, original case survives in surface forms);
    maximal runs of char::is_alphanumeric characters as tokens, everything else a separator (so leave-request, leave request
    and leave/request all give leave request); removal of exactly one leading determiner (a, an or the; never in the middle);
    singularization of the final token only by, in order, the irregular table (analyses analysis, buses bus, children child,
    feet foot, geese goose, indices index, matrices matrix, men man, mice mouse, people person, statuses status, teeth tooth,
    vertices vertex, women woman), the invariant table (data, equipment, gas, information, metadata, news, series, software,
    species, staff), the suffix rules (ASCII-lowercase token ending ies with at least one preceding character becomes ...y;
    ending ches, shes, xes, zes or sses drops es; otherwise ending s but not ss, us or is drops s), else unchanged; tokens
    joined by one ASCII space. vocabulary_exceptions.rs holds exactly these two sorted tables and nothing else. No stopword
    removal beyond the first determiner, verb stemming, lemmatization, CamelCase splitting, abbreviation expansion, synonym
    resolution, translation or number stripping. A mention with no alphanumeric token or only a determiner is InvalidMention.
    Examples: The Employees -> employee, leave-requests -> leave request, Policies -> policy, Boxes -> box, Statuses -> status,
    Business -> business, Analysis -> analysis, Data -> data, Café -> café.'
  - 'Inference request (Hotfix 030). Term discovery is span-anchored AI proposal only; there is no deterministic noun extractor
    and no fallback from capitalization, CamelCase, suffixes, actor position, existing entity names or word frequency. Constants
    VOCABULARY_CONTEXT_VERSION = 1, VOCABULARY_OUTPUT_VERSION = 1, VOCABULARY_TASK_KIND = "vocabulary_analysis"; stage StageId::S1.
    Targets are caller-chosen Requirement IDs (duplicates are InvalidInput, never deduplicated) that must exist as Requirement
    nodes with status Proposed or Accepted (missing, wrong type, Rejected, Suspect, Superseded and Deprecated reject). VocabularyContext
    { version: 1, normalization_version: 1, project_id, language: "en", requirements: [VocabularyRequirementContext { requirement_ref,
    status, statement }] } (deny_unknown_fields, non-empty, strictly sorted unique) carries the current Requirement.statement,
    never the recovered source statement and never existing accepted vocabulary (reconciled deterministically after inference).
    context_hash is the Generic SHA-256 of its RFC 8785 JSON. build_vocabulary_request(graph, requirement_refs, policy, provider_policy)
    builds VocabularyRequest { request, context } with input_refs the sorted target IDs, evidence_refs the sorted unique
    union of the targets'' Node.evidence, the context hash, and prompt_template_hash and schema_hash as the Generic SHA-256
    of the exact committed bytes of prompts/s1-vocabulary.md and schemas/inference/s1-vocabulary.schema.json (include_bytes!/include_str!;
    not added to SUPPORTING-DOCS.sha256), with the caller''s ProviderPolicy and no default provider. VocabularyRequest::validate
    checks stage, task_kind, input_refs, evidence_refs, context hash and prompt/schema hashes, and evaluation rebuilds the
    context from the graph, request targets and policy and requires equality (a changed statement, status, project or target
    set is InvalidInput). The prompt carries the Hotfix 030 §58 instructions (exact ranges only, no term text, normalized
    text, aliases, statistics or free definitions, closed concept kinds, null when unsupported, no overlapping mentions,
    JSON only). The Draft 2020-12 schema (additionalProperties false everywhere, no external $ref, no network) has root {version:
    1, mentions} and mentions {requirement_ref, start, end, concept_kind: null or object_type, fact_type, value_type, role,
    other, definition: null or {requirement_ref, start, end}}, all five keys required, a non-null definition only with a
    non-null concept_kind, and no term, surface, normalized_key, name, alias, frequency, cooccurrence or free-text definition
    field; the v2 labels entity, attribute, actor, value, system and unknown are rejected and never mapped.'
  - 'Evaluation and statistics (Hotfix 030). The optional input is VocabularyInference { artifact: &InferenceArtifact, derivation_ref:
    DerivationRef }. Absent inference succeeds with issues [InferenceUnavailable] and no candidates, co-occurrences, lint
    contexts, conflicts, findings or proposals. A supplied inference is validated in order: request validation, context equality,
    InferenceArtifact::validate_for, schema, typed decode, version 1, target refs (UnknownRequirement), mention ranges (start
    < end <= statement length on UTF-8 boundaries, non-empty normalized key; otherwise InvalidMention), exact duplicates
    (DuplicateMention) and overlaps within a Requirement (OverlappingMention; adjacent ranges allowed, nesting not), definition
    grounding (a known target, a valid range, extracted text non-empty without leading/trailing Unicode whitespace or control
    characters, never trimmed; InvalidDefinitionGrounding), then normalization, accepted-vocabulary reconciliation, statistics,
    lint contexts, conflicts and proposals; any failure is a typed VocabularyError (at least InvalidInput, UnsupportedLanguage,
    InferenceConstruction, InvalidInferenceArtifact, SchemaCompilation, SchemaInvalid, UnknownRequirement, InvalidMention,
    DuplicateMention, OverlappingMention, InvalidDefinitionGrounding, ExistingVocabularyCandidateConflict, InvalidProposal,
    ValidationProfile, GeneratedFinding, Core; no stable public codes such as E_VOCAB_*, I_TERM_* or G_TERM_*) and no partial
    output is used. Extraction is open-set, so empty mentions are valid. VocabularyMention { requirement_ref, range: LintTextRange,
    surface (exact statement slice), normalized_key, concept_kind, definition: Option<VocabularyGroundedRange { requirement_ref,
    start, end }> } ranges are statement byte ranges, never claimed as EvidenceFragment ranges. VocabularyTermCandidate {
    normalized_key, language, surface_forms (distinct exact surfaces sorted by bytes), mentions (sorted by requirement_ref,
    start, end), frequency (all occurrences), requirement_count (distinct Requirements) } are sorted unique by key; VocabularyCooccurrence
    { left_key < right_key, requirement_count } counts distinct Requirements containing both keys (repeated mentions add
    nothing) and is sorted. VocabularyLintContext { requirement_ref, context: plumb_lint::TermLintContext } exists for each
    Requirement with mentions, sorted by requirement_ref, with one TermMention per mention in plumb-lint canonical order
    and defined_term_keys the normalized keys of Accepted English Term.term and aliases and Accepted Concept.name only (Proposed,
    Suspect, Rejected, Superseded and Deprecated vocabulary and new S1.5 proposals are not defined), so plumb_lint::lint_requirement
    reports UNDEFINED_TERM exactly at unresolved mentions.'
  - Reconciliation, conflicts and findings (Hotfix 030). Accepted English Terms are indexed by the normalized keys of term
    and aliases, Accepted Concepts by the normalized name. A key matching exactly one Accepted Term creates no Term proposal;
    more than one is AcceptedTermKeyConflict. A key matching exactly one Accepted Concept creates no Concept proposal and
    that Concept is authoritative; more than one is AcceptedConceptKeyConflict. Non-null concept kinds of a key must agree
    (otherwise ConceptKindConflict) and non-null grounded definition texts must be byte-identical (otherwise ConceptDefinitionConflict;
    identical text from several ranges is not a conflict); a validated kind differing from the single matching Accepted Concept's
    kind is AcceptedConceptKindConflict. Accepted Terms and Concepts are never replaced, re-aliased, re-defined, re-statused,
    merged or superseded. VocabularyConflict values carry the key and the involved IDs or kinds and are sorted by normalized
    key, conflict kind and involved values. For a conflict whose contributing mentions include Accepted Requirements, S1.5
    returns plumb_validation GeneratedFinding::for_violation material for the existing PLUMB.F1.REQ.TERMS_RESOLVED rule of
    load_builtin_software_profile() (graph.profile_id() must equal its profile_id, otherwise InvalidInput) with targets the
    sorted unique contributing Accepted Requirement IDs, semantic condition keys vocabulary_concept_kind_conflict:<key>,
    vocabulary_accepted_concept_kind_conflict:<key>, vocabulary_concept_definition_conflict:<key>, vocabulary_accepted_term_key_conflict:<key>
    and vocabulary_accepted_concept_key_conflict:<key>, messages 'Vocabulary term "<key>" has conflicting concept-kind proposals.',
    'Vocabulary term "<key>" conflicts with the kind of an accepted Concept.', 'Vocabulary term "<key>" has conflicting grounded
    Concept definitions.', 'Vocabulary key "<key>" resolves to more than one accepted Term.' and 'Vocabulary key "<key>"
    resolves to more than one accepted Concept.', and the suggested resolution 'Review the vocabulary evidence and establish
    one governed vocabulary interpretation before treating the term as resolved.'; conflicts involving only Proposed Requirements
    produce no finding. Findings are sorted unique by ID; no new rule, no I_TERM_TYPE or I_TERM_CONFLICT and no second finding
    identity are introduced.
  - 'Proposals (Hotfix 030). A new Term has id term:<first 16 lowercase hex of SHA-256 of the RFC 8785 JSON {"project_id",
    "language": "en", "normalized_key", "node_type": "term"}> and payload Term { term: normalized_key, language: "en", definition_ref:
    the single matching Accepted Concept ID when exactly one exists without ambiguity, otherwise None (never a Concept proposed
    in the same run), aliases: the sorted distinct surfaces not byte-equal to the key or None when empty, status: None }.
    A new Concept, created only when no Accepted Concept resolves the key, there is no Concept ambiguity, kind or definition
    conflict, exactly one kind consensus exists and at least one grounded definition exists, has id concept:<same formula
    with node_type concept> and payload Concept { name: normalized_key, definition: the exact grounded text, concept_kind:
    the consensus kind }; without a grounded definition no Concept is created and no definition is fabricated from the key,
    name, a template, model prose or an empty string. IDs depend only on project, language, key and node type. Each node
    has revision 1, status Proposed, evidence the sorted unique evidence of the Requirements contributing mentions (and,
    for a Concept, definition groundings), derivations [], standards [], tags [], caller VocabularyAudit { created_by, created_at
    } (no clock) and exactly one extension plumb_functional:vocabulary_origin holding VocabularyOrigin { language, normalized_key,
    mentions: [VocabularyOriginMention { requirement_ref, start, end }], definition } (deny_unknown_fields; provenance only,
    no kind, frequency, co-occurrence, confidence or status; definition None for a Term and, for a Concept, the first grounding
    range by requirement_ref, start, end). Each node gets its own Proposal (stage S1, PatchSet { base_semantic_hash: graph.semantic_hash(),
    patch: AddNode }, evidence_refs the node evidence, derivation_refs [derivation_ref], Semantic, HumanConfirm, confidence
    None; no Compound), proposals sorted by node ID. If the deterministic ID already exists as the same node type and Proposed
    with identical payload, evidence and origin, no duplicate proposal is emitted; if it exists Accepted as matching vocabulary
    it is existing vocabulary; any other existing node at that ID is ExistingVocabularyCandidateConflict. VocabularyAnalysisResult
    { candidates, cooccurrences, lint_contexts, conflicts, findings, proposals, issues } contains no graph or side effect,
    and VocabularyIssue has at least InferenceUnavailable.'
  - 'Source guard and tests (Hotfix 030). Production vocabulary code contains no std::fs, File::open, ArtifactStore, SqliteArtifactStore,
    SqliteRevisionStore, rusqlite, SystemClock, Clock::now, Utc::now, Instant::now, reqwest, InferenceProvider::execute,
    MockProvider, apply_patch, persist_inference_bundle, materialize_derivation_record, branch mutation, revision commit
    or unsafe; MockProvider is used only in tests/vocabulary.rs keyed by the exact request id, and the prompt and schema
    contain no placeholder or unresolved template marker. Tests (all selected by the filter vocabulary) cover the schema
    (Draft 2020-12, valid empty and null cases, the five v3 kinds, rejection of the six v2 labels, unknown root, mention
    and definition fields, free term text, normalized keys and definition strings), independently computed goldens (Python
    hashlib and canonical JSON) for the prompt and schema hashes, one InferenceRequest.id, the term: and concept: IDs of
    leave request and the normalization table including every exception entry, NFKC, case, determiners and empty mentions,
    request sorting, duplicates, status, hash determinism, refs, provider sensitivity and tampering (stage, task_kind, language,
    normalization version, context hash, refs, prompt and schema hashes), absent and invalid inference, UTF-8, duplicate,
    overlap and adjacent ranges, grounded definitions (the contractor example), kind-without-definition and null kinds, statistics
    goldens, kind and definition consensus and conflicts, Accepted Term, alias and Concept reconciliation and ambiguities,
    definition_ref, aliases, evidence unions, origin JSON, proposal metadata and test-code application, real plumb_lint::lint_requirement
    integration for unresolved and resolved keys, F1 finding metadata, condition keys and the Proposed-only case, determinism
    and audit independence, and the HR integration over real current statements from requirements.md through import, S0.4
    and S1.1 with a fixed mock artifact using null kinds and definitions (keys employee, leave request, leave type, start
    date, end date, manager, leave balance, approval record, audit record and time zone, plural consolidation and replay
    equality); fixtures are not modified.'
  tests:
  - cargo test -p plumb-functional vocabulary
  - cargo test -p plumb-functional
  - cargo test --workspace --no-fail-fast
  acceptance:
  - Vocabulary output is deterministic.
  - The HR vocabulary path executes deterministically over real current Requirement statements using a fixed mock inference
    artifact. Normalization, frequency, co-occurrence, lint-context generation, Term proposal creation and proposal identity
    are stable on replay. No unsupported HR ConceptKind accuracy percentage is claimed because the fixture carries no v3
    ConceptKind oracle.
  - Terms come only from validated inference spans and are Proposed Semantic/HUMAN_CONFIRM nodes; Concepts require a v3 kind
    consensus and an exact grounded definition; accepted vocabulary is never overwritten; Accepted-baseline conflicts reuse
    TERMS_RESOLVED finding material; and S1.5 calls no provider, persists nothing and mutates no graph.
  source_refs:
  - SRCREF-7B43AD5876
  - SRCREF-C0AC034159
  forbidden:
  - Do not add a deterministic term extractor or inference fallback, and do not let the model supply term text, normalized
    keys, aliases, statistics or free-text definitions.
  - Do not overwrite, re-alias, re-define, merge or supersede Accepted Terms or Concepts, and do not create questions, glossary
    output, S2 domain nodes or relations.
  - Do not resurrect I_TERM_TYPE or I_TERM_CONFLICT, add validation rules or claim an HR ConceptKind accuracy.
