- id: S0.2
  title: Implement deterministic minimal DOCX importer
  phase: S0
  scope: NOW
  depends_on:
  - S0.1
  files:
  - crates/plumb-import/src/lib.rs
  - crates/plumb-import/src/docx.rs
  - crates/plumb-import/tests/docx.rs
  steps:
  - 'API and scope. Implement pub fn import_docx(display_name: &str, bytes: &[u8], audit: &ImportAudit) -> Result<ImportedSource, ImportError>,
    exported as plumb_import::import_docx, with no filesystem-path overload. Parse only with the existing zip and quick-xml dependencies,
    entirely in memory; no LibreOffice, python-docx, pandoc, OS conversion, disk write, store, clock, network or graph mutation. Cargo.toml
    is not changed. The only visible evidence surface is word/document.xml (required); word/styles.xml is optional style metadata. Headers,
    footers, comments, footnotes, endnotes, embedded documents and images/OCR are not imported and are never reinterpreted as body evidence.'
  - 'Reuse. DOCX reuses SourceKind::Docx, ExtractedTextArtifact, SourceArtifactLinks, FragmentKind, FragmentMetadata, ParseMetadata,
    ImportAudit, ImportedSource, the shared build_with_parse path and plumb_psg source_artifact_id/evidence_fragment_id; no parallel
    evidence contract exists. The raw ZIP bytes determine the original artifact (source-original, application/vnd.openxmlformats-officedocument.wordprocessingml.document,
    exact bytes), SourceArtifact.content_hash and the src: ID; the extracted artifact is source-extracted, application/json, canonical
    ExtractedTextArtifact JSON.'
  - 'Safety limits: DOCX_MAX_INPUT_BYTES = 128 MiB, DOCX_MAX_ENTRIES = 4096, DOCX_MAX_TOTAL_UNCOMPRESSED_BYTES = 512 MiB (sum of declared
    entry sizes) and DOCX_MAX_XML_PART_BYTES = 32 MiB per XML part actually read, enforced before XML parsing with bounded reads that
    do not trust declared sizes alone; a violation is ImportError::DocxLimit { limit, actual, max } with code E_DOCX_LIMIT. Fatal failures
    map deterministically: not a ZIP or a corrupt central directory -> DocxArchive (E_DOCX_ARCHIVE); missing word/document.xml -> DocxMissingPart
    (E_DOCX_MISSING_PART); malformed WordprocessingML in document.xml or in a present styles.xml, a style cycle or basedOn chain deeper
    than 32, an invalid or zero gridSpan and an unknown vMerge value -> DocxXml (E_DOCX_XML). A fatal failure returns Err and no ImportedSource.'
  - Namespaces. WordprocessingML elements and attributes are matched by namespace URI, never by prefix, accepting http://schemas.openxmlformats.org/wordprocessingml/2006/main
    and http://purl.oclc.org/ooxml/wordprocessingml/main, so documents using w:p and x:p for the same namespace parse identically.
  - 'Extracted-text records. The main body is read in source order into records: a paragraph, a table row, or a flattened unsupported-visible
    top-level body element. ExtractedTextArtifact.text is the records joined by exactly one LF with no trailing LF; an empty paragraph
    is an empty record without a fragment. Paragraph visible text is collected in XML order with w:t -> its text, w:tab -> TAB, w:br
    and w:cr -> LF; inserted and move-to content is included; deleted and move-from content and w:instrText are excluded; text is never
    trimmed, Unicode-normalized or whitespace-collapsed, and Word numbering labels are never synthesized.'
  - 'Paragraph classification. Every non-empty paragraph is one fragment covering its whole record. It is Heading when its effective
    outline level is 0..5, resolved in order from direct w:pPr/w:outlineLvl, then the paragraph style''s effective outlineLvl through
    word/styles.xml and its basedOn chain (depth limit 32), then the exact built-in style IDs Heading1..Heading6; localized style names
    are never used. Otherwise it is ListItem when its effective paragraph properties contain w:numPr directly or through its style chain
    (numbered and bulleted alike, with no fabricated marker). Otherwise it is Paragraph; font size, bold or capitalization never matter.
    Literal leading numbers, bullets or punctuation in w:t never make a paragraph a ListItem: in DOCX the WordprocessingML paragraph
    properties are the list structure, unlike Markdown and plain text where the textual marker is the structure (Hotfix 022).'
  - 'Tables. For each top-level w:tbl, rows and cells are processed in XML order; each row is one record whose logical cells are joined
    by TAB. A cell''s text is its direct paragraphs'' visible text joined by one LF, untrimmed. w:gridSpan N (N >= 1) puts the text
    in the first logical column and "" in the next N-1. w:vMerge restart keeps its text; w:vMerge and w:vMerge continue give an empty
    slot and never copy text down, but visible text in a continuation cell is kept in its slot and warned. The first physical row is
    the header (w:tblHeader is not used to pick another row): it is part of the extracted text but has no fragment. Every later non-empty
    row is one TableRow fragment with header_cells = the header''s expanded logical cells under the same rules, in order and unsorted.'
  - 'Unsupported visible content. The supported surface is main-body paragraphs and tables, paragraph visible text, paragraph styles/outlines/list
    properties and table rows/cells/merges. Any other structure in word/document.xml with visible WordprocessingML text is never lost:
    its visible text is flattened deterministically into the containing record, or into its own Paragraph record when it is a top-level
    body element, and an ImportWarning { code: W_DOCX_UNSUPPORTED_VISIBLE, locator: XmlPath, message: "Visible DOCX content was flattened
    because its structure is outside the S0.2 import profile." } is emitted. The xpath uses canonical w: names whatever the document''s
    prefix: /w:document/w:body/*[N] (one-based body child element position) for a top-level element, otherwise the nearest deterministically
    addressable containing structural element. With no warning the parse is Complete with no warnings; with one or more it is PartialWithExplicitUnparsedRegions
    with the warnings in canonical order, stored in plumb_import:parse.'
  - Fragments. Every Heading, ListItem, Paragraph and TableRow fragment uses EvidenceLocator::TextRange into ExtractedTextArtifact.text
    exactly as in S0.1 (start < end <= text length and the range bytes equal extracted_text); XmlPath locators appear only in parse
    warnings and TableCell is not used.
  - 'Tests in crates/plumb-import/tests/docx.rs (inside a module whose name contains docx) build synthetic DOCX packages in memory with
    zip::ZipWriter and cover at minimum: an ordinary paragraph, the Heading1 fallback, a direct outlineLvl heading, a style-inherited
    heading, direct and style-inherited numPr lists, a paragraph whose w:t begins with literal numbering such as "1. HR-001 [functional]
    The system shall ..." without any effective w:numPr staying Paragraph, tab, line break, non-ASCII text and byte ranges, a table
    with header and several data rows, gridSpan, vMerge restart/continue, an unsupported visible top-level body element (text kept,
    one Paragraph fragment, one warning with its deterministic XmlPath, partial status persisted in the source extension, graph valid),
    a custom namespace prefix, an empty paragraph; the fatal cases (not a ZIP, missing document.xml, malformed document XML, malformed
    present styles.xml, style cycle, invalid gridSpan, invalid vMerge) with typed variant and code(); each safety limit producing E_DOCX_LIMIT
    (unit tests over the limit checks, without huge allocations); artifact kinds, media types, bytes and hashes; determinism and created_at
    independence; Graph::new over source + fragments for a complete and a partial import; the read-only fixtures/hr-leave/requirements.docx
    (docx kind and media type, Complete with no warnings, graph valid, identical re-import, HR-001..HR-032 each exactly once in ascending
    order, every fragment containing one of them being Paragraph, because the fixture''s ordinals are literal w:t text and no effective
    w:numPr exists, and TableRow fragments with header_cells ["Leave type", "Deducts annual balance", "Eligible contract"] and texts
    Annual\tyes\tEmployee, Unpaid\tno\tEmployee, Contractor, Sick\tno\tEmployee in order); and a source guard that production DOCX code
    contains none of std::fs, File::open, tempfile, LibreOffice, python, pandoc, ArtifactStore, Sqlite, SystemClock, Clock::now, Utc::now,
    reqwest, InferenceProvider, LlmProvider, Graph::new, SemanticPatch, Proposal and unsafe.'
  tests:
  - cargo test -p plumb-import docx
  - cargo test -p plumb-import
  - cargo test --workspace
  acceptance:
  - 'Synthetic DOCX packages and the read-only HR DOCX import deterministically into graph-valid SourceArtifact and EvidenceFragment
    nodes with exact TextRange round trips, typed fatal errors with stable codes, enforced safety limits, and no silently lost visible
    text: unsupported visible structures are flattened, warned with a deterministic XmlPath and recorded as a partial parse.'
  source_refs:
  - SRCREF-4C965A435B
  - SRCREF-BC2B9CB618
  forbidden:
  - Do not fabricate list markers or Word numbering labels, infer headings from formatting or localized style names, write DOCX content
    to disk, or create a parallel evidence contract.
  commands:
  - cargo test -p plumb-import docx
  - cargo test -p plumb-import
  - cargo fmt --check
  - cargo clippy --workspace --all-targets -- -D warnings
  - cargo test --workspace
  commit_message: 'S0.2: Implement deterministic minimal DOCX importer'
- id: S0.3
  title: Implement evidence manifest and I0 evaluator functions
  phase: S0
  scope: NOW
  depends_on:
  - S0.2
  files:
  - crates/plumb-import/src/lib.rs
  - crates/plumb-import/src/manifest.rs
  - crates/plumb-validation/src/rules/i0.rs
  - crates/plumb-validation/src/rules/mod.rs
  - crates/plumb-validation/tests/i0.rs
  - crates/plumb-validation/tests/evaluator.rs
  steps:
  - 'Implement exactly the six I0 rules PLUMB.I0.SOURCE.CONTENT_ADDRESSED, PLUMB.I0.EVIDENCE.LOCATABLE, PLUMB.I0.EVIDENCE.HASH_MATCH,
    PLUMB.I0.SOURCE.PARSE_STATUS, PPMN.I0.PROVENANCE.AGENT_IDENTIFIED and PLUMB.I0.BASELINE.HASHABLE from the supplied
    rule YAML without changing IDs, gate, severity, waiver policy or counts (I0 6, NOW 54, total 133). Expose pub
    fn register_i0_evaluators(registry: &mut EvaluatorRegistry) -> Result<(), EvaluationError>, which registers exactly
    these six rule IDs of the loaded metadata through the F0.13 EvaluatorRegistry. It registers only the rule ID ->
    evaluator association and hard-codes no I0 metadata such as severity or waiver policy. Evaluators are pure: they
    read only the Graph and the ValidationContext (including its already-acquired evidence_artifacts) and never receive
    or use a store, connection, filesystem, clock, provider, network client, compiler object, branch or commit capability;
    acquisition stays orchestration work.'
  - 'EvidenceManifest in crates/plumb-import/src/manifest.rs: EVIDENCE_MANIFEST_VERSION: u32 = 1; EvidenceManifest
    { version: u32, evidence_hash: Hash, sources: Vec<EvidenceManifestSource>, fragments: Vec<EvidenceManifestFragment>
    }, EvidenceManifestSource { source_ref: Id, content_hash: Hash, original_ref: Hash, extracted_ref: Hash } and
    EvidenceManifestFragment { fragment_ref: Id, source_ref: Id, extracted_ref: Hash, locator: EvidenceLocator, content_hash:
    Hash }, all rejecting unknown fields, with no metadata maps and no timestamps. evidence_hash is Evidence and equals
    Graph::evidence_hash() (the F0.6 implementation, neither reimplemented nor changed); every other hash is Generic;
    content_hash == original_ref for every source; every fragment''s source_ref resolves to its SourceArtifact and
    its extracted_ref equals that source''s SourceArtifactLinks.extracted_ref. Sources are sorted strictly by source_ref
    and fragments strictly by fragment_ref, duplicates rejected and no HashMap order used. The manifest covers exactly
    the baseline-participating SourceArtifact and EvidenceFragment nodes, using the membership of Graph::evidence_hash().
    Artifact refs come only from the persisted plumb_import:source_artifacts SourceArtifactLinks and plumb_import:fragment
    FragmentMetadata extensions, never from filenames, the source hash or a store, and no extracted_ref is added to
    the core EvidenceFragment payload.'
  - 'EvidenceManifest bytes and artifact. The canonical bytes are the RFC 8785 JSON of the complete manifest; evidence_manifest_artifact(manifest,
    created_at) returns an Artifact with kind evidence-manifest, media type application/json, those bytes and their
    Generic SHA-256, with caller-supplied created_at and no store, persistence or clock; created_at never changes
    bytes or hash. The manifest artifact hash (Generic, of the complete manifest bytes) is distinct from EvidenceManifest.evidence_hash
    (ev:sha256: of the graph evidence projection). A deterministic build/validate function proves a supplied manifest
    is exactly the manifest of a Graph and detects a wrong version, wrong hash kinds, a wrong evidence_hash, a missing,
    extra or wrong source (ref, content hash, original_ref, extracted_ref), a missing, extra or wrong fragment (source,
    extracted_ref, locator, content hash), unsorted or duplicate entries and unknown fields; malformed manifests are
    never repaired.'
  - 'CONTENT_ADDRESSED: for every baseline SourceArtifact the content_hash is Generic and the context holds an evidence
    artifact with that hash, kind source-original and media type equal to SourceArtifact.media_type (ValidationArtifactInput
    already proves the hash equals its bytes); built-in imported sources also need SourceArtifactLinks.original_ref
    == content_hash. Targets: all checked SourceArtifact IDs on PASS, all violating ones otherwise; condition key
    source-content-addressed; message "One or more SourceArtifact nodes are not backed by the required content-addressed
    source artifact."'
  - 'LOCATABLE: for every baseline EvidenceFragment of a built-in source (markdown, plain_text, docx) the source_ref
    resolves to a baseline SourceArtifact, the locator validates and is a TextRange, plumb_import:fragment exists
    and validates, its extracted_ref equals the source''s SourceArtifactLinks.extracted_ref, the context holds that
    source-extracted artifact with media type application/json whose bytes deserialize to ExtractedTextArtifact and
    re-serialize canonically to the same bytes, and start < end <= text byte length on UTF-8 boundaries. Targets:
    all checked fragment IDs on PASS, all violating ones otherwise; key evidence-locatable; message "One or more EvidenceFragment
    nodes cannot be resolved to their exact extracted source range."'
  - 'HASH_MATCH: for every applicable built-in EvidenceFragment, Hash::content_sha256 of ExtractedTextArtifact.text.as_bytes()[start..end]
    equals EvidenceFragment.content_hash and, when extracted_text is Some, its bytes equal that range; the extracted
    artifact plus locator, not the stored text, is the source of truth. Targets as for LOCATABLE; key evidence-hash-match;
    message "One or more EvidenceFragment content hashes do not match the bytes resolved from the extracted source."'
  - 'PARSE_STATUS reads plumb_import::source_parse_metadata(SourceArtifact) (plumb-validation depends on plumb-import
    for the canonical ParseMetadata type). For the built-in source kinds markdown, plain_text and docx it passes for
    Complete with no warnings or for PartialWithExplicitUnparsedRegions with one or more valid explicitly located
    warnings; missing or malformed parse metadata is a violation. Fatal parse failures never enter the graph. Targets:
    all checked SourceArtifact IDs on PASS, all violating ones otherwise; key source-parse-status; message "One or
    more built-in SourceArtifact nodes lack a valid explicit parse status."'
  - 'PPMN.I0.PROVENANCE.AGENT_IDENTIFIED: S0.1/S0.2 parsing is evidence acquisition, not semantic derivation, and
    creates no DerivationRecord or Agent. The provenance-producing Agent of a DerivationRecord node is its Node.audit.created_by
    and the activity kind is DerivationRecord.kind; no agent field is added to DerivationRecord. With zero baseline
    DerivationRecords the rule is NOT_APPLICABLE with reason "No derivation-producing semantic action is present in
    the evaluated baseline."; otherwise it passes only when every one''s audit.created_by resolves to an existing
    baseline Agent node and its kind is valid. Targets: all DerivationRecord IDs on PASS, all violating ones otherwise;
    key provenance-agent-identified; message "One or more DerivationRecord nodes do not identify a known provenance
    Agent."'
  - 'BASELINE.HASHABLE: graph.evidence_hash() must equal ValidationContext.baseline_evidence_hash, and exactly one
    supplied evidence-manifest artifact must parse as canonical EvidenceManifest with evidence_hash equal to both
    and content equal to the manifest rebuilt from the graph. A missing, malformed, stale or inconsistent manifest
    or a hash mismatch is a FAIL, not an evaluator crash; only a structurally impossible internal error uses EvaluatorFailure.
    Targets are [] for PASS and violation; key baseline-evidence-hash; message "The evidence baseline cannot be reproduced
    from the evaluated graph and evidence manifest." Ordinary bad evidence (missing or wrong-kind artifacts, missing
    or stale manifest, unreproducible ranges, hash mismatches, missing parse metadata, a creator that is not an Agent,
    a baseline mismatch) is always a rule violation and never an EvaluationError.'
  - 'HR source corpus: import the read-only fixtures/hr-leave/requirements.md and fixtures/hr-leave/requirements.docx
    with their importers and fixed test project ID, profile ID and ImportAudit; build one graph from both SourceArtifact
    nodes and all their EvidenceFragment nodes, with no Requirement, DerivationRecord or Agent and no edges; supply
    the four source-original/source-extracted artifacts as ValidationArtifactInput plus the evidence-manifest artifact
    of that graph; use baseline_evidence_hash = graph.evidence_hash(). Expected: CONTENT_ADDRESSED, LOCATABLE, HASH_MATCH,
    PARSE_STATUS and BASELINE.HASHABLE PASS, AGENT_IDENTIFIED NOT_APPLICABLE, I0 gate PASS. Failure fixtures mutate
    inputs deliberately, never the fixture files. Every rule has PASS and FAIL fixtures; the provenance rule also
    covers zero records (NOT_APPLICABLE), a valid Agent creator (PASS) and a missing or non-Agent creator (FAIL);
    BASELINE.HASHABLE covers a correct hash with exact manifest (PASS), a wrong expected hash, a missing manifest
    and a stale manifest (FAIL).'
  - 'Manifest API and errors (Hotfix 023). manifest.rs defines exactly one public error type, ManifestError, with
    the variants Core(CoreError) for canonicalization/hash failures, InvalidJson { reason } when bytes do not deserialize
    as the exact EvidenceManifest schema (including unknown fields), NonCanonicalBytes when they deserialize but differ
    from the RFC 8785 serialization, InvalidGraphEvidence { element_ref: Id, reason } when the graph cannot be represented
    by the pilot manifest (missing or malformed plumb_import:source_artifacts or plumb_import:fragment, or a fragment/source
    extracted_ref disagreement), and InvalidManifest { reason } when a manifest violates its own invariants or differs
    from the manifest rebuilt from the graph; reason strings are diagnostic only. It exposes EVIDENCE_MANIFEST_VERSION,
    EvidenceManifest, EvidenceManifestSource, EvidenceManifestFragment, ManifestError, EvidenceManifest::validate()
    (version 1, Evidence evidence_hash, Generic source and fragment hashes, content_hash == original_ref, strictly
    sorted unique sources and fragments; no normalization or repair), build_evidence_manifest(graph) (baseline-participating
    SourceArtifact and EvidenceFragment nodes by plumb_psg::is_baseline, the existing Graph::evidence_hash(), refs
    from the persisted extensions, sorted, version 1, passing validate()), validate_evidence_manifest(manifest, graph)
    (validate, rebuild, require complete equality, otherwise InvalidManifest), parse_evidence_manifest(bytes) (exact
    deserialization, validate, require canonical re-serialization equal to the bytes; never canonicalizes caller bytes)
    and evidence_manifest_artifact(manifest, created_at) (validate, canonical bytes, evidence-manifest / application/json,
    Generic hash, caller created_at). lib.rs adds pub mod manifest and these exports only. The manifest is not filtered
    by source kind: every baseline evidence element must carry the pilot artifact-link extensions, and evidence that
    does not makes build_evidence_manifest return InvalidGraphEvidence. No source kind is guessed from media type
    or filename and no extension is fabricated. PSG hashing is not changed.'
  - 'Edge cases (Hotfix 023). A SourceArtifact is built-in only when its source_kind parses exactly (case-sensitive,
    unnormalized) as plumb_import::SourceKind (markdown, plain_text, docx), through one shared helper used by LOCATABLE,
    HASH_MATCH and PARSE_STATUS. CONTENT_ADDRESSED checks every baseline SourceArtifact whatever its kind (Generic
    content_hash and a supplied source-original artifact with that hash and the source''s media type), and additionally
    requires valid SourceArtifactLinks with original_ref == content_hash only for built-in kinds; a non-built-in source
    without the extension does not fail for that reason. LOCATABLE and HASH_MATCH evaluate only fragments whose source
    is built-in and PARSE_STATUS only built-in sources; other elements are ignored for checked and violating targets.
    An empty applicable set makes CONTENT_ADDRESSED, LOCATABLE, HASH_MATCH and PARSE_STATUS PASS with empty targets
    and evidence, never NOT_APPLICABLE; only the provenance rule is NOT_APPLICABLE with zero baseline DerivationRecords.
    BASELINE.HASHABLE always evaluates, also for an empty evidence baseline, in this order: graph.evidence_hash()
    against baseline_evidence_hash; exactly one evidence-manifest artifact (zero or several fail on cardinality before
    any parsing; none is ever picked or merged); media type application/json; parse_evidence_manifest; manifest.evidence_hash
    equal to the graph hash and to baseline_evidence_hash; validate_evidence_manifest. Every ordinary failure there,
    including a graph that cannot be manifested, is the single violation with targets [], key baseline-evidence-hash
    and the fixed message; ManifestError is translated, never propagated as an EvaluationError or EvaluatorFailure,
    and error details never enter the condition key. RuleEvaluation evidence carries no timestamps, paths, random
    values or error dumps. Several distinct evidence-manifest artifacts remain valid context inputs; their cardinality
    is the rule''s concern. Evaluators and the manifest builder are read-only and use plumb_psg::is_baseline; if a
    required PSG API were missing the task blocks rather than editing plumb-psg.'
  - 'Tests (Hotfix 023). Manifest contract tests are unit tests inside crates/plumb-import/src/manifest.rs in a #[cfg(test)]
    module whose name contains manifest, so cargo test -p plumb-import manifest runs them (a run of zero tests does
    not satisfy acceptance); no other test file is added. They cover the deterministic manifest of a valid graph (version,
    evidence_hash, exact entries and sorting, canonical bytes, artifact kind, media type, Generic hash, created_at
    independence, canonical parse round trip, validation against the graph) and every negative case (wrong version
    or hash kinds, content_hash != original_ref, unsorted or duplicate entries, unknown field, malformed and non-canonical
    JSON, missing or malformed source and fragment extensions, extracted_ref disagreement, wrong evidence_hash, missing,
    extra or wrong sources and fragments versus the graph). crates/plumb-validation/tests/i0.rs uses the real register_i0_evaluators
    and evaluate_gate path and covers exact registration of the six rules, PASS and FAIL fixtures for every rule,
