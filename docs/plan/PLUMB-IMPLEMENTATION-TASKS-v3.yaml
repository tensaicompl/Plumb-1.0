- id: F0.1
  title: Implement core IDs, clock, canonical JSON and hashes
  phase: Foundation
  scope: NOW
  depends_on:
  - P0.2
  files:
  - crates/plumb-core/src/lib.rs
  - crates/plumb-core/src/id.rs
  - crates/plumb-core/src/clock.rs
  - crates/plumb-core/src/canonical.rs
  - crates/plumb-core/src/hash.rs
  - crates/plumb-core/src/error.rs
  - crates/plumb-core/tests/canonical.rs
  - crates/plumb-core/tests/hash.rs
  steps:
  - 'Implement Id as a validated String newtype exactly per plan §6.3: grammar ^[a-z][a-z0-9_-]*:[A-Za-z0-9._-]+(?::[A-Za-z0-9._-]+)*$, no trimming
    or normalization, exact string preserved, validated FromStr and TryFrom<String>, Display, AsRef<str>, as_str(), and serde deserialization
    that rejects invalid strings.'
  - Implement Hash as one validated String newtype exactly per plan §6.3 accepting only sha256:<64 lowercase hex>, psg:sha256:<64 lowercase hex>
    and ev:sha256:<64 lowercase hex>; provide HashKind {Generic, Semantic, Evidence}, Hash::kind(), Hash::content_sha256(&[u8]), Hash::semantic_sha256(&[u8]),
    Hash::evidence_sha256(&[u8]), validated FromStr and TryFrom<String>, Display, AsRef<str>, as_str(), and validating serde deserialization.
    Do not create separate SemanticHash or EvidenceHash types.
  - Implement Timestamp(time::OffsetDateTime) exactly per plan §6.3 (UTC-normalized; RFC 3339 input with T or single-space separator and offset
    conversion; surrounding whitespace rejected; UTC year restricted to 0000..=9999 with rejection, never panic, outside it; nanosecond precision;
    canonical Display/serialization with uppercase T, uppercase Z and exactly nine fractional digits) and the Clock trait with fn now(&self) ->
    Timestamp, SystemClock and FixedClock.
  - Implement the canonical JSON primitive by applying RFC 8785 JCS through the explicitly allowed serde_json_canonicalizer dependency (serde_json_canonicalizer::to_vec)
    to the supplied value. Do not implement Plumb domain-specific ordering of semantically unordered arrays in F0.1; later semantic-envelope construction
    applies it before calling this primitive.
  - Implement sha256 hashing over canonical bytes.
  - Do not include timestamps, layout metadata, or audit metadata in semantic hash input; the exact semantic envelope is defined by the metamodel.
  - Add deterministic property tests that map insertion order does not affect canonical output or hash.
  - 'Tests cover at minimum:


    - Id: every plan §6.3 valid and invalid example; serialization round-trip; invalid serde deserialization rejection.

    - Hash: all three accepted prefixes; exactly 64 lowercase hex; uppercase rejection; length rejection; unknown-prefix rejection; HashKind;
    deterministic SHA-256 constructors.

    - Timestamp: UTC serialization; non-UTC offset normalization; exactly nine fractional digits; nanosecond retention; serde round-trip; FixedClock
    repeatability; space-separator input serializing back with T; surrounding-whitespace rejection; valid boundary years 0000 and 9999; rejection
    below and above the representable range where constructible (including offset normalization past either bound); offset normalization that
    stays inside the range.

    - Canonical JSON/hash: every plan §6.3 RFC 8785 conformance fixture produces its fixed expected bytes (ASCII, quote/backslash, control-character,
    BMP and non-BMP keys, string escaping, numbers); each expected output is a fixed point; map insertion order produces byte-identical output
    and equal resulting hashes, including property tests; repeated canonicalization is byte-identical.'
  tests:
  - cargo test -p plumb-core
  acceptance:
  - Canonical output is byte-identical for semantically identical map insertion orders and all tests pass.
  - Id, Hash and Timestamp satisfy every plan §6.3 grammar, example and canonicalization rule, and serde deserialization of invalid Id/Hash/Timestamp
    values fails.
  - Every plan §6.3 RFC 8785 conformance fixture produces exactly its fixed expected bytes, and each expected output canonicalizes to itself.
  source_refs:
  - SRCREF-1B777C546D
  - SRCREF-C85B1E19E9
  - SRCREF-ACB4876C07
  forbidden:
  - Do not write a custom approximate JCS serializer.
  - Do not use wall-clock time directly outside SystemClock.
  commands:
  - cargo test -p plumb-core
  - cargo fmt --check
  - cargo clippy --workspace --all-targets -- -D warnings
  commit_message: 'F0.1: Implement core IDs, clock, canonical JSON and hashes'
- id: F0.2
  title: Implement content-addressed artifact model and SQLite artifact store
  phase: Foundation
  scope: NOW
  depends_on:
  - F0.1
  files:
  - crates/plumb-artifacts/src/lib.rs
  - crates/plumb-artifacts/src/model.rs
  - crates/plumb-artifacts/src/store.rs
  - crates/plumb-artifacts/src/sqlite.rs
  - crates/plumb-artifacts/tests/store.rs
  steps:
  - Implement ArtifactKind exactly for source-original, source-extracted, evidence-manifest, inference-request, inference-response, validated-inference,
    external-validation, projection, proposal, patch, diff, impact-report, gate-report, conformance-report, scenario-trace, test-receipt, architecture-check,
    compile-run (exactly 18 kinds). Serialize and persist each kind as exactly its listed kebab-case string. An unknown persisted kind string
    returns an explicit error; do not map it to an Other variant.
  - 'Artifact identity is the generic sha256: Hash (plan §6.3) of the exact stored bytes: artifact_hash = sha256:<lowercase SHA-256 of exact stored
    bytes>. ArtifactKind, media_type and created_at do not participate in the hash. The persisted artifact semantics are Artifact { hash: Hash,
    kind: ArtifactKind, media_type: String, bytes: Vec<u8>, created_at: Timestamp }; equivalent owned/borrowed API shapes are acceptable. Use
    the plumb-core Hash and Timestamp primitives; do not duplicate them.'
  - Create SQLite table artifacts(hash TEXT PRIMARY KEY, kind TEXT NOT NULL, media_type TEXT NOT NULL, bytes BLOB NOT NULL, created_at TEXT NOT
    NULL). Persist created_at in the canonical Timestamp form of plan §6.3.
  - 'put receives ArtifactKind, media type, the exact artifact bytes and a caller-supplied Timestamp; the store must not obtain wall-clock time
    itself. put semantics:


    1. Compute the generic sha256: Hash over the exact byte slice.

    2. If the hash does not exist: insert exactly one row persisting the supplied kind, media type, bytes and created_at; return the artifact
    hash.

    3. If the hash already exists: load the existing row and verify that the existing bytes, ArtifactKind and media_type equal the supplied values.

    4. If bytes, kind and media_type all match: the operation is idempotent; do not update created_at, do not add another row, and return the
    existing hash. created_at from a duplicate put is intentionally ignored after the first successful insert.

    5. If the same content hash exists but kind or media_type differs: return an explicit ArtifactMetadataConflict and do not mutate the existing
    row.

    6. If the stored bytes differ from the supplied bytes for the same hash (a hash collision): return an explicit integrity error and never overwrite
    the existing row.'
  - Artifact bytes and their persisted metadata are immutable after the first successful insertion. No artifact update, replace or delete-by-put
    behavior is permitted.
  - 'Provide get (lookup by artifact Hash) and exists (existence check by Hash). get on a missing artifact returns an explicit not-found result/error
    and never fabricates an empty artifact; exists returns false for a missing hash. Reject non-Generic hash kinds (psg:sha256: and ev:sha256:)
    as artifact-store keys; the artifact table is keyed only by generic sha256: hashes.'
  - 'Duplicate insertion is transaction-safe and a race/retry converges to the same result: same bytes, kind and media_type give the same hash
    and one row; a metadata mismatch gives a conflict with the existing row unchanged. Do not solve concurrency by weakening uniqueness or adding
    duplicate rows.'
  - 'Tests cover at minimum:


    - first put inserts one row;

    - identical bytes with identical kind and media_type put twice return the same hash;

    - a duplicate put leaves the original created_at unchanged;

    - different bytes produce different hashes;

    - same bytes with a different ArtifactKind return ArtifactMetadataConflict;

    - same bytes with a different media_type return ArtifactMetadataConflict;

    - a metadata conflict leaves the original row byte-for-byte unchanged;

    - get returns all five persisted fields correctly;

    - exists true/false behavior;

    - the artifact hash is the generic sha256: kind;

    - the store rejects psg:sha256: key lookup where applicable;

    - the store rejects ev:sha256: key lookup where applicable;

    - an unknown persisted ArtifactKind string fails explicitly;

    - duplicate/repeated insertion never creates more than one row;

    - transaction rollback leaves no partial artifact on failure.


    If an actual SHA-256 collision cannot reasonably be generated in a unit test, implement the integrity check in code but do not fabricate a
    cryptographic collision test.'
  tests:
  - cargo test -p plumb-artifacts
  acceptance:
  - Putting identical bytes twice returns the same hash and stores one row; differing bytes return differing hashes.
  - A duplicate put with identical bytes, kind and media_type is idempotent and keeps the original created_at; the same bytes with a different
    kind or media_type return ArtifactMetadataConflict and leave the existing row unchanged; get and exists reject non-generic hash keys; an unknown
    persisted kind fails explicitly; a failed put leaves no partial row.
  source_refs:
  - SRCREF-440BF23BDA
  - SRCREF-AED4772768
  forbidden:
  - Do not store mutable semantic state in the artifact table.
  commands:
  - cargo test -p plumb-artifacts
  - cargo fmt --check
  - cargo clippy --workspace --all-targets -- -D warnings
  commit_message: 'F0.2: Implement content-addressed artifact model and SQLite artifact store'
- id: F0.3
  title: Implement PSG envelope primitives and typed status/standards structures
  phase: Foundation
  scope: NOW
  depends_on:
  - F0.2
  files:
  - crates/plumb-psg/src/lib.rs
  - crates/plumb-psg/src/status.rs
  - crates/plumb-psg/src/standards.rs
  - crates/plumb-psg/src/refs.rs
  - crates/plumb-psg/src/extensions.rs
  - crates/plumb-psg/src/audit.rs
  - crates/plumb-psg/tests/serde.rs
  steps:
  - 'Implement ElementStatus exactly: Proposed, Accepted, Rejected, Superseded, Deprecated, Suspect. Rust variant names are those names and serialized
    JSON values are exactly those case-sensitive strings. Unknown values fail deserialization. Confirmed must not exist.'
  - 'Implement MappingRole exactly from metamodel §2: Rust variants SemanticAlignment, Taxonomy, Interchange, ValidationReference, PresentationConvention,
    serialized exactly as semantic_alignment, taxonomy, interchange, validation_reference, presentation_convention. Unknown values fail deserialization.
    Do not add standard-specific roles.'
  - 'Implement MappingStrength exactly from metamodel §2: Rust variants Exact, Compatible, Subset, Extension, InspiredBy, serialized exactly as
    exact, compatible, subset, extension, inspired_by. Unknown values (including taxonomy) fail deserialization.'
  - 'Implement StandardMapping exactly as metamodel §16.2 { standard_id: String, version: String, concept: String, clause_ref: Option<String>,
    mapping_role: MappingRole, mapping_strength: MappingStrength, validator_rules: Vec<String> } with no additional fields. F0.3 validates structure
    and enum vocabulary only; it does not verify that a standard, clause, concept or validator rule exists.'
  - 'Implement EvidenceRef(Id) and DerivationRef(Id) as distinct transparent wrappers over the plumb-core Id: JSON serialization is the underlying
    ID string, deserialization validates through Id, the exact string is preserved, each exposes as_id() -> &Id and as_str() -> &str and converts
    from an already validated Id. Do not use plain String and do not impose any prefix or namespace restriction; resolving the referenced element
    type is later graph validation.'
  - Implement ExtensionKey as a transparent validated string newtype with the exact grammar ^[a-z][a-z0-9_-]*:[A-Za-z0-9._-]+$ (exactly one colon;
    no whitespace, trimming or normalization; exact string preserved), providing FromStr, TryFrom<String>, Display, AsRef<str>, as_str() and validating
    serde deserialization.
  - 'Implement AuditMeta is exactly { created_by: Id, created_at: Timestamp, updated_by: Option<Id>, updated_at: Option<Timestamp> } using the
    plumb-core primitives. created_by and created_at are mandatory; updated_by and updated_at are either both Some or both None; when present,
    updated_at >= created_at. Invalid AuditMeta is never silently repaired: serde deserialization rejects invalid combinations, and an explicit
    deterministic validation function returns a typed error for programmatically constructed invalid values (no panics). Do not add confidence,
    deletion metadata, session metadata, free-form audit maps or an implicit current user/time. No plumb-psg code reads wall-clock time. Audit
    metadata remains excluded from semantic hashing.'
  - F0.3 MUST NOT define NodePayload, RelationKind, Node or Edge, and must not introduce placeholder, temporary or string-based substitutes for
    them. F0.4 implements Node once NodePayload exists; F0.5 implements Edge once RelationKind exists.
  - 'Tests cover at minimum:


    - ElementStatus: all six exact serialized values; unknown-value rejection.

    - MappingRole: all five exact serialized values; unknown-value rejection.

    - MappingStrength: all five exact serialized values; unknown-value rejection; taxonomy is rejected as a MappingStrength.

    - StandardMapping: JSON round-trip with a real MappingRole and MappingStrength; invalid enum values fail.

    - EvidenceRef and DerivationRef: transparent JSON round-trip; invalid underlying Id rejected.

    - ExtensionKey: valid acme:priority, jira:issue_key, customer-x:classification.v2; invalid priority, Acme:priority, acme:, acme::priority,
    acme:priority:extra, acme:bad key; serde invalid-input rejection.

    - AuditMeta: create-only round-trip; create+update round-trip; only updated_by rejected; only updated_at rejected; updated_at before created_at
    rejected; updated_at == created_at accepted; explicit programmatic validation returns an error for invalid state.'
  tests:
  - cargo test -p plumb-psg serde
  acceptance:
  - All PSG envelope primitives round-trip through JSON; invalid status, mapping, extension, reference-ID and audit representations are rejected;
    the repository standards profile uses only the normative MappingRole and MappingStrength vocabularies; and F0.3 introduces no placeholder
    NodePayload, RelationKind, Node or Edge.
  source_refs:
  - SRCREF-2A709879EB
  forbidden:
  - Do not implement core semantics as kind:String plus arbitrary props.
  - Do not add fields absent from the metamodel without a blocking spec issue.
  - Do not define NodePayload, RelationKind, Node or Edge, or any placeholder, temporary or string-based substitute for them.
  - Do not read wall-clock time in plumb-psg.
  commands:
  - cargo test -p plumb-psg serde
  - cargo fmt --check
  - cargo clippy --workspace --all-targets -- -D warnings
  commit_message: 'F0.3: Implement PSG envelope primitives and typed status/standards structures'
- id: F0.4
  title: Implement complete NodePayload semantic enum and Node envelope
  phase: Foundation
  scope: NOW
  depends_on:
  - F0.3
  files:
  - crates/plumb-psg/src/lib.rs
  - crates/plumb-psg/src/payload.rs
  - crates/plumb-psg/src/node.rs
  - crates/plumb-psg/tests/payload_roundtrip.rs
  steps:
  - Implement every NodePayload variant of metamodel §24 — 86 variants, including DerivationRecord (immediately after EvidenceFragment) and Extension(ExtensionPayload)
    — across the namespaces evidence/provenance, governance, intent/requirements, vocabulary/domain, functional behavior, authorization, quality,
    architecture, technical contracts, delivery, verification, standards profile and view model.
  - Field names, Required/Optional status, Rust types, closed enums, open-JSON fields, nested structures and unknown-field rejection follow the
    metamodel §24.1 payload binding contract exactly. Do not infer any type outside it; if a field cannot be typed uniquely by §24.1, stop with
    docs/blockers/F0.4.md (BLOCKED-SPEC-MISSING) naming the field.
  - Use serde tagged representation type/data as specified by metamodel §§24-24.1; the type tag is exactly the Rust variant name. Unknown variant
    names and extra top-level keys are rejected.
  - When the prose definition and skeleton disagree, do not choose; create docs/blockers/F0.4.md identifying both conflicting passages and stop.
  - Implement the closed NodeType enum with exactly one variant per NodePayload variant, NodePayload::node_type() -> NodeType, and NodeType::as_str()
    -> &'static str returning exactly the type tag. Do not derive type identity from Rust type-name strings.
  - 'Implement DerivationRecord conditional validation (metamodel §5.3: for llm_inference all eight LLM-specific fields are mandatory; for every
    other kind all eight are None) and ResolutionDecision structural validation (at least one of question_ref and proposal_ref), each through
    explicit validate() with a typed error and through serde deserialization. Do not call an LLM or inspect artifacts.'
  - 'Once NodePayload exists, implement the final concrete Node envelope exactly as metamodel §4.1: Node { id: Id, revision: u32, status: ElementStatus,
    payload: NodePayload, evidence: Vec<EvidenceRef>, derivations: Vec<DerivationRef>, standards: Vec<StandardMapping>, tags: BTreeSet<String>,
    extensions: BTreeMap<ExtensionKey, Value>, audit: AuditMeta }, using the F0.3 primitives. No universal confidence field and no stringly typed
    payload. Node rejects unknown fields; tags are preserved exactly with no additional grammar. Node::validate() returns a typed Node error,
