  - 'Source guard and tests (Hotfix 026). Production requirements.rs and intent.rs contain no std::fs, File::open, ArtifactStore, SqliteArtifactStore,
    SqliteRevisionStore, rusqlite, SystemClock, Clock::now, Utc::now, Instant::now, reqwest, InferenceProvider::execute, MockProvider, persist_inference_bundle,
    materialize_derivation_record, apply_patch, revision store, branch mutation, commit( or unsafe; MockProvider is used only in tests/requirements.rs,
    registered under the exact classification request.id and executed in test code, with only the InferenceArtifact and a deterministic synthetic
    DerivationRef passed to compilation. Tests (all selected by the filter requirements) cover: the schema (Draft 2020-12 compile, valid output,
    invalid kind such as business_requirement, invalid level such as application, wrong case, unknown root, classification and intent fields,
