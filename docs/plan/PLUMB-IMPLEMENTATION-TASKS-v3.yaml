- id: F0.12
  title: Implement standards profile loader and validation rule metadata
  phase: Foundation
  scope: NOW
  depends_on:
  - F0.11
  files:
  - crates/plumb-validation/src/lib.rs
  - crates/plumb-validation/src/model.rs
  - crates/plumb-validation/src/profile.rs
  - crates/plumb-validation/src/registry.rs
  - crates/plumb-validation/tests/profile.rs
  steps:
  - 'Scope. F0.12 owns profile parsing and validation, gate and rule metadata, the closed validation vocabularies, the profile and rule-pack
    hashes, the metadata registry and the NOW/deferred evaluator requirement. It implements no rule evaluator function and no placeholder
    or no-op evaluator: evaluator bindings and execution belong to F0.13. Do not introduce ValidationContext, Applicability, RuleResult, RuleEvaluator,
    GateReport, Waiver or finding generation. Do not define a ValidationArtifact struct: the rulebook §7 term means plumb_compiler::ExternalValidationArtifact
    stored as ArtifactKind::ExternalValidation / application/json. F0.12 adds no plumb-compiler dependency and changes no Cargo.toml.'
  - 'config/profiles/plumb-software-2026.1-rules.yaml is the read-only authority: never reorder, normalize, reformat or edit it. Every rule
    ID, severity, class, waiver policy and text is loaded from it; production source contains no rule-ID enum, per-rule constant, per-rule
    match arm or list of rule IDs. pub const EXPECTED_RULE_COUNT: usize = 133 is a permitted schema invariant.'
  - 'Closed vocabularies, each exposing ALL and as_str() and rejecting unknown or wrong-case strings: RuleClass { ExternalStandard, ExternalInterop,
    PlumbCore, ProfilePolicy, OrganizationPolicy } with wire strings external_standard, external_interop, plumb_core, profile_policy, organization_policy;
    RuleResultState { Pass, Fail, Warn, NotApplicable, Waived, Error } with wire strings PASS, FAIL, WARN, NOT_APPLICABLE, WAIVED, ERROR (exactly
    six; NOT_IMPLEMENTED is not a state; in F0.12 this is metadata vocabulary only); Severity { Blocker, Error, Warn, Info } with wire strings
    blocker, error, warn, info (info stays in the closed type although the supplied rules do not use it); WaiverPolicy { Forbidden, DecisionRequired,
    ProfileAllow } with wire strings forbidden, decision_required, profile_allow; EvaluationMode { Deterministic } with wire string deterministic.
    Reuse plumb_core::GateId, plumb_psg::MappingRole and plumb_psg::MappingStrength; do not redefine them and do not add a StandardId type.'
  - 'Fixed-shape structs, all rejecting unknown fields: StandardDefinition { standard: String, version: String, role: MappingRole, note: String
    } (all four required; the catalog key is a String); StandardRef { standard: String, version: String, role: MappingRole, note: String,
    mapping_strength: MappingStrength } (all five required when the block exists); GateMetadata { id: GateId, purpose: String, rule_ids: Vec<String>,
    pass_algorithm: String }; RuleMetadata { id: String, gate: GateId, title: String, severity: Severity, rule_class: RuleClass, applies_when:
    String, check: String, pass_condition: String, waiver_policy: WaiverPolicy, standard_reference: Option<StandardRef>, remediation: Option<String>,
    evaluation: EvaluationMode, finding_status_on_fail: String }; ValidationProfile { profile_id: Id, profile_version: String, metamodel:
    String, status: String, rule_classes: BTreeMap<RuleClass, String>, result_states: Vec<RuleResultState>, standards: BTreeMap<String, StandardDefinition>,
    gates: Vec<GateMetadata>, rules: Vec<RuleMetadata> }, exactly the nine top-level YAML fields. No field absent from the YAML is introduced;
    an absent optional field serializes as JSON null.'
  - 'Text rules: profile_version, metamodel and status are non-empty, not surrounded by whitespace and free of control characters, and their
    current literal values are not hard-coded. Rule id, title, applies_when, check, pass_condition, finding_status_on_fail and, when present,
    remediation are non-empty, without leading or trailing whitespace and without control characters other than an embedded newline. Every
    gate purpose, every gate pass_algorithm and every rule-class description is non-empty. Text is never otherwise normalized, rewritten or
    paraphrased, and pass_algorithm is not encoded as executable logic in F0.12. Every standards-catalog key, every StandardDefinition standard,
    version and note and every StandardRef standard, version and note is non-empty, without leading or trailing whitespace and without control
    characters; a malformed value fails with InvalidProfileText and no value is trimmed or normalized.'
  - 'Profile validation requires all of: rule_classes has exactly the five RuleClass::ALL keys; result_states is exactly the six states, each
    once (a missing, duplicate, extra or wrong-case state is rejected and malformed input is never silently repaired); the standards catalog
    has no duplicate (standard, version, role) triple and every rule StandardRef matches exactly one catalog definition on (standard, version,
    role), while note and mapping_strength are rule-specific; exactly 13 gate entries with each GateId exactly once, every rule_ids list non-empty,
    no rule ID twice within a gate and no rule ID in two gates; exactly 133 RuleMetadata entries with unique IDs; the union of all gate rule_ids
    equals the RuleMetadata ID set exactly (no unknown gate rule ID, no orphan rule); every RuleMetadata.gate equals the gate that lists it;
    every rule uses EvaluationMode::Deterministic.'
  - 'A loaded ValidationProfile is normalized: rule_classes and standards in BTreeMap key order, result_states in RuleResultState::ALL order,
    gates in GateId::ALL order, each gate''s rule_ids in lexicographic order and rules in lexicographic order of id. ValidationProfile::profile_hash()
    -> Result<Hash, CoreError> is the Generic sha256: hash of the RFC 8785 canonical JSON of the complete normalized typed ValidationProfile.
    ValidationProfile::rule_pack_hash() -> Result<Hash, CoreError> is the Generic hash of the canonical JSON of exactly { result_states, gates,
    rules } under the same normalization: rule-level standard_reference and gate purpose, rule_ids and pass_algorithm are included; profile_id,
    profile_version, metamodel, status, rule_classes and the standards catalog are excluded. Both functions normalize their own input, never
    hash raw YAML bytes and are unaffected by YAML formatting, comments or ordering. These are the profile_hash and rule_pack_hash persisted
    by GraphRevision, CompileContext and GateReport.'
  - 'load_profile_yaml(yaml: &str) -> Result<ValidationProfile, ValidationError> parses, validates and normalizes; it takes no filesystem
    path and uses no global singleton, environment variable, network or wall clock. load_builtin_software_profile() -> Result<ValidationProfile,
    ValidationError> may include_str! the supplied YAML and must go through load_profile_yaml; no second parser exists.'
  - 'pub const NOW_GATES: [GateId; 5] = [I0, F1, F2, F3, F4]. ValidationRegistry is a metadata and availability registry derived from one
    validated ValidationProfile; it stores no evaluator function and no second copy of rule metadata. It exposes new(profile), profile(),
    rule(id), gate(gate), rules_for_gate(gate), required_now_rule_ids() (the deterministic sorted set of the rule IDs of the NOW gates, computed
    from loaded metadata and never hard-coded), is_now_gate(gate) and require_now_gate(gate). For the supplied profile exactly 54 rules require
    NOW evaluators and the other 79 are deferred metadata; a profile whose NOW count is not 54 is rejected by the registry with NowRuleCountMismatch.
    require_now_gate succeeds for I0, F1, F2, F3 and F4 and returns ValidationError::GateNotImplemented(GateId) for Q1, A1, A2, A3, A4, D1,
    D2 and C1, which is an evaluator-availability error and not a rule result; the metadata of every gate and rule stays queryable.'
  - ValidationError is typed and distinguishes at least Yaml, InvalidProfile, InvalidProfileText, RuleCountMismatch, DuplicateRuleId, GateCountMismatch,
    DuplicateGate, DuplicateGateRule, UnknownGateRule, OrphanRule, RuleGateMismatch, ResultStatesMismatch, RuleClassesMismatch, DuplicateStandardDefinition,
    UnknownStandardReference, NowRuleCountMismatch and GateNotImplemented. Yaml may carry the stringified serde_yaml error; structural failures
    are never collapsed into one generic String.
  - 'Tests in crates/plumb-validation/tests/profile.rs (inside a module whose name contains profile) cover at minimum: exhaustive exact wire
    values, deserialization, unknown and wrong-case rejection and ALL for RuleClass (5), RuleResultState (6), Severity (4), WaiverPolicy (3)
    and EvaluationMode (1), and reuse of GateId, MappingRole and MappingStrength; the supplied YAML loading with profile_id profile:plumb-software-2026.1,
    profile_version 2026.1-draft.1, metamodel 3.0-draft.1, status implementation draft, 5 rule classes, 6 result states, 15 standards, 13
    gates, 133 rules, 23 rule-level StandardRefs, severities blocker/error/warn, classes external_standard/external_interop/plumb_core, all
    three waiver policies, evaluation deterministic and finding_status_on_fail Open; gate counts I0 6, F1 11, F2 24, F3 6, F4 7, Q1 8, A1
    9, A2 9, A3 14, A4 9, D1 9, D2 10, C1 11; rejection of a duplicate, missing or extra RuleMetadata, a duplicate or missing gate, a rule
    duplicated within a gate or listed in two gates, an unknown gate rule, an orphan rule and a rule whose gate differs from its containing
    gate; 54 required-now and 79 deferred rule IDs, require_now_gate for all 13 gates and later-gate metadata queries; StandardRef resolution
    and rejection of an unknown standard/version/role combination, a duplicate catalog triple, an unknown mapping role or strength and an
    unknown StandardRef field; rejection of an unknown top-level, gate, rule or StandardDefinition field, a wrong-case, missing or duplicate
    result state, an unknown or missing rule class and empty textual metadata; independently calculated hard-coded profile_hash and rule_pack_hash
    of the supplied YAML (both Generic), unchanged by reordering rules or gate rule_ids, with a severity change and a rule StandardRef note
    change altering both, and a status change and a catalog note change altering only profile_hash; registry lookups, ordering, derivation
    from the profile and absence of a metadata copy; and a source-level check that production source contains no rule ID of the supplied profile.'
  tests:
  - cargo test -p plumb-validation profile
  - cargo test -p plumb-validation
  - cargo test --workspace
  acceptance:
  - All 133 metadata rules load from the unmodified supplied YAML; exactly 54 rules of the NOW gates I0, F1, F2, F3 and F4 require evaluators
    and 79 are deferred metadata; duplicate rule IDs fail profile loading; profile_hash and rule_pack_hash equal independently calculated
    fixed values and ignore YAML ordering and formatting; a later gate returns ValidationError::GateNotImplemented while its metadata stays
    queryable; no evaluator function exists in F0.12.
  source_refs:
  - SRCREF-0B1179FD2E
  - SRCREF-5608A0663D
  forbidden:
  - Do not rewrite rule IDs or severities in code.
  - Do not duplicate rule metadata in Rust constants when it can be loaded from YAML.
  - Do not implement evaluator functions, placeholder evaluators or any F0.13 execution type, and do not modify the supplied profile YAML.
  commands:
  - cargo test -p plumb-validation profile
  - cargo test -p plumb-validation
  - cargo fmt --check
  - cargo clippy --workspace --all-targets -- -D warnings
  - cargo test --workspace
  commit_message: 'F0.12: Implement standards profile loader and validation rule metadata'
- id: F0.13
  title: Implement deterministic gate evaluator, findings and waivers
  phase: Foundation
  scope: NOW
  depends_on:
  - F0.12
  files:
  - crates/plumb-validation/src/lib.rs
  - crates/plumb-validation/src/evaluator.rs
  - crates/plumb-validation/src/finding.rs
  - crates/plumb-validation/src/waiver.rs
  - crates/plumb-validation/src/rules/mod.rs
  - crates/plumb-validation/tests/evaluator.rs
  steps:
  - 'Scope. F0.13 implements the evaluator framework: the evaluator registration contract, the rule execution contract, finding generation,
    waiver application, gate aggregation and GateReport. It implements zero production rule evaluator functions and no fake or no-op production
    evaluator; test-only fixture evaluators are allowed. It creates crates/plumb-validation/src/rules/mod.rs as an empty production rule-module
    root declared by lib.rs, containing no evaluator and no rule ID. Production evaluators arrive gate by gate: S0.3 (I0, 6 rules), S1.6 (F1,
    11), S2.10 (F2, 24), S3.5 (F3, 6) and S4.6 (F4, 7). Evaluation is pure: no graph mutation, persistence, clock, artifact or revision store,
    provider, network client, compiler type or readiness score appears in evaluator source or API, external validators are never executed,
    and plumb-validation does not depend on plumb-compiler.'
  - Rule results use exactly the six F0.12 RuleResultState values PASS, FAIL, WARN, NOT_APPLICABLE, WAIVED, ERROR; the vocabulary is reused,
    not redefined. External validator input is plumb_validation::ExternalValidationArtifact; no ValidationArtifact struct exists.
  - 'ValidationPolicy { promoted_to_blocker_rule_ids: BTreeSet<String>, profile_allow_waiver_rule_ids: BTreeSet<String> } rejects unknown
    fields, defaults to both sets empty and is a deterministic input separate from ValidationProfile. It is valid against a ValidationRegistry
    when every ID exists and profile_allow_waiver_rule_ids holds only rules whose WaiverPolicy is ProfileAllow. ValidationPolicy::policy_hash()
    -> Result<Hash, CoreError> is the Generic hash of its canonical JSON. Effective severity is the rule''s declared Severity, or Blocker
    when the rule ID is in promoted_to_blocker_rule_ids; nothing demotes a severity.'
  - 'ValidationContext { baseline_semantic_hash: Hash, profile_id: Id, profile_hash: Hash, rule_pack_hash: Hash, policy: ValidationPolicy,
    external_validation_artifacts: Vec<ExternalValidationArtifact> } has no timestamp, clock, artifact store, provider, network client or
    compiler type. Its constructor takes the Graph, the ValidationRegistry, the ValidationPolicy and the external validation artifacts, derives
    baseline_semantic_hash = graph.semantic_hash(), profile_id, profile_hash and rule_pack_hash from registry.profile(), validates the policy
    and every artifact, stores the artifacts sorted by ExternalValidationArtifact::artifact_hash() and rejects duplicate artifact hashes.
    ValidationContext::validation_artifact_refs() returns the sorted Generic artifact hashes. Before a gate is evaluated the context is re-checked
    against the graph and registry; any mismatch is InvalidContext. Both the constructor and the re-check also require graph.profile_id()
    == registry.profile().profile_id (InvalidContext otherwise), independently of the semantic hash. Hotfix 022 adds baseline_evidence_hash:
    Hash (Evidence, supplied by orchestration; only its kind is a context invariant, because whether the graph reproduces it is the PLUMB.I0.BASELINE.HASHABLE
    rule result) and evidence_artifacts: Vec<ValidationArtifactInput>, where ValidationArtifactInput { hash: Hash, kind: ArtifactKind, media_type:
    String, bytes: Vec<u8> } rejects unknown fields, has a Generic hash equal to the SHA-256 of its bytes and a clean media type, is built
    from an Artifact by dropping created_at, and is limited to the source-original, source-extracted and evidence-manifest kinds; inputs are
    stored sorted by hash and unique. Missing evidence a rule needs is that rule''s violation, never a context error. evidence_artifact(hash)
    and evidence_artifact_refs() perform no I/O. The semantic-hash, profile and policy checks are unchanged.'
  - 'Applicability { Applicable, NotApplicable { reason: String } } has the exact wire forms {"state":"APPLICABLE"} and {"state":"NOT_APPLICABLE","reason":"..."};
    reason is non-empty, without leading or trailing whitespace and without control characters. NOT_APPLICABLE exists only when an evaluator
    explicitly returns it with a reason; it is never derived from the free-text RuleMetadata.applies_when, which stays documentation.'
  - 'RuleEvaluation is exactly Pass { targets: Vec<Id>, evidence: Vec<String> }, Violation { targets: Vec<Id>, evidence: Vec<String>, semantic_condition_key:
    String, message: String, suggested_resolution: Option<String> } or NotApplicable { reason: String }. EvaluatorFailure { code: String,
    message: String, targets: Vec<Id>, evidence: Vec<String> } is the evaluator''s error path. pub type RuleEvaluator = fn(&Graph, &ValidationContext,
    &RuleMetadata) -> Result<RuleEvaluation, EvaluatorFailure>. Constructors sort targets and evidence and reject duplicates; the engine validates
    every evaluator output and rejects unsorted or duplicate targets or evidence, an invalid evidence string (empty, surrounded by whitespace
    or containing a control character; its type is never inferred from a prefix), an empty violation message, an invalid reason, and an EvaluatorFailure
    whose code is not non-empty control-free trimmed text or whose message is empty, as InvalidEvaluatorOutput. semantic_condition_key is
    non-empty, without leading or trailing whitespace and without control characters (InvalidSemanticConditionKey); it is the evaluator-defined
    deterministic identity of the violated condition and never contains a timestamp or random value.'
  - Evaluators never choose the final state. The engine maps Pass -> PASS; NotApplicable -> NOT_APPLICABLE; Err(EvaluatorFailure) -> ERROR
    without aborting the remaining rules; Violation with effective severity Blocker or Error -> FAIL; Violation with effective severity Warn
    or Info -> WARN; a Violation with a valid governed waiver -> WAIVED. No evaluator can produce WAIVED.
  - 'finding_key(rule_id: &str, targets: &[Id], semantic_condition_key: &str) -> Result<Hash, EvaluationError> is the Generic sha256: hash
    of exactly the bytes UTF-8(rule_id) 0x00, then UTF-8(target) 0x00 for every target in exact Id order, then UTF-8(semantic_condition_key),
    with no other prefix, length field, JSON encoding or whitespace. Targets are sorted before encoding and duplicates are rejected. The Finding
    node ID is fnd:<first 16 lowercase hex digits of the finding-key digest>, exposed by a helper. Finding identity depends only on rule ID,
    targets and semantic_condition_key, never on severity, message, policy or waiver.'
  - 'Severity maps to plumb_psg::FindingSeverity as Blocker -> Blocker, Error -> Error, Warn -> Warn, Info -> Info; the two types stay separate
    and FindingSeverity is unchanged. GeneratedFinding { key: Hash, id: Id, semantic_condition_key: String, payload: plumb_psg::Finding }
    is produced for every Violation with payload code = RuleMetadata.id, family = RuleMetadata.gate.as_str(), severity = the mapped effective
    severity, message = the evaluator message, status = RuleMetadata.finding_status_on_fail, affected_refs = the sorted targets, standard_rule_ref
    = Some(rule ID) when the rule has a standard_reference and None otherwise, suggested_resolution = the evaluator''s value, and waiver_ref
    = the applied ResolutionDecision ID when waived and None otherwise. F0.13 returns this material only; it creates no PSG Node envelope,
    audit metadata or persistence.'
  - 'Waivers. A ResolutionDecision is a waiver only when its answer deserializes exactly as WaiverDecisionMarker { kind: String, rule_id:
    String, finding_key: Hash, finding_ref: Id } (unknown fields rejected) with kind == "waiver". Waiver candidates for a Violation are the
    ResolutionDecision nodes reached from the deterministic Finding node, which must exist in the Graph with NodeType Finding and status exactly
    Accepted, over a resolves edge (ResolutionDecision -resolves-> Finding) whose status is exactly Accepted, where the ResolutionDecision
    status is exactly Accepted; anything else yields no waiver. A candidate whose answer is not an object with kind == "waiver" is not a waiver
    and is ignored. A candidate whose answer has kind == "waiver" must deserialize as the marker, carry a Generic finding_key equal to the
    deterministic key, finding_ref equal to the deterministic Finding ID and rule_id equal to the evaluated rule ID, and have rationale Some(non-empty,
    trimmed, control-free text); otherwise evaluation fails with MalformedWaiverDecision. decided_by is the waiver owner and the deterministic
    finding is its scope. More than one qualifying decision for one finding is AmbiguousWaiver; none is ever picked by ID, timestamp or graph
    order. For the single qualifying decision WaiverPolicy Forbidden is ForbiddenWaiver, DecisionRequired yields WAIVED, and ProfileAllow
    yields WAIVED only when the rule ID is in ValidationPolicy.profile_allow_waiver_rule_ids and is ProfileWaiverNotEnabled otherwise. Invalid
    waiver attempts are never silently ignored. ResolutionDecision has no review or expiry field and none is invented: the pilot evaluator
    validates owner, exact finding scope, rationale and accepted governance state, consults no clock and evaluates no time expiry. Before
    any waiver claim on a finding is accepted, the Accepted Finding node at the deterministic ID must be the evaluated finding: Finding.code
    == RuleMetadata.id, Finding.family == rule.gate.as_str() and Finding.affected_refs == the sorted violation targets; otherwise evaluation
    fails with FindingIdentityMismatch. Severity, message, suggested_resolution and waiver_ref are not compared, and the finding-key algorithm
    is unchanged.'
  - 'RuleResult { rule_id: String, state: RuleResultState, declared_severity: Severity, effective_severity: Severity, applicability: Applicability,
    targets: Vec<Id>, evidence: Vec<String>, semantic_condition_key: Option<String>, finding_ref: Option<Id>, waiver_ref: Option<Id>, error:
    Option<EvaluatorFailure> } rejects unknown fields. PASS: Applicable, no key, finding, waiver or error. NOT_APPLICABLE: NotApplicable {
    reason }, empty targets and evidence, no key, finding, waiver or error. FAIL and WARN: Applicable, key and finding_ref present, no waiver,
    no error. WAIVED: as a violation plus waiver_ref. ERROR: Applicable, targets and evidence taken from the EvaluatorFailure, no key, finding
    or waiver, error present.'
  - 'AppliedWaiver { rule_id: String, finding_ref: Id, finding_key: Hash, decision_ref: Id }. GateResult { Pass, Fail } with wire values PASS
    and FAIL is a closed enum distinct from RuleResultState. GateSummary { blocker_failed: u32, blocker_waived: u32, warnings: u32 }: blocker_failed
    counts effective-blocker rules whose state is FAIL or ERROR, blocker_waived counts effective-blocker rules whose state is WAIVED, warnings
    counts WARN results regardless of declared severity. The gate result is PASS exactly when blocker_failed == 0: for an effective-blocker
    rule PASS proves it, WAIVED satisfies it, NOT_APPLICABLE does not block, FAIL and ERROR block; a non-blocker FAIL or ERROR blocks only
    when policy promoted the rule. evaluate_gate does not require predecessor gates to have passed and a GateReport never depends on other
    GateReports; formal baseline orchestration owns predecessor requirements. Readiness never participates.'
  - 'GateReport { gate: GateId, baseline_semantic_hash: Hash, profile_id: Id, profile_hash: Hash, rule_pack_hash: Hash, policy: ValidationPolicy,
    validation_artifact_refs: Vec<Hash>, result: GateResult, rules: Vec<RuleResult>, findings: Vec<GeneratedFinding>, waivers: Vec<AppliedWaiver>,
    summary: GateSummary } has no evaluated_at, timestamp, clock value, readiness score, branch or revision ID (the rulebook''s sample evaluated_at
    is operational presentation metadata outside the deterministic report). rules are in lexicographic rule_id order, findings in Finding
    ID order, waivers in (rule_id, finding_ref, decision_ref) order and validation_artifact_refs in hash order, all unique. GateReport::content_hash()
    -> Result<Hash, CoreError> is the Generic hash of the canonical GateReport. Hotfix 022 adds baseline_evidence_hash (Evidence) and evidence_artifact_refs
    (sorted, unique, Generic) to GateReport; acquisition time never affects the report.'
  - 'EvaluatorRegistry is a separate execution-layer registry that owns one ValidationRegistry and a map from rule ID to RuleEvaluator, with
    no duplicated RuleMetadata. It exposes new(metadata), metadata(), register(rule_id, evaluator), has_evaluator(rule_id), missing_for_gate(gate)
    and evaluate_gate(gate, graph, ctx). register requires the rule to exist (UnknownEvaluatorRule), to belong to a NOW gate (EvaluatorForDeferredRule)
    and to have no evaluator yet (DuplicateEvaluator). Registration is gate-incremental: no global check that all 54 NOW rules are bound exists
    in F0.13, and unbound rules of one gate never prevent evaluation of another gate. evaluate_gate, in order: validates the ValidationContext
    against the graph and metadata; calls require_now_gate(gate), preserving ValidationError::GateNotImplemented(GateId) through the error
    wrapper for a later gate; returns MissingGateEvaluators { gate, rule_ids } with the sorted IDs when any rule of that gate has no evaluator;
    runs exactly one evaluator per rule in lexicographic rule ID order; validates the output; calculates effective severity; maps the preliminary
    state; for every Violation computes the finding key, Finding ID and GeneratedFinding, inspects the Graph for a governed waiver and applies
    or rejects it; produces the RuleResults; aggregates GateSummary; derives GateResult; and returns the normalized GateReport.'
  - EvaluationError is typed and distinguishes at least Core, Metadata, ExternalValidation, InvalidContext, InvalidPolicy, UnknownEvaluatorRule,
    EvaluatorForDeferredRule, DuplicateEvaluator, MissingGateEvaluators, InvalidEvaluatorOutput, InvalidSemanticConditionKey, InvalidFindingKey,
    InvalidFindingId, FindingIdentityMismatch, MalformedWaiverDecision, ForbiddenWaiver, ProfileWaiverNotEnabled, AmbiguousWaiver and GateReportInvalid.
    It means the framework cannot produce a trustworthy report; an EvaluatorFailure is rule data that becomes an ERROR result.
  - 'Tests in crates/plumb-validation/tests/evaluator.rs (inside a module whose name contains evaluator), using the real F0.12 profile metadata
    and test-only fixture evaluators, cover at minimum: ValidationPolicy (empty valid, fixed canonical JSON and Generic hash, unknown promotion
    and profile-allow IDs, profile-allow of a non-ProfileAllow rule, promotion of Error/Warn/Info to Blocker and no demotion, deterministic
    order); ValidationContext (exact semantic hash, profile ID/hash and rule-pack hash, artifacts sorted by artifact hash, duplicate and invalid
    artifacts, graph and registry mismatch, no timestamp or clock/network/store/provider capability); RuleEvaluation and EvaluatorFailure
    constructors (sorting, duplicate targets and evidence, empty reason, empty, padded and control-character condition keys, empty message);
    an independently calculated finding-key golden with fixed input bytes, sha256: hash and fnd: ID, order independence and sensitivity to
    rule, target and condition key; the exact GeneratedFinding mapping and promotion changing finding severity but not identity; waivers over
    a real PSG Finding, ResolutionDecision and resolves edge (none, valid decision_required, non-Accepted decision or edge, missing rationale,
    malformed marker, wrong rule, key or finding ref, Forbidden, ProfileAllow with and without enablement, two qualifying decisions, unrelated
    decision ignored, no clock); the state mapping for every severity and promotion; GateSummary and the pass algorithm for every blocking
    and non-blocking case; registration (empty registry, unknown, deferred and duplicate registration, the exact six missing I0 IDs, partial
    binding, complete I0 evaluating while F1 is unbound, Q1 returning GateNotImplemented, no production evaluator under src/rules); a hand-authored
    complete canonical GateReport golden with a fixed content hash and byte-identical repetition; external-artifact determinism (same content
    same ref, insertion-order independence, changed output changes the ref, exact sorted refs in the report, no validator execution); and
    source guards that production F0.13 source contains none of SystemClock, Utc::now, Instant::now, reqwest, InferenceProvider, ArtifactStore,
    SqliteRevisionStore, plumb_compiler and readiness, and that rules/mod.rs contains no rule ID. The no-production-rule-module assertion
    describes the completed F0.13 bootstrap checkpoint before stage evaluator implementations begin: at completion of F0.13, src/rules contained
    no production rule evaluator modules. It is superseded by the explicit-registration guard when S0.3 introduces the first production rule
    module (Hotfix 024).'
  tests:
  - cargo test -p plumb-validation evaluator
  - cargo test -p plumb-validation
  - cargo test --workspace
  acceptance:
  - 'The evaluator framework is complete: test-only fixture evaluators can register and evaluate a complete NOW gate, an incompletely bound
    gate fails deterministically with the exact missing rule IDs, no production rule evaluator exists yet and later stage tasks can register
    their gate''s evaluators incrementally (the 54-rule binding is complete only after S4.6). Repeated gate evaluation over an equal graph,
    profile, policy and external validation artifacts yields a byte-identical GateReport, which contains no timestamp.'
  source_refs:
  - SRCREF-FF7208E4F2
  forbidden:
  - Do not let readiness scores influence gate result.
  - Do not implement production rule evaluators, placeholder evaluators or a global 54-binding check in F0.13.
  commands:
  - cargo test -p plumb-validation evaluator
  - cargo test -p plumb-validation
  - cargo fmt --check
  - cargo clippy --workspace --all-targets -- -D warnings
  - cargo test --workspace
