    core name deserializes to the core variant, a valid namespaced ExtensionKey to Extension; an unknown unqualified relation or a malformed namespace
    is rejected. Do not create Other(String). Expose RelationKind::as_str() and RelationKind::is_core().'
  - 'Implement RelationProperties { None, SchemaFor(SchemaForProperties), Extension(BTreeMap<ExtensionKey, Value>) }, SchemaForProperties { role:
    SchemaBindingRole } and SchemaBindingRole { Attribute, MessagePayload, MessageHeaders, ApiRequest, ApiResponse, ApiError } (serialized attribute,
    message_payload, message_headers, api_request, api_response, api_error). Edge properties serialize as a JSON object ({} for None, {"role":
    ...} for schema_for, namespaced keys for extensions); the Rust variant name never appears in JSON. Every core relation except schema_for uses
    None; schema_for uses SchemaFor with no additional fields; extension relations use Extension (possibly empty) with ExtensionKey keys; every
    other kind/properties combination is invalid.'
  - Implement the node categories of metamodel §17.8 (Evidence, Provenance, SemanticNode, SemanticOrEvidenceNode, ArchitectureElement, TechnicalContract,
    StateOwner, DeployableArchitectureElement) as predicates over NodeType, never over Rust type names.
  - 'Implement a static machine-readable registry with exactly one RelationDef { kind, from, to, outgoing, incoming, directionality, cycle_policy,
    same_node_type, property_schema } per core relation, with Cardinality { min: u32, max: Option<u32> }, Directionality { Directed, Symmetric
    }, CyclePolicy { Allowed, Acyclic } and RelationPropertySchema { None, SchemaFor }. Extension relations have no registry entries. Registry
    entries enforce exactly the source/target compatibility table of metamodel §17.8 (supersedes: same node type) and the schema_for role compatibility;
    do not broaden any set.'
  - Enforce only the unconditional structural cardinalities of metamodel §17.8 (supersedes outgoing 0..1; resolves outgoing 1..*; has_attribute
    incoming exactly 1 per Attribute; transitions_via, permits, scoped_to, characterized_by, measured_by outgoing exactly 1; workflow_step outgoing
    1..*; produces_receipt outgoing 0..1; all others 0..*). Do not encode conditional gate/profile requirements (evidence for requirements, performed_by
    for executable steps, allocated_to by A2, deployed_to by deployment profile, justified_by for accepted decisions, verified_by by D2/C1) as
    structural cardinality.
  - 'conflicts_with is Symmetric: a single edge represents the unordered pair and no mirrored edge is required or created; every other core relation
    is Directed. Reject cycles for the core-acyclic relations supersedes, refines, decomposes_to, inherits_role and depends_on_slice; other relations
    (for example next) may contain cycles.'
  - 'Once RelationKind exists, implement the final concrete Edge envelope exactly as metamodel §4.2: Edge { id: Id, revision: u32, status: ElementStatus,
    kind: RelationKind, from: Id, to: Id, properties: RelationProperties, evidence: Vec<EvidenceRef>, derivations: Vec<DerivationRef>, standards:
    Vec<StandardMapping>, audit: AuditMeta }, using the F0.3 primitives. Edge rejects unknown fields and has no universal confidence field. Edge::validate()
    returns a typed EdgeError, and deserialization enforces the same local invariants: revision != 0 (element revision counter per metamodel §4.5;
    no increment behavior here), valid AuditMeta, and RelationKind/properties compatibility. Source/target NodeType validation, cardinality and
    cycles are registry validation over node types and edges.'
  - 'Tests live in crates/plumb-psg/tests/relations.rs inside a module whose name contains relations so that cargo test -p plumb-psg relations
    selects them; the unfiltered cargo test -p plumb-psg proves none is skipped. Tests cover at minimum:


    - RelationKind: all 51 core values round-trip exactly; core count exactly 51; unknown unqualified relation rejected; valid extension relation
    accepted; malformed extension relation rejected; no Other/String fallback.

    - Registry: exactly one entry per core relation; no duplicates; every entry is core; every core relation has an entry; a representative valid
    and invalid source/target pair for every relation; category membership; schema_for target/role compatibility.

    - Cardinality: every unconditional cardinality above.

    - Cycles: for each of supersedes, refines, decomposes_to, inherits_role and depends_on_slice an acyclic fixture is accepted and a direct cycle
    and a multi-edge cycle are rejected; a legitimate next loop is accepted.

    - conflicts_with: a single symmetric edge is accepted, the registry reports Symmetric, and no mirror edge is required.

    - RelationProperties: every non-schema core relation accepts {} and rejects semantic/free-form properties; schema_for requires SchemaForProperties;
    all six SchemaBindingRole values round-trip exactly; an invalid schema role and a wrong role for the target type are rejected; extension relations
    accept namespaced property keys and reject unqualified keys; core relations reject extension properties.

    - Edge: real core, schema_for and extension edges round-trip; revision 1 accepted and 0 rejected; invalid AuditMeta rejected; evidence/derivation
    refs stay typed; unknown fields rejected; no confidence, kind-string or props escape hatch; RelationKind/properties mismatch rejected.'
  tests:
