- id: F0.8
  title: Implement immutable revision store, branch heads and CAS commit
  phase: Foundation
  scope: NOW
  depends_on:
  - F0.7
  files:
  - crates/plumb-store/src/lib.rs
  - crates/plumb-store/src/schema.rs
  - crates/plumb-store/src/sqlite.rs
  - crates/plumb-store/src/revisions.rs
  - crates/plumb-store/src/branches.rs
  - crates/plumb-store/tests/revisions.rs
  steps:
  - 'Ownership and connection (plan §6): plumb-store owns the SQLite connection for graph/revision operations, schema_meta, graph_revisions, revision_nodes,
    revision_edges, branch_heads, ledger_events and the transaction boundaries of accepted commits. Do not embed a separately opened SqliteArtifactStore;
    call plumb_artifacts::ensure_artifact_schema and plumb_artifacts::put_artifact_in_transaction on the store''s own connection/transaction. Every connection
    enables PRAGMA foreign_keys = ON, journal_mode = WAL, synchronous = NORMAL and a 5 second busy timeout.'
  - 'Schema and versions: define STORE_SCHEMA_VERSION = 1 (physical SQLite schema) and PSG_SCHEMA_VERSION = 1 (persisted PSG interpretation/validation contract).
    Create exactly the plan §6 schema. Fresh database (no schema_meta and none of graph_revisions, revision_nodes, revision_edges, branch_heads, ledger_events;
    an existing F0.2 artifacts table is permitted and preserved): initialize v1 transactionally with exactly one schema_meta row version = 1. Existing schema_meta:
    exactly one row, version == STORE_SCHEMA_VERSION (else UnsupportedStoreSchemaVersion without altering the database) and every v1 table present (else
    CorruptStoreSchema; never recreate tables). Graph-store tables without schema_meta: UnversionedStore. No migration engine exists.'
  - 'Types: RevisionId is a transparent string `rev:<positive decimal version without leading zeros>:<16 lowercase hex>`; RevisionId::new(version, semantic_hash)
    requires a Semantic psg:sha256: hash and uses the first 16 hex digits of its digest; expose version() and as_str(); reject rev:0, rev:01, Rev:, uppercase
    hex, wrong hex length, extra components and whitespace. BranchName is a transparent validated string of 1..=255 UTF-8 bytes whose first character is
    ASCII alphanumeric and remaining characters are only A-Z a-z 0-9 . _ : / - (main, candidate:architecture-A, candidate/team-A and proposal:prop-123 are
    valid); expose as_str(), parsing and serde.'
  - 'GraphRevision { id: RevisionId, version: u64, parent: Option<RevisionId>, project_id: Id, psg_schema_version: u32, semantic_hash: Hash (Semantic),
    evidence_hash: Hash (Evidence), profile_ref: Id, profile_hash: Hash (Generic), rule_pack_hash: Hash (Generic), accepted_patch_ref: Option<Hash> (Generic),
    decision_refs: Vec<Id>, created_by: Id, created_at: Timestamp } per compiler architecture §4.1; project_id and profile_ref equal the Graph project_id
    and profile_id. RevisionWriteMeta { decision_refs: Vec<Id>, created_by: Id, created_at: Timestamp }: decision_refs contain no duplicates, are persisted
    and exposed sorted by Id, and each resolves in the resulting Graph to a baseline-participating ResolutionDecision node (else DuplicateDecisionRef, DecisionRefMissing,
    DecisionRefWrongType or DecisionRefNotBaseline). created_by is a validated Id with no mandatory prefix, need not resolve to an Agent node and is never
    used for authorization. The store never reads a wall clock: every persisted timestamp is supplied by the caller.'
  - 'create_initial_revision(graph, profile_hash, rule_pack_hash, meta) -> GraphRevision: requires no existing GraphRevision or branch (else AlreadyInitialized,
    even for a different project), Generic profile/rule-pack hashes (else InvalidProfileHashKind / InvalidRulePackHashKind) and valid decision refs; in
    one transaction persists version 1, parent None, accepted_patch_ref None, psg_schema_version PSG_SCHEMA_VERSION, the Graph semantic/evidence hashes,
    the exact RevisionId, the full snapshot and branch main -> revision 1 with updated_at = meta.created_at. Pre-existing artifact rows do not prevent it.
    One database holds exactly one project; commit inherits project_id, profile_ref, profile_hash and rule_pack_hash from the parent revision.'
  - 'Snapshots: every revision persists every Node and Edge of its Graph (all statuses, provenance and runtime elements included) in revision_nodes/revision_edges
    as exact RFC 8785 canonical JSON text, inserted by element ID; no delta storage. Element revisions are persisted exactly as produced by F0.7 apply_patch
    (metamodel §4.5); the store never recalculates them.'
  - 'commit(branch, expected_head, PatchSet, RevisionWriteMeta) -> CommitResult { revision: GraphRevision, delta: GraphDelta } runs in one BEGIN IMMEDIATE
    transaction in this order: resolve branch (BranchNotFound); compare head to expected_head (StaleBase { branch, expected, actual }); load the head revision
    and Graph in the same transaction; apply the PatchSet through F0.7 apply_patch (its semantic-hash precondition stays independent and a PatchError is
    returned typed); validate decision refs against the result Graph; canonicalize the PatchSet with the plumb-core RFC 8785 canonicalizer; store it through
    put_artifact_in_transaction as kind patch, media type application/json, created_at = meta.created_at (typed ArtifactStoreError preserved); allocate
    version MAX(version)+1 (VersionOverflow outside the positive SQLite INTEGER/u64 domain); build the RevisionId; insert the revision row with accepted_patch_ref
    Some(artifact hash) and parent = expected_head; insert the full snapshot; UPDATE branch_heads ... WHERE name = ? AND revision_id = expected_head requiring
    exactly one row; commit. Any failure rolls back artifact, revision, snapshot and branch movement. Never rebase, retry against a newer head or rewrite
    the PatchSet. Versions are database-global and never reset by branching. Revisions with equal semantic_hash are legal. CommitResult.delta is exactly
    the GraphDelta returned by the single apply_patch call of the successful commit; it is not recomputed, reconstructed from snapshots or persisted.'
  - 'load_revision(id) -> LoadedRevision { revision, graph } verifies integrity without repairing data: stored RevisionId parses and equals the ID derived
    from version and semantic_hash; version > 0; hash kinds (semantic Semantic, evidence Evidence, profile/rule-pack/patch Generic); project_id, profile_ref
    and created_by parse as Id; created_at parses canonically; decision_refs_json is an array of unique sorted Ids; psg_schema_version == PSG_SCHEMA_VERSION
    checked before any Graph construction (else UnsupportedPsgSchemaVersion); all Nodes/Edges deserialize; the Graph built with the stored project_id/profile_ref
    validates and reproduces both stored hashes; every decision ref resolves to a baseline ResolutionDecision. Initial revisions have parent None, accepted_patch_ref
    None and version 1; commit-created revisions have parent and accepted_patch_ref. The patch artifact must exist with kind patch, media type application/json,
    bytes hashing to the ref, deserializing as a PatchSet whose base_semantic_hash equals the parent semantic_hash, and equal to the RFC 8785 canonical
    JSON of that PatchSet (valid but noncanonical bytes are CorruptRevision). Mismatches are typed CorruptRevision / RevisionNotFound errors. Patches are
    not reapplied on load.'
  - 'head(branch) -> Option<RevisionId> returns None for a missing branch and never creates one. create_branch(name, from, updated_at) requires an existing
    from revision and an absent name (RevisionNotFound / BranchAlreadyExists) and inserts only a pointer. move_head(branch, expected_head, target, updated_at)
    runs in one IMMEDIATE transaction: branch and target must exist, head must equal expected_head (StaleBase), and UPDATE ... WHERE name = ? AND revision_id
    = ? must change exactly one row; it creates no revision and deletes nothing (restore is pointer movement). ledger_events is created but no event rows
    are written and no event vocabulary is invented.'
  - StoreError is typed and distinguishes at least Sqlite, Core, Artifact, Patch, Serialization, AlreadyInitialized, UnsupportedStoreSchemaVersion, CorruptStoreSchema,
    UnversionedStore, UnsupportedPsgSchemaVersion, RevisionNotFound, CorruptRevision, InvalidRevisionId, InvalidBranchName, InvalidProfileHashKind, InvalidRulePackHashKind,
    InvalidPatchArtifactHashKind, BranchAlreadyExists, BranchNotFound, StaleBase, VersionOverflow, DuplicateDecisionRef, DecisionRefMissing, DecisionRefWrongType
    and DecisionRefNotBaseline. Export STORE_SCHEMA_VERSION, PSG_SCHEMA_VERSION, CommitResult, RevisionId, BranchName, GraphRevision, LoadedRevision, RevisionWriteMeta,
    SqliteRevisionStore and StoreError; there is exactly one (SQLite) revision-store implementation.
  - 'Tests in crates/plumb-store/tests/revisions.rs (inside a module whose name contains revisions) cover at minimum: schema initialization and exact schema_meta;
    artifact-only database adoption (pre-existing artifact byte-for-byte unchanged, initial revision succeeds); unsupported, unversioned and corrupt schema;
    RevisionId and BranchName grammar; initial revision, exact revision ID, AlreadyInitialized; profile/rule hash kind validation; project/profile persistence;
    decision-ref validation; complete snapshot round-trip with canonical node/edge JSON; exact canonical Patch artifact bytes, kind, media type and timestamp;
    parent linkage; global version allocation 1,2,3 across branches; branch creation and independence; branch-head CAS; PatchSet semantic CAS; two independently
    opened file-backed connections committing from the same expected head give exactly one success and one StaleBase (never SQLITE_BUSY); rollback of the
    Patch artifact, revision, snapshot and head after a deliberate failure (for example a temporary trigger); move_head restore and stale move_head; no
    history deletion; distinct revisions with the same semantic hash; element revision preservation; reopen; revision corruption (semantic/evidence hash,
    malformed node/edge JSON, wrong RevisionId); PSG schema-version rejection; missing or mismatched Patch artifact; noncanonical Patch artifact bytes with
    a consistent hash; commit returns the revision plus the exact F0.7 GraphDelta whose result_semantic_hash equals the revision semantic_hash.'
  tests:
  - cargo test -p plumb-store revisions
  - cargo test -p plumb-store
  - cargo test --workspace
  acceptance:
  - The store initializes, adopts artifact-only databases and rejects unsupported, unversioned or corrupt schemas; revisions are immutable full snapshots
    with exact RevisionIds, global versions, inherited project/profile metadata and an accepted Patch artifact written in the same transaction; commit enforces
    branch-head CAS and the PatchSet semantic precondition, and concurrent commits against the same expected head give exactly one success and one StaleBase;
    any failure rolls back artifact, revision, snapshot and head; load verifies integrity, versions and patch artifacts; restore is implemented by branch-head
    movement and does not delete history.
  source_refs:
  - SRCREF-D32DB0990A
  - SRCREF-BBA84CFE16
  forbidden:
  - Do not overwrite an existing revision.
  - Do not silently rebase a stale patch.
  - Do not open a separate SqliteArtifactStore inside plumb-store or duplicate artifact insertion logic; use put_artifact_in_transaction.
  - Do not call a wall clock, invent a LedgerEvent vocabulary, implement a schema migration engine or add an in-memory revision store.
  commands:
  - cargo test -p plumb-store revisions
  - cargo test -p plumb-store
  - cargo fmt --check
  - cargo clippy --workspace --all-targets -- -D warnings
  - cargo test --workspace
  commit_message: 'F0.8: Implement immutable revision store, branch heads and CAS commit'
- id: F0.9
  title: Implement inference artifact/provider contracts and provenance materialization
  phase: Foundation
  scope: NOW
  depends_on:
  - F0.8
  files:
  - crates/plumb-inference/src/lib.rs
  - crates/plumb-inference/src/model.rs
  - crates/plumb-inference/src/provider.rs
  - crates/plumb-inference/src/null.rs
  - crates/plumb-inference/src/mock.rs
  - crates/plumb-inference/tests/artifacts.rs
  steps:
  - Reuse plumb_psg::{Agent, AgentKind, DerivationRecord, DerivationKind} (metamodel §§5.3-5.4) and plumb_core::{StageId, CanonicalJson, Hash,
    Id, Timestamp}; re-export them where useful. Do not define a second Agent, DerivationRecord, stage identifier or canonical-JSON type. Do not
    create Agent nodes automatically, invent an Agent-node ID convention or require provider/model to resolve to Agent nodes.
  - 'ProviderPolicy { provider: String, config: CanonicalJson } (compiler architecture §4.3) rejects unknown fields; provider matches exactly
    ^[a-z][a-z0-9._-]*$ with no normalization; config holds a JSON object ({} is valid) that is opaque to the inference core but contributes to
    request identity.'
  - 'InferenceRequest { id: Hash, stage: StageId, task_kind: String, input_refs: Vec<Id>, evidence_refs: Vec<Id>, context_hash: Hash, prompt_template_hash:
    Hash, schema_hash: Hash, provider_policy: ProviderPolicy } rejects unknown fields. id, context_hash, prompt_template_hash and schema_hash
    are Generic hashes. task_kind is non-empty, has no leading/trailing whitespace and no control characters, and is otherwise preserved exactly.
    input_refs and evidence_refs have set semantics: duplicates are invalid and they are stored and serialized sorted by Id.'
  - InferenceRequest.id is the Generic sha256 of the RFC 8785 canonical JSON of exactly {stage, task_kind, input_refs, evidence_refs, context_hash,
    prompt_template_hash, schema_hash, provider_policy} (id excluded). Provide InferenceRequest::new (sorts refs and computes id), validate(),
    identity_projection() and recompute_id(); deserialization recomputes the id and rejects a mismatch.
  - 'The request ID and the persisted request-artifact reference are distinct: the request artifact bytes are the RFC 8785 canonical JSON of the
    complete InferenceRequest including id, and its artifact hash is not required to equal request.id.'
  - 'InferenceArtifact { request_hash, provider, model, parameters: CanonicalJson, raw_response_hash, validated_output: CanonicalJson, validated_output_hash
    } rejects unknown fields; request_hash, raw_response_hash and validated_output_hash are Generic; provider follows the ProviderPolicy grammar;
    model is non-empty with no leading/trailing whitespace and no control characters. Against its request: request_hash == request.id, provider
    == request.provider_policy.provider and validated_output_hash == validated_output.content_hash().'
  - 'ProviderExecution { artifact: InferenceArtifact, raw_response_media_type: String, raw_response: Vec<u8> }: the media type is non-empty without
    control characters, artifact.raw_response_hash == sha256 of the exact raw_response bytes, and every InferenceArtifact/request invariant holds.
    Raw bytes stay outside InferenceArtifact.'
  - 'pub trait InferenceProvider { fn execute(&self, request: &InferenceRequest) -> Result<ProviderExecution, ProviderError>; }. Providers receive
    no Graph, GraphRevision, graph or revision store, branch, PatchSet commit capability or ArtifactStore; they cannot mutate PSG or persist artifacts.'
  - NullProvider always returns the typed ProviderDisabled error for every ProviderPolicy and performs no I/O.
  - MockProvider is deterministic replay infrastructure keyed by exact InferenceRequest.id. Registration validates that the key is Generic, the
    execution is structurally valid and execution.artifact.request_hash equals the key. execute validates the request, returns exactly the registered
    ProviderExecution (never rewriting provider, model or output), returns a typed FixtureNotFound for a missing id, never synthesizes output
    and never uses the network. It does not require provider_policy.provider == mock.
  - 'Acquisition uses the standalone ArtifactStore contract, never the F0.8 graph-commit transaction. persist_inference_bundle<S: ArtifactStore>(store,
    request, execution, created_at) -> Result<PersistedInferenceRefs { request_artifact_ref, raw_response_ref, validated_inference_ref }, InferenceError>
    validates everything first, then stores: kind inference-request, application/json, canonical full InferenceRequest; kind inference-response,
    raw_response_media_type, exact raw bytes; kind validated-inference, application/json, canonical full InferenceArtifact; all with the caller-supplied
    created_at and no hidden clock. All three refs are Generic and raw_response_ref == artifact.raw_response_hash; validated_inference_ref hashes
    the full InferenceArtifact bytes, not validated_output_hash. The three puts are not transactional: an immutable artifact persisted before
    a later failure may remain, retry is idempotent and no accepted PSG state changes.'
  - 'Replay: a persisted validated-inference artifact deserializes to the identical InferenceArtifact, and its fields suffice for deterministic
    semantic evaluation without a live provider or the raw response.'
  - 'materialize_derivation_record(request, execution, persisted, output_refs: Vec<String>, created_at) -> Result<DerivationRecord, InferenceError>
    validates inputs first; rejects duplicate output_refs and stores them sorted; sets kind llm_inference, stage = request.stage.as_str(), provider/model/parameters
    (underlying JSON)/raw_response_hash/validated_output_hash from the artifact and prompt_template_hash/schema_hash/context_hash from the request;
    input_refs is the sorted unique union of every input_ref and evidence_ref string, request.id and the three persisted refs. id is drv:<first
    16 hex of the SHA-256 of the RFC 8785 canonical JSON of the complete record body excluding only id>; the final record must pass DerivationRecord::validate().'
  - plumb-inference does not depend on plumb-store, and provider interfaces mention no Graph, SqliteRevisionStore, BranchName, PatchSet, commit
    capability or ArtifactStore; only the acquisition helper uses ArtifactStore.
  - 'Tests in crates/plumb-inference/tests/artifacts.rs cover at minimum: a fixed golden full InferenceRequest JSON, fixed identity projection
    and fixed request ID; any identity field change changes the ID while ref insertion order does not; duplicate input/evidence refs, non-Generic
    hashes, a wrong supplied id, unknown fields and invalid ProviderPolicy rejected; all 13 StageId values usable; provider config contributes
    to the ID; InferenceArtifact fixed JSON round-trip, request/provider/hash-kind/output-hash/model/unknown-field rules; NullProvider always
    ProviderDisabled; MockProvider exact replay, FixtureNotFound, registration mismatch rejected, repeated execution identical, replay of an anthropic
    request without rewriting; persistence of the three artifacts with exact kinds, media types and bytes, reload and replay of the validated-inference
    artifact and idempotent retry; deterministic DerivationRecord materialization with a fixed drv ID, exact field mapping, sorted unique refs,
    duplicate output rejection, validation, byte-identical repetition and ID changes for a different created_at or output ref; and the structural
    dependency rules.'
  tests:
  - cargo test -p plumb-inference
  - cargo test --workspace
  acceptance:
  - InferenceRequest IDs are deterministic from the exact identity projection and verified on deserialization; InferenceArtifact and ProviderExecution
    invariants hold against their request; NullProvider is always disabled and MockProvider replays only exact registered executions; acquisition
    persists the request, raw response and validated inference with exact kinds, media types and bytes, and replaying a persisted validated-inference
    artifact produces the same validated_output_hash; DerivationRecord materialization is deterministic with a fixed drv ID; providers have no
    graph, store, commit or artifact-store capability and plumb-inference does not depend on plumb-store.
  source_refs:
  - SRCREF-96AA517C73
  - SRCREF-25544DD485
  forbidden:
  - Do not permit provider code to mutate PSG.
  - Do not call a live network provider in tests.
  - Do not create a second Agent or DerivationRecord type in plumb-inference.
  - Do not couple inference acquisition to the F0.8 graph-commit transaction or give providers an ArtifactStore.
  commands:
  - cargo test -p plumb-inference
  - cargo fmt --check
  - cargo clippy --workspace --all-targets -- -D warnings
  - cargo test --workspace
  commit_message: 'F0.9: Implement inference artifact/provider contracts and provenance materialization'
- id: F0.10
  title: Implement compiler stage plan/evaluate contract and compile-run records
  phase: Foundation
  scope: NOW
  depends_on:
  - F0.9
  files:
  - crates/plumb-compiler/src/lib.rs
  - crates/plumb-compiler/src/stage.rs
  - crates/plumb-compiler/src/context.rs
  - crates/plumb-compiler/src/run.rs
  - crates/plumb-compiler/tests/stage.rs
  steps:
  - 'Implement exactly the compiler architecture §28 boundary: pub trait CompilerStage { fn id(&self) -> StageId; fn plan(&self, graph: &Graph,
    ctx: &CompileContext) -> Result<StagePlan, CompilerError>; fn evaluate(&self, graph: &Graph, ctx: &CompileContext, plan: &StagePlan, artifacts:
    &ArtifactSet) -> Result<StageEvaluation, CompilerError>; }. PLAN is pure: it receives no ArtifactStore, provider, validator, clock, network
    client or previously loaded artifact bytes and deterministically describes the required artifacts; acquisition/reuse orchestration outside
    the trait satisfies them; EVALUATE receives the exact acquired ArtifactSet. The trait exposes no InferenceProvider, ArtifactStore, SqliteArtifactStore,
    SqliteRevisionStore, BranchName, Clock, reqwest/HTTP/network client or commit capability.'
  - 'CompilerError is typed and distinguishes at least Core, Artifact, InvalidContext, InvalidScope, InvalidPlannedArtifact, InvalidExternalValidationRequest,
    InvalidExternalValidationArtifact, InvalidArtifactInput, InvalidArtifactSet, InvalidStagePlan, InvalidStageEvaluation and InvalidCompileRun,
    plus StageFailure { stage: StageId, code: String, message: String } for stage-specific operational/domain failures; contract validation
    errors are never collapsed into StageFailure.'
  - 'Scope is Project or Elements { refs: Vec<Id> }, serialized {"kind":"project"} or {"kind":"elements","refs":[...]}. Elements refs are non-empty,
    sorted and unique; the constructor sorts; serde requires canonical order and rejects duplicates; validation against a Graph requires every
    ref to be an existing Node or Edge ID. No name matching.'
  - 'CompileContext { input_revision: RevisionId, input_semantic_hash: Hash (Semantic), profile_ref: Id, profile_hash: Hash (Generic), rule_pack_hash:
    Hash (Generic), compiler_version: String, config: CanonicalJson } has no timestamp. compiler_version is non-empty without leading/trailing
    whitespace or control characters; config is a JSON object; config_hash() is the Generic canonical content hash of config. A constructor
    from plumb_store::LoadedRevision (or GraphRevision + Graph) copies input_revision, input_semantic_hash, profile_ref, profile_hash and rule_pack_hash;
    validate_for_graph(graph) also requires graph.semantic_hash() == input_semantic_hash and graph.profile_id() == profile_ref. No clock or
    environment read.'
  - 'PlannedArtifact { kind: ArtifactKind, media_type: String, bytes: Vec<u8> } has no timestamp; media_type is non-empty without control characters;
    content_hash() is the Generic SHA-256 of the exact bytes. Later acquisition persists it with an explicitly supplied timestamp. Its bytes
    use serde''s ordinary JSON byte-array form ("bytes":[0,1,2,255]), the fixed pilot StagePlan wire representation; changing it (for example
    to base64) requires a plan revision.'
  - 'ExternalValidationRequest { id: Hash, validator: String, task_kind: String, input_artifact_refs: Vec<Hash>, config: CanonicalJson } rejects
    unknown fields; validator matches ^[a-z][a-z0-9._-]*$; task_kind follows the InferenceRequest text rule; input_artifact_refs are Generic,
    sorted and unique; config is a JSON object. id is the Generic SHA-256 of the RFC 8785 canonical JSON of exactly {validator, task_kind, input_artifact_refs,
    config}. Provide new (sorts refs, computes id), validate, identity_projection and recompute_id; deserialization requires canonical order
    and verifies id.'
  - 'ExternalValidationArtifact { request_hash: Hash, validator: String, validated_output: CanonicalJson, validated_output_hash: Hash } rejects
    unknown fields; request_hash and validated_output_hash are Generic; validator follows the same grammar; validated_output_hash == validated_output.content_hash();
    against a request request_hash == request.id and validator == request.validator. It is persisted as external-validation / application/json
    / canonical full JSON. No external validator executable is implemented. The canonical ExternalValidationRequest and ExternalValidationArtifact
    types, with ExternalValidationError { InvalidRequest(String), InvalidArtifact(String) }, are owned by plumb-validation (crates/plumb-validation/src/external.rs),
    which never depends on plumb-compiler; plumb-compiler re-exports both type names from its public API and maps ExternalValidationError into
    CompilerError::InvalidExternalValidationRequest / InvalidExternalValidationArtifact, so wire forms, request IDs and validation semantics
    are unchanged. ExternalValidationArtifact::artifact_hash() -> Result<Hash, CoreError> is the Generic SHA-256 of the RFC 8785 canonical JSON
    of the complete artifact, equal to its ArtifactStore content hash.'
  - 'ArtifactInput { hash: Hash, kind: ArtifactKind, media_type: String, bytes: Vec<u8> } has no created_at; hash is Generic and equals the
    SHA-256 of the exact bytes; media_type is non-empty without control characters. Conversion from &plumb_artifacts::Artifact deliberately
    drops created_at, so acquisition time is unobservable to evaluation.'
  - 'ArtifactSet { deterministic_artifacts, inference_artifacts, validation_artifacts: Vec<ArtifactInput> }: each list is sorted by hash and
    unique, and hashes are unique across the whole set; inference inputs are validated-inference / application/json and validation inputs are
    external-validation / application/json; the constructor sorts; serde input must already be canonical. ArtifactSet::validate_for_plan(plan)
    requires a one-to-one match: exactly one deterministic input with the same hash, kind, media type and bytes per PlannedArtifact; exactly
    one validated-inference input per InferenceRequest whose bytes are the canonical InferenceArtifact JSON that validates for that request;
    exactly one external-validation input per ExternalValidationRequest whose bytes are the canonical ExternalValidationArtifact JSON that validates
    for it; no extra inputs.'
  - 'StagePlan { scope: Scope, deterministic_artifacts: Vec<PlannedArtifact>, inference_requests: Vec<InferenceRequest>, external_validation_requests:
    Vec<ExternalValidationRequest> } is ordered by content hash, request id and request id respectively, rejects duplicates, is sorted by its
    constructor and requires canonical order in serde. StagePlan::validate(stage, graph) requires a valid scope, every InferenceRequest.stage
    == stage and all nested contracts valid. No timestamps, provider clients or store handles.'
  - 'StageEvaluation { derivation_patch_set: Option<PatchSet>, proposals: Vec<Proposal> } uses plumb_patch::Proposal and contains no Findings,
    Questions, ImpactSet or IntakeReport (deterministic Findings/Questions are PSG nodes inside the derivation PatchSet; proposed ones are inside
    Proposal PatchSets; impact comes from F0.11; intake is later). Validation requires derivation_patch_set.base_semantic_hash == ctx.input_semantic_hash,
    and for every proposal proposal.stage == the stage, proposal.patch_set.base_semantic_hash == ctx.input_semantic_hash and proposal.validate();
    proposals are sorted by id and unique (the constructor sorts). Evaluation never applies or commits its patches.'
  - 'CompileRun (compiler architecture §4.2) { id, stage, input_revision, input_semantic_hash, profile_ref, profile_hash, rule_pack_hash, compiler_version,
    config_hash, deterministic_artifacts, inference_artifacts, validation_artifacts, output_derivation_patch_ref: Option<Hash>, output_proposal_refs,
    output_hash } has no timestamp and no Finding/Question arrays. Hash kinds: input_semantic_hash Semantic, every other hash and artifact ref
    Generic; every ref vector sorted and unique. CompileRun::new(stage, ctx, artifacts, evaluation) copies the context metadata, computes config_hash,
    copies the input refs from the exact ArtifactSet hashes, sets output_derivation_patch_ref = sha256(canonical PatchSet) when present, output_proposal_refs
    = sorted sha256(canonical Proposal), output_hash = sha256(canonical StageEvaluation) and id = Generic SHA-256 of the canonical run excluding
    only id. Provide identity_projection, recompute_id and validate; deserialization rejects unknown fields and verifies id. No ArtifactStore
    or clock is read.'
  - 'PersistedCompileRun { run: CompileRun, run_artifact_ref: Hash } and persist_compile_run<S: ArtifactStore>(store, run, evaluation, created_at)
    validate the run and evaluation and require output_hash and every output ref to equal the values recomputed from the evaluation before writing;
    then persist the derivation PatchSet (patch / application/json), every Proposal (proposal / application/json) and the CompileRun (compile-run
    / application/json) as canonical JSON with the caller-supplied created_at, checking that the stored hashes equal the refs in the run. This
    is never part of the graph-commit transaction: an immutable artifact persisted before a later failure may remain, retry is idempotent and
    no accepted PSG state changes. run.id (identity projection without id) and run_artifact_ref (complete run including id) are distinct.'
  - Scope, CompileContext, StagePlan, ArtifactInput, ArtifactSet, ExternalValidationRequest, ExternalValidationArtifact, StageEvaluation, Proposal
    and CompileRun contain no timestamp; the only timestamp is the created_at passed to artifact persistence, and changing it changes no ArtifactInput,
    StageEvaluation, CompileRun, run id or output_hash.
  - 'Tests in crates/plumb-compiler/tests/stage.rs cover at minimum: Scope wire forms, sorting, duplicates, empty and unsorted rejection and
    graph resolution of node and edge refs; CompileContext from LoadedRevision, semantic/profile mismatch, object config, fixed config hash
    and compiler_version rules; fixed ExternalValidationRequest JSON and ID, identity changes, ref sorting and rejection rules, fixed ExternalValidationArtifact
    JSON and its checks; ArtifactInput created_at dropping, hash/bytes and hash-kind rules; ArtifactSet categories, global uniqueness, sorting
    and exact plan matching (missing, extra, wrong inference or validation result, complete set accepted); fixed canonical StagePlan JSON, ordering,
    duplicates and stage mismatch; fixed canonical StageEvaluation, base/stage checks, proposal sorting and duplicates; a test-only fixture
    CompilerStage proving byte-identical plans and evaluations for equal inputs and independence from Artifact.created_at; fixed golden output_hash,
    CompileRun id, derivation patch ref, proposal refs and run artifact ref with exact CompileRun JSON and every change/rejection rule; compile-run
    persistence kinds, media types, bytes, reload, idempotent retry and created_at independence; and source-level capability checks of the CompilerStage
    trait.'
  tests:
  - cargo test -p plumb-compiler
  - cargo test --workspace
  acceptance:
  - A fixture stage returns byte-identical plan and evaluation bytes for repeated equal inputs, independent of artifact acquisition timestamps,
    and cannot access an InferenceProvider, ArtifactStore, revision store, clock, network client or commit through the stage trait; ArtifactSet
    matches its StagePlan one-to-one; CompileRun and its artifacts are deterministic with fixed golden hashes and contain no timestamps or duplicate
    Finding/Question/Impact/Intake truth.
  source_refs:
  - SRCREF-BC01A56530
  forbidden:
  - Do not add complete_json or HTTP calls to CompilerStage.
  - Do not put timestamps, provider clients or store handles in stage contracts, and do not add Finding, Question, ImpactSet or IntakeReport
    copies to StageEvaluation, Proposal or CompileRun.
  - Do not couple compile-run artifact persistence to the graph-commit transaction.
  commands:
  - cargo test -p plumb-compiler
  - cargo fmt --check
  - cargo clippy --workspace --all-targets -- -D warnings
  - cargo test --workspace
  commit_message: 'F0.10: Implement compiler stage plan/evaluate contract and compile-run records'
- id: F0.11
  title: Implement impact seed and dirty-set reachability
  phase: Foundation
  scope: NOW
  depends_on:
  - F0.10
  files:
  - crates/plumb-patch/src/lib.rs
  - crates/plumb-patch/src/impact.rs
  - crates/plumb-patch/tests/impact.rs
  steps:
  - 'Implement compute_impact(base: &Graph, result: &Graph, delta: &GraphDelta) -> Result<ImpactReport, ImpactError> in plumb-patch and export
    it from lib.rs. The code must not reference plumb-store, CommitResult, GraphRevision, SqliteRevisionStore or RevisionId, and no dependency
    is added to plumb-patch; orchestration passes CommitResult.delta after a commit. Never reapply the PatchSet. No ImpactSet exists inside
    StageEvaluation or Proposal; an impact preview may later be computed from a candidate graph''s GraphDelta but is never canonical Proposal
    content.'
  - 'Validate the inputs first: delta.base_semantic_hash == base.semantic_hash(), delta.result_semantic_hash == result.semantic_hash(), equal
    project_id and profile_id, and the added/removed/modified node and edge sets recomputed from base-vs-result persisted equality equal the
    delta''s sets (touched sets and ordinals are not reconstructed). ImpactError distinguishes at least Core, BaseHashMismatch, ResultHashMismatch,
    ProjectMismatch, ProfileMismatch, DeltaGraphMismatch, MissingBaseElement and MissingResultElement.'
  - 'ChangedSet { node_ids: BTreeSet<Id>, edge_ids: BTreeSet<Id> } contains, from the delta''s added/removed/modified candidates only (never
    touched_*), every added or removed element and every modified element whose node_element_hash / edge_element_hash differs between base
    and result. Revision, audit, derivation and View layout_ref/style_ref-only changes therefore do not enter it; status, payload, evidence,
    standards, tags, extensions and edge semantic fields do, for every NodeType including those excluded from semantic_hash.'
  - 'DirtySet { node_ids: BTreeSet<Id>, edge_ids: BTreeSet<Id> }: a changed node or edge is directly dirty when it is baseline-participating
    in base OR result (so Proposed->Accepted, Accepted->Rejected, removals and additions of baseline elements count, while elements non-baseline
    in both graphs stay only in ChangedSet). edge_ids is exactly the directly dirty changed edges. Every directly dirty changed edge adds
    its base and result endpoints to the node seeds, whatever its relation. Removed nodes use the base graph and added nodes the result graph
    for type, status and topology.'
  - 'Traverse from the dirty node seeds over the deterministic union of dependency arcs from base AND result, using only edges that are baseline-participating
    in the graph they come from, and only these 13 relations with exactly these impact directions (changed dependency -> affected dependent):
    derived_from TO->FROM; specified_by FROM->TO; constrained_by TO->FROM; satisfied_by FROM->TO; reads TO->FROM; writes TO->FROM; governed_by
    TO->FROM; uses_calculation TO->FROM; allocated_to FROM->TO; exposed_by FROM->TO; implemented_by FROM->TO; verified_by FROM->TO; implemented_as
    FROM->TO. Never follow them in reverse, never use other relations, never filter by semantic_hash participation, and never add traversed
    edges to DirtySet. Use ordered structures and a visited set so cycles terminate and results are deterministic.'
  - 'ProjectionKind is a closed enum of exactly 15 values with wire strings functional.yaml, requirements.yaml, architecture.yaml, openapi,
    asyncapi, arazzo, bpmn, dmn, adrs, implementation-plan, task-contracts, verification-matrix, standards-conformance-report, markdown, diagrams
    (ALL, as_str, unknown rejected). AffectedProjectionSet { projections: BTreeSet<ProjectionKind> } is empty for an empty DirtySet; otherwise
    markdown and standards-conformance-report are always included, a dirty Extension node includes all 15, and each dirty node adds the families
    of its NodeType: requirements.yaml <- Stakeholder, Concern, Goal, Need, Requirement, AcceptanceCriterion, Constraint, Term, Concept, Finding,
    Question, ResolutionDecision, Assumption; functional.yaml <- Requirement, AcceptanceCriterion, Constraint, Term, Concept, Actor, BusinessRole,
    Entity, Attribute, DomainRelationship, State, Transition, Invariant, Operation, Outcome, Event, Process, ProcessNode, Rule, DecisionTable,
    Calculation, Calendar, Scenario, Principal, SecurityRole, Permission, ResourceScope, PolicyCondition, SeparationConstraint, QualityCharacteristic,
    Measure, QualityScenario; architecture.yaml <- SystemOfInterest, ArchitectureDescription, ArchitectureCandidate, Viewpoint, View, ModelKind,
    SoftwareSystem, Container, Component, Module, Interface, DataStore, ExternalSystem, DeploymentNode, RuntimeEnvironment, NetworkZone, ArchitectureDecision,
    Technology, TechnologySelection, ApiContract, ApiOperation, EventContract, Channel, Message, DataSchema, TechnicalWorkflow; openapi <-
    ApiContract, ApiOperation, DataSchema; asyncapi <- EventContract, Channel, Message, DataSchema; arazzo <- TechnicalWorkflow, ApiOperation;
    bpmn <- Process, ProcessNode, Operation, Event, Actor, BusinessRole; dmn <- Rule, DecisionTable, Calculation; adrs <- ArchitectureDecision,
    Technology, TechnologySelection; implementation-plan <- Capability, ImplementationSlice, WorkPackage, Migration, Release; task-contracts
    <- ImplementationSlice, WorkPackage, TaskContract; verification-matrix <- Scenario, VerificationObligation, TestCase, ScenarioRun, TestExecution,
    TestReceipt, ArchitectureCheck, CoverageRecord, CodeBinding; diagrams <- Entity, DomainRelationship, State, Transition, Process, ProcessNode,
    Operation, Event, SystemOfInterest, ArchitectureDescription, ArchitectureCandidate, Viewpoint, View, SoftwareSystem, Container, Component,
    Module, Interface, DataStore, ExternalSystem, DeploymentNode, RuntimeEnvironment, NetworkZone, ApiOperation, Channel, Message.'
  - 'AffectedGateNamespaceSet { gates: BTreeSet<GateId> } uses plumb_core::GateId. Each dirty node''s NodeType (from result if present, else
    base) maps to exactly one earliest owning gate, and that gate plus every later gate in GateId::ALL is affected: I0: SourceArtifact, EvidenceFragment,
    DerivationRecord, Agent, Finding, StandardsProfile, Extension; F1: Stakeholder, Concern, Goal, Need, Requirement, AcceptanceCriterion,
    Constraint, Term, Concept; F2: Actor, BusinessRole, Entity, Attribute, DomainRelationship, State, Transition, Invariant, Operation, Outcome,
    Event, Process, ProcessNode, Rule, DecisionTable, Calculation, Calendar, Principal, SecurityRole, Permission, ResourceScope, PolicyCondition,
    SeparationConstraint; F3: Question, ResolutionDecision, Assumption; F4: Scenario, ScenarioRun; Q1: QualityCharacteristic, Measure, QualityScenario;
    A2: SystemOfInterest, ArchitectureDescription, ArchitectureCandidate, Viewpoint, View, ModelKind, SoftwareSystem, Container, Component,
    Module, Interface, DataStore, ExternalSystem, DeploymentNode, RuntimeEnvironment, NetworkZone, Technology, TechnologySelection; A3: ApiContract,
    ApiOperation, EventContract, Channel, Message, DataSchema, TechnicalWorkflow; A4: ArchitectureDecision; D1: Capability, ImplementationSlice,
    WorkPackage, TaskContract, Migration, Release; D2: VerificationObligation, TestCase; C1: TestExecution, TestReceipt, CodeBinding, ArchitectureCheck,
    CoverageRecord. All 86 NodeTypes appear exactly once; A1 has no owned type and is reached by downstream expansion. No per-rule filtering
    happens before F0.12/F0.13.'
  - 'ImpactReport { changed: ChangedSet, dirty: DirtySet, affected_projections: AffectedProjectionSet, affected_gates: AffectedGateNamespaceSet
    } has a deterministic serde form and no timestamp, branch or revision ID, stale evidence, readiness score or confidence. StaleEvidenceSet
    and per-rule AffectedGateRuleSet are deferred (C1 staleness, F0.12/F0.13).'
  - 'Tests in crates/plumb-patch/tests/impact.rs (inside a module whose name contains impact) cover at minimum: every ChangedSet rule (added/removed/modified
    nodes and edges, audit/derivation/View layout-only exclusion, semantic View change, Proposed changes, modify-then-restore, delta mismatch);
    every DirtySet status case (Accepted, Suspect, Superseded, Deprecated, Proposed/Rejected in both, boundary crossings, changed-edge endpoints,
    Proposed edge, removed node); the direction of each of the 13 relations and non-propagation in reverse; Calculation <-uses_calculation-
    Operation -verified_by-> VerificationObligation -implemented_as-> Scenario dirtying all four; base-only and result-only arcs; Proposed/Rejected
    dependency edges; has_attribute not traversed but its change dirtying its endpoints; cycles, repeated byte-identical reports and insertion-order
    independence; the projection mappings for Requirement, Process, DecisionTable, ApiOperation, Message, ArchitectureDecision, ImplementationSlice,
    VerificationObligation, Extension, empty and View-only; gate expansion for one type per owning gate and the all-86 mapping check; a hand-written
    golden ImpactReport JSON; and the source/dependency guard: the raw complete impact.rs source, comments included, contains none of plumb_store,
    CommitResult, SqliteRevisionStore and RevisionId; its executable source does not access touched_nodes or touched_edges (documentation
    may contrast touched with changed); and the plumb-patch manifest has no plumb-store dependency.'
