    and uses additionalProperties false on the root, each classification entry and each intent variant. The root requires version (const 1),
    classifications and intents. A classification entry requires candidate_ref (pattern ^seg:[0-9a-f]{16}$), requirement_kind (null or one of
    the nine kinds) and level (null or one of the six levels); wrong case and other values reject. intents items are exactly one of four mutually
    exclusive variants, each with candidate_ref and intent_kind: goal {candidate_ref, intent_kind}; need {candidate_ref, intent_kind, stakeholder_refs}
    with at least one unique Id-pattern ref; concern {candidate_ref, intent_kind, name, description} with non-empty strings; constraint {candidate_ref,
    intent_kind, constraint_category, strength} with category in business, technical, technology, security, data, integration, operational,
    legal, regulatory, organizational, legacy and strength in mandatory, preferred, prohibited. There is no confidence, probability, score or
