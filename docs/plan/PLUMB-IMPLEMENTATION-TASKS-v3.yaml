    or audit/derivation metadata leaves ChangedSet, DirtySet, affected projections and affected gates empty; impact follows exactly the 13
    directed relations over baseline arcs of both revisions; the ImpactReport is deterministic and matches a hand-written golden fixture;
    plumb-patch does not depend on plumb-store.
