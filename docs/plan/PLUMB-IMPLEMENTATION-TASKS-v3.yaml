- id: F0.12
  title: Implement standards profile loader and validation rule metadata
  phase: Foundation
  scope: NOW
  depends_on:
  - F0.11
  files:
  - crates/plumb-validation/src/lib.rs
  - crates/plumb-validation/src/model.rs
  - crates/plumb-validation/src/profile.rs
  - crates/plumb-validation/src/registry.rs
  - crates/plumb-validation/tests/profile.rs
  steps:
  - 'Scope. F0.12 owns profile parsing and validation, gate and rule metadata, the closed validation vocabularies, the profile and rule-pack
    hashes, the metadata registry and the NOW/deferred evaluator requirement. It implements no rule evaluator function and no placeholder
    or no-op evaluator: evaluator bindings and execution belong to F0.13. Do not introduce ValidationContext, Applicability, RuleResult, RuleEvaluator,
    GateReport, Waiver or finding generation. Do not define a ValidationArtifact struct: the rulebook §7 term means plumb_compiler::ExternalValidationArtifact
    stored as ArtifactKind::ExternalValidation / application/json. F0.12 adds no plumb-compiler dependency and changes no Cargo.toml.'
  - 'config/profiles/plumb-software-2026.1-rules.yaml is the read-only authority: never reorder, normalize, reformat or edit it. Every rule
    ID, severity, class, waiver policy and text is loaded from it; production source contains no rule-ID enum, per-rule constant, per-rule
    match arm or list of rule IDs. pub const EXPECTED_RULE_COUNT: usize = 133 is a permitted schema invariant.'
  - 'Closed vocabularies, each exposing ALL and as_str() and rejecting unknown or wrong-case strings: RuleClass { ExternalStandard, ExternalInterop,
    PlumbCore, ProfilePolicy, OrganizationPolicy } with wire strings external_standard, external_interop, plumb_core, profile_policy, organization_policy;
    RuleResultState { Pass, Fail, Warn, NotApplicable, Waived, Error } with wire strings PASS, FAIL, WARN, NOT_APPLICABLE, WAIVED, ERROR (exactly
    six; NOT_IMPLEMENTED is not a state; in F0.12 this is metadata vocabulary only); Severity { Blocker, Error, Warn, Info } with wire strings
    blocker, error, warn, info (info stays in the closed type although the supplied rules do not use it); WaiverPolicy { Forbidden, DecisionRequired,
    ProfileAllow } with wire strings forbidden, decision_required, profile_allow; EvaluationMode { Deterministic } with wire string deterministic.
    Reuse plumb_core::GateId, plumb_psg::MappingRole and plumb_psg::MappingStrength; do not redefine them and do not add a StandardId type.'
  - 'Fixed-shape structs, all rejecting unknown fields: StandardDefinition { standard: String, version: String, role: MappingRole, note: String
    } (all four required; the catalog key is a String); StandardRef { standard: String, version: String, role: MappingRole, note: String,
    mapping_strength: MappingStrength } (all five required when the block exists); GateMetadata { id: GateId, purpose: String, rule_ids: Vec<String>,
    pass_algorithm: String }; RuleMetadata { id: String, gate: GateId, title: String, severity: Severity, rule_class: RuleClass, applies_when:
    String, check: String, pass_condition: String, waiver_policy: WaiverPolicy, standard_reference: Option<StandardRef>, remediation: Option<String>,
    evaluation: EvaluationMode, finding_status_on_fail: String }; ValidationProfile { profile_id: Id, profile_version: String, metamodel:
    String, status: String, rule_classes: BTreeMap<RuleClass, String>, result_states: Vec<RuleResultState>, standards: BTreeMap<String, StandardDefinition>,
    gates: Vec<GateMetadata>, rules: Vec<RuleMetadata> }, exactly the nine top-level YAML fields. No field absent from the YAML is introduced;
    an absent optional field serializes as JSON null.'
  - 'Text rules: profile_version, metamodel and status are non-empty, not surrounded by whitespace and free of control characters, and their
    current literal values are not hard-coded. Rule id, title, applies_when, check, pass_condition, finding_status_on_fail and, when present,
    remediation are non-empty, without leading or trailing whitespace and without control characters other than an embedded newline. Every
    gate purpose, every gate pass_algorithm and every rule-class description is non-empty. Text is never otherwise normalized, rewritten or
    paraphrased, and pass_algorithm is not encoded as executable logic in F0.12. Every standards-catalog key, every StandardDefinition standard,
    version and note and every StandardRef standard, version and note is non-empty, without leading or trailing whitespace and without control
    characters; a malformed value fails with InvalidProfileText and no value is trimmed or normalized.'
  - 'Profile validation requires all of: rule_classes has exactly the five RuleClass::ALL keys; result_states is exactly the six states, each
    once (a missing, duplicate, extra or wrong-case state is rejected and malformed input is never silently repaired); the standards catalog
    has no duplicate (standard, version, role) triple and every rule StandardRef matches exactly one catalog definition on (standard, version,
    role), while note and mapping_strength are rule-specific; exactly 13 gate entries with each GateId exactly once, every rule_ids list non-empty,
    no rule ID twice within a gate and no rule ID in two gates; exactly 133 RuleMetadata entries with unique IDs; the union of all gate rule_ids
    equals the RuleMetadata ID set exactly (no unknown gate rule ID, no orphan rule); every RuleMetadata.gate equals the gate that lists it;
    every rule uses EvaluationMode::Deterministic.'
  - 'A loaded ValidationProfile is normalized: rule_classes and standards in BTreeMap key order, result_states in RuleResultState::ALL order,
    gates in GateId::ALL order, each gate''s rule_ids in lexicographic order and rules in lexicographic order of id. ValidationProfile::profile_hash()
    -> Result<Hash, CoreError> is the Generic sha256: hash of the RFC 8785 canonical JSON of the complete normalized typed ValidationProfile.
    ValidationProfile::rule_pack_hash() -> Result<Hash, CoreError> is the Generic hash of the canonical JSON of exactly { result_states, gates,
    rules } under the same normalization: rule-level standard_reference and gate purpose, rule_ids and pass_algorithm are included; profile_id,
    profile_version, metamodel, status, rule_classes and the standards catalog are excluded. Both functions normalize their own input, never
    hash raw YAML bytes and are unaffected by YAML formatting, comments or ordering. These are the profile_hash and rule_pack_hash persisted
    by GraphRevision, CompileContext and GateReport.'
  - 'load_profile_yaml(yaml: &str) -> Result<ValidationProfile, ValidationError> parses, validates and normalizes; it takes no filesystem
    path and uses no global singleton, environment variable, network or wall clock. load_builtin_software_profile() -> Result<ValidationProfile,
    ValidationError> may include_str! the supplied YAML and must go through load_profile_yaml; no second parser exists.'
  - 'pub const NOW_GATES: [GateId; 5] = [I0, F1, F2, F3, F4]. ValidationRegistry is a metadata and availability registry derived from one
    validated ValidationProfile; it stores no evaluator function and no second copy of rule metadata. It exposes new(profile), profile(),
    rule(id), gate(gate), rules_for_gate(gate), required_now_rule_ids() (the deterministic sorted set of the rule IDs of the NOW gates, computed
    from loaded metadata and never hard-coded), is_now_gate(gate) and require_now_gate(gate). For the supplied profile exactly 54 rules require
    NOW evaluators and the other 79 are deferred metadata; a profile whose NOW count is not 54 is rejected by the registry with NowRuleCountMismatch.
    require_now_gate succeeds for I0, F1, F2, F3 and F4 and returns ValidationError::GateNotImplemented(GateId) for Q1, A1, A2, A3, A4, D1,
    D2 and C1, which is an evaluator-availability error and not a rule result; the metadata of every gate and rule stays queryable.'
  - ValidationError is typed and distinguishes at least Yaml, InvalidProfile, InvalidProfileText, RuleCountMismatch, DuplicateRuleId, GateCountMismatch,
    DuplicateGate, DuplicateGateRule, UnknownGateRule, OrphanRule, RuleGateMismatch, ResultStatesMismatch, RuleClassesMismatch, DuplicateStandardDefinition,
    UnknownStandardReference, NowRuleCountMismatch and GateNotImplemented. Yaml may carry the stringified serde_yaml error; structural failures
    are never collapsed into one generic String.
  - 'Tests in crates/plumb-validation/tests/profile.rs (inside a module whose name contains profile) cover at minimum: exhaustive exact wire
    values, deserialization, unknown and wrong-case rejection and ALL for RuleClass (5), RuleResultState (6), Severity (4), WaiverPolicy (3)
    and EvaluationMode (1), and reuse of GateId, MappingRole and MappingStrength; the supplied YAML loading with profile_id profile:plumb-software-2026.1,
    profile_version 2026.1-draft.1, metamodel 3.0-draft.1, status implementation draft, 5 rule classes, 6 result states, 15 standards, 13
    gates, 133 rules, 23 rule-level StandardRefs, severities blocker/error/warn, classes external_standard/external_interop/plumb_core, all
    three waiver policies, evaluation deterministic and finding_status_on_fail Open; gate counts I0 6, F1 11, F2 24, F3 6, F4 7, Q1 8, A1
    9, A2 9, A3 14, A4 9, D1 9, D2 10, C1 11; rejection of a duplicate, missing or extra RuleMetadata, a duplicate or missing gate, a rule
    duplicated within a gate or listed in two gates, an unknown gate rule, an orphan rule and a rule whose gate differs from its containing
    gate; 54 required-now and 79 deferred rule IDs, require_now_gate for all 13 gates and later-gate metadata queries; StandardRef resolution
    and rejection of an unknown standard/version/role combination, a duplicate catalog triple, an unknown mapping role or strength and an
    unknown StandardRef field; rejection of an unknown top-level, gate, rule or StandardDefinition field, a wrong-case, missing or duplicate
    result state, an unknown or missing rule class and empty textual metadata; independently calculated hard-coded profile_hash and rule_pack_hash
    of the supplied YAML (both Generic), unchanged by reordering rules or gate rule_ids, with a severity change and a rule StandardRef note
    change altering both, and a status change and a catalog note change altering only profile_hash; registry lookups, ordering, derivation
    from the profile and absence of a metadata copy; and a source-level check that production source contains no rule ID of the supplied profile.'
  tests:
  - cargo test -p plumb-validation profile
  - cargo test -p plumb-validation
  - cargo test --workspace
  acceptance:
  - All 133 metadata rules load from the unmodified supplied YAML; exactly 54 rules of the NOW gates I0, F1, F2, F3 and F4 require evaluators
    and 79 are deferred metadata; duplicate rule IDs fail profile loading; profile_hash and rule_pack_hash equal independently calculated
    fixed values and ignore YAML ordering and formatting; a later gate returns ValidationError::GateNotImplemented while its metadata stays
    queryable; no evaluator function exists in F0.12.
  source_refs:
  - SRCREF-0B1179FD2E
  - SRCREF-5608A0663D
  forbidden:
  - Do not rewrite rule IDs or severities in code.
  - Do not duplicate rule metadata in Rust constants when it can be loaded from YAML.
  - Do not implement evaluator functions, placeholder evaluators or any F0.13 execution type, and do not modify the supplied profile YAML.
  commands:
  - cargo test -p plumb-validation profile
  - cargo test -p plumb-validation
  - cargo fmt --check
  - cargo clippy --workspace --all-targets -- -D warnings
  - cargo test --workspace
