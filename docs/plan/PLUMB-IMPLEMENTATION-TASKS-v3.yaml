- id: F0.14
  title: Implement functional.yaml v2 compatibility projection from PSG
  phase: Foundation
  scope: NOW
  depends_on:
  - F0.13
  files:
  - crates/plumb-functional/src/lib.rs
  - crates/plumb-functional/src/model.rs
  - crates/plumb-functional/src/project.rs
  - crates/plumb-functional/tests/golden.rs
  - schemas/functional-v2.schema.json
  - docs/formats.md
  steps:
  - Direction and principle. F0.14 implements PSG -> functional.yaml v2 only; there is no functional.yaml -> PSG importer, round trip or writeback.
    Projection reads the Graph and the ValidationProfile, produces a deterministic compatibility document and deterministic companion metadata,
    never mutates the Graph, never generates a SemanticPatch or Proposal and never writes projected values back. No production function takes
    functional-v2 YAML and produces a Graph, SemanticPatch or Proposal, and no API named like import_functional_v2, load_functional_into_graph,
    apply_functional_yaml or functional_to_psg exists. plumb-functional depends on the workspace serde_yaml and jsonschema (added by Hotfix 019);
    no other dependency is added.
  - 'API. pub fn project_functional_v2(graph: &Graph, profile: &ValidationProfile) -> Result<FunctionalProjection, ProjectionError> requires graph.profile_id()
    == profile.profile_id (ProfileMismatch otherwise) and takes profile_hash from profile.profile_hash(), never from the caller. FunctionalProjection
    { document: FunctionalV2, yaml: Vec<u8>, metadata: ProjectionMetadata }. pub const FUNCTIONAL_V2_VERSION: u32 = 2 and pub const FUNCTIONAL_V2_PROJECTION_VERSION:
    u32 = 2. ProjectionError is typed and distinguishes at least Core, Yaml, Schema, ProfileMismatch, ConflictingLegacyNfr, InvalidProjectionNotice
    and UnrepresentableElement (an Accepted Scenario whose given or then contains a non-object entry cannot be carried by any listed notice code
    and fails the projection instead of being dropped silently or mapped to an invented code).'
  - 'Document. FunctionalV2 has exactly the top-level fields version (2), model_hash, glossary, actors, roles, entities, calendars, calculations,
    rules, operations, processes, events, requirements, scenarios, assumptions, in that order; all thirteen collections are always serialized,
    including when empty, and no other top-level field (in particular no profile_hash, projection_version, content_hash, warnings or lossy_mappings)
    exists. model_hash == Graph.semantic_hash() exactly (psg:sha256:<64 hex>): the v2 plan''s fm: prefix never defined its bytes, so v3 uses the
    PSG semantic hash rather than inventing a second hash system. Nested shapes follow v2 plan §4.1 and the mappings below; fields marked ? in
    §4.1, calendar region and holidays_ref, and the entity and operation nfr objects (which carry only QualityScenario/idempotency-mapped keys)
    are omitted when absent. Required legacy fields are never fabricated from names, capitalization or text; when one cannot be reconstructed
    from typed PSG the legacy object is omitted and a notice is recorded unless a mapping below defines a deterministic collapse.'
  - 'Metadata and notices. ProjectionNotice { code: String, source_refs: Vec<Id>, message: String }: code and message non-empty, trimmed and control-free,
    source_refs sorted and unique; notices are sorted by (code, source_refs, message), unique and carry no timestamp (InvalidProjectionNotice
    otherwise). ProjectionMetadata { source_semantic_hash: Hash (Semantic, == graph.semantic_hash()), profile_hash: Hash (Generic, == profile.profile_hash()),
    projection_version: u32 (2), content_hash: Hash (Generic SHA-256 of the exact emitted UTF-8 YAML bytes), warnings: Vec<ProjectionNotice>,
    lossy_mappings: Vec<ProjectionNotice> }. Warnings record omitted or unrepresentable content; lossy_mappings record a deterministic collapse
    that was projected. Metadata is companion data and never inside functional.yaml. The only notice codes are: V2_NON_ACCEPTED_BASELINE_OMITTED,
    V2_GLOSSARY_DEFINITION_MISSING, V2_ORGANIZATION_ACTOR_COLLAPSE, V2_BUSINESS_ROLE_COLLAPSE, V2_SECURITY_ROLE_COLLAPSE, V2_PERMISSION_SCOPE_OMITTED,
    V2_ATTRIBUTE_NULLABILITY_OMITTED, V2_RELATIONSHIP_DETAIL_OMITTED, V2_EVENT_TRIGGER_TRANSITION_OMITTED, V2_OPERATION_PERFORMER_MISSING, V2_MULTIPLE_PERFORMERS_COLLAPSED,
    V2_ENTITY_LEVEL_READ_WRITE_OMITTED, V2_OUTCOME_KIND_COLLAPSE, V2_IDEMPOTENCY_UNREPRESENTABLE, V2_CALCULATION_TARGET_UNREPRESENTABLE, V2_RULE_TABLE_UNREPRESENTABLE,
    V2_DECISION_TABLE_DETAIL_OMITTED, V2_EVENT_PAYLOAD_UNREPRESENTABLE, V2_ACCEPTANCE_CRITERION_UNMAPPED, V2_PROCESS_TRIGGER_UNREPRESENTABLE,
    V2_PROCESS_STEP_OPERATION_MISSING, V2_QUALITY_SCENARIO_COLLAPSE, V2_QUALITY_SCENARIO_OMITTED, V2_SCENARIO_MULTI_REQUIREMENT_COLLAPSE, V2_SCENARIO_REQUIREMENT_MISSING,
    V2_SCENARIO_OPERATION_MISSING, V2_SCENARIO_THEN_CONFLICT, V2_ASSUMPTION_UNREPRESENTABLE. No ad-hoc code is created; a genuinely uncovered
    loss case blocks the task.'
  - Serialization. The yaml bytes are exactly serde_yaml's serialization of the normalized typed FunctionalV2, with no trimming, line sorting,
    whitespace rewriting, comments or timestamps. Every projected collection is sorted by ID; set-like nested references (operations, reads, writes,
    governed_by, emits, payload, aliases, outcomes, affected targets) are sorted; intrinsically ordered content (pre, post, enum values, week_pattern,
    conditions, rows, given) keeps its PSG order. Open JSON values keep serde_json's key order.
  - Accepted-only view and lookup discipline. Only Accepted nodes and edges contribute. Proposed and Rejected elements are ignored. A Suspect,
    Superseded or Deprecated node of a projectable type, or such an edge of a relation the projection reads, is omitted with V2_NON_ACCEPTED_BASELINE_OMITTED
    (its ID in source_refs, plus the dependent legacy object when that omission removes it, for example a Transition whose only transitions_via
    edge is not Accepted). Associations are read only from typed payload fields, typed Accepted RelationKind edges and typed relation properties,
    never from names, ID prefixes, text similarity, array order, capitalization or requirement order. No View is projected.
  - 'Glossary and actors. Every Accepted Term yields {id: Term ID, name: term, definition, aliases: aliases or [] (sorted)}; definition is the
    definition of the Accepted Concept named by definition_ref, otherwise "" with V2_GLOSSARY_DEFINITION_MISSING. Every Accepted Concept not referenced
    by an Accepted Term yields {id, name, definition, aliases: []}. Terms are never merged by string. Every Accepted Actor yields {id, kind} with
    human -> human, system -> system, external_system -> external and organization -> external (lossy, V2_ORGANIZATION_ACTOR_COLLAPSE).'
  - 'Roles. Every Accepted BusinessRole yields {id, actor: the BusinessRole ID as a projection-only self-token, operations: Accepted Operations
    with an Accepted performed_by edge to it} with lossy V2_BUSINESS_ROLE_COLLAPSE; the token never creates a PSG Actor, is never imported back
    and asserts nothing. Every Accepted SecurityRole yields {id, actor, operations: the sorted union over Accepted SecurityRole -grants-> Permission
    -permits-> Operation}; actor is the single Actor with an Accepted assigned_role edge to it, otherwise (zero or several) the SecurityRole ID
    as self-token with lossy V2_SECURITY_ROLE_COLLAPSE, never an arbitrary pick. Every Permission used whose scope or conditions exist records
    lossy V2_PERMISSION_SCOPE_OMITTED with the SecurityRole, Permission, ResourceScope and PolicyCondition IDs; PSG stays authoritative for security
    semantics.'
  - 'Entities. Every Accepted Entity yields {id, attributes, relationships, states, transitions, invariants, nfr?}, nested lists sorted by ID.
    Attributes come from Accepted Entity -has_attribute-> Attribute: {id, type: value_type, class: data_classification or "none", unit?, precision?,
    enum?: enum_values}; nullable has no v2 field and every projected Attribute records V2_ATTRIBUTE_NULLABILITY_OMITTED (a data_classification
    outside pii|financial|confidential|none is not remapped and fails schema validation). Relationships are the Accepted DomainRelationships with
    from_entity == Entity ID: {id, to: to_entity, card_from, card_to, snapshot: snapshot_semantics or false}, with V2_RELATIONSHIP_DETAIL_OMITTED
    whenever relationship_kind, name or ownership carries data; ownership is never inferred. States are the Accepted States with an Accepted Entity
    -has_state-> State edge: {id}. Transitions are the Accepted Transitions with stateful_ref == Entity ID and exactly one Accepted transitions_via
    edge: an Operation target gives {from: from_state, to: to_state, operation, actor, precondition?: guard_expr}, where actor is the operation
    performer resolved as for operations (none: omitted with V2_OPERATION_PERFORMER_MISSING); an Event target omits the transition with V2_EVENT_TRIGGER_TRANSITION_OMITTED.
    Invariants are the Accepted Invariants with scope_ref == Entity ID: {id, expr: expression}.'
  - 'Operations. Every Accepted Operation yields {id, kind: operation_kind, actor, reads, writes, pre, post, outcomes, governed_by, nfr?}. actor
    is the single performer of the Accepted performed_by edges; none omits the operation with V2_OPERATION_PERFORMER_MISSING; several use the
    lexicographically smallest with lossy V2_MULTIPLE_PERFORMERS_COLLAPSED listing all performers. reads and writes are the Accepted Attribute
    targets of Accepted reads/writes edges; Entity targets are omitted (never expanded into attributes) with V2_ENTITY_LEVEL_READ_WRITE_OMITTED.
    pre and post are preconditions and postconditions or []. outcomes are the Accepted Outcomes of Accepted produces edges: {id, kind} with success
    -> success and business_failure, technical_failure, partial -> failure (lossy V2_OUTCOME_KIND_COLLAPSE). governed_by are the Accepted Rule
    and DecisionTable targets of Accepted governed_by edges. idempotency "true" or "false" maps nfr.idempotent to that boolean; any other value
    is not mapped and warns V2_IDEMPOTENCY_UNREPRESENTABLE.'
  - 'Calendars, calculations, rules, events. Every Accepted Calendar yields {id, region?, tz: time_zone, holidays_ref?: holiday_source, week_pattern}
    with no date or time inference. Every Accepted Calculation is omitted with V2_CALCULATION_TARGET_UNREPRESENTABLE because no PSG field or core
    relation identifies its legacy target attribute; no target is inferred, so calculations is empty in F0.14. Every Accepted Rule is omitted
    with V2_RULE_TABLE_UNREPRESENTABLE; condition tables are never fabricated from expressions. An Accepted DecisionTable whose inputs and rows
    are all JSON objects yields {id, conditions: inputs, rows: rows} unmodified, with V2_DECISION_TABLE_DETAIL_OMITTED because hit_policy and
    outputs are not carried; otherwise it is omitted with V2_RULE_TABLE_UNREPRESENTABLE. Every Accepted Event yields {id, payload}: when payload_schema_ref
    names an Accepted DataSchema, payload is the Accepted Attributes bound by Accepted DataSchema -schema_for-> Attribute edges with role attribute;
    when a payload_schema_ref exists but yields no such Attribute, payload is [] with V2_EVENT_PAYLOAD_UNREPRESENTABLE; payload is never inferred
    from names.'
  - 'Requirements. Every Accepted Requirement yields {id, text: statement, class: requirement_kind, criteria: [], operations: the Accepted Operation
    targets of Accepted specified_by edges, status: "Confirmed"}; normalised is omitted because PSG has no EARS-normalized field. No core relation
    attaches an AcceptanceCriterion to a Requirement, so every Accepted AcceptanceCriterion records V2_ACCEPTANCE_CRITERION_UNMAPPED and criterion
    ownership is never inferred from text.'
  - 'Processes. An Accepted Process uses the Accepted ProcessNodes with process_ref == Process ID. Its trigger needs exactly one Accepted start
    node with exactly one of message_ref ({kind: "event", ref: message_ref}) or timer_expr ({kind: "timer", ref: timer_expr}); otherwise the process
    is omitted with V2_PROCESS_TRIGGER_UNREPRESENTABLE and no manual trigger is invented. Every other Accepted node except end nodes becomes a
    step {id, actor, operation: operation_ref, emits, next} or, without operation_ref, is omitted with V2_PROCESS_STEP_OPERATION_MISSING. The
    step actor is resolved from the node''s Accepted performed_by edges with the operation rule, falling back to the performer of its Operation
    (typed relation reuse); with no performer at all the step is omitted with V2_OPERATION_PERFORMER_MISSING. emits are the Accepted Event targets
    of Accepted produces edges; next are the Accepted next edges {to: target ID, when?: the source node''s condition_expr}. The process outcomes
    are the sorted union of the Accepted Outcome targets produced by its nodes.'
  - 'Quality scenarios. An Accepted QualityScenario maps to a legacy NFR value only when it has exactly one Accepted characterized_by edge to
    an Accepted QualityCharacteristic, affected_refs holds exactly one ID of an Accepted Entity or Operation, and the characteristic name equals
    a legacy key exactly (no case folding or fuzzy matching): consistency, availability, volatility, residency, retention for an Entity (nfr.<key>
    = threshold); latency_ms (JSON number), audit (JSON boolean), idempotent (JSON boolean) for an Operation. A mapped scenario still records
    lossy V2_QUALITY_SCENARIO_COLLAPSE (stimulus, response, environment, source, priority and measure are dropped); an unmappable one is omitted
    from the NFR bags with V2_QUALITY_SCENARIO_OMITTED. Identical values for the same target and key, from several scenarios or from a scenario
    and the idempotency field, are emitted once; different values fail with ConflictingLegacyNfr and are never resolved by ID or order.'
  - 'Scenarios and assumptions. An Accepted Scenario yields {id, requirement, operation, given, when, then, status: "Confirmed"}. requirement
    is its single requirement_refs entry; with several, the lexicographically smallest with lossy V2_SCENARIO_MULTI_REQUIREMENT_COLLAPSE listing
    all; with none, the scenario is omitted with the warning V2_SCENARIO_REQUIREMENT_MISSING. operation is the string when["operation"]; if when
    is not an object or has no string operation the scenario is omitted with V2_SCENARIO_OPERATION_MISSING and the operation is never inferred.
    given entries must be JSON objects (a non-object given or then entry fails with UnrepresentableElement); given and when are carried unmodified;
    then is {} for no entries, the single object, or the merge of objects with disjoint keys, and overlapping keys omit the scenario with V2_SCENARIO_THEN_CONFLICT.
    run is omitted because no core relation links a Scenario to a ScenarioRun. An Accepted Assumption with finding_ref, default_value and expires_at
    present yields {id, finding, default, owner: owner_ref, expires: expires_at}; otherwise it is omitted with V2_ASSUMPTION_UNREPRESENTABLE and
    no default or expiry is invented.'
  - Schema. schemas/functional-v2.schema.json declares JSON Schema draft 2020-12 ($schema https://json-schema.org/draft/2020-12/schema), has top-level
    additionalProperties false, version const 2, model_hash pattern ^psg:sha256:[0-9a-f]{64}$ and all thirteen collections required; nested objects
    follow v2 §4.1 and the mappings above with optional fields not required, and permit open JSON only for week_pattern, conditions, rows, given,
    when, then and assumption default. No ProjectionMetadata field appears in it. The workspace jsonschema 0.18 dependency enables its draft202012
    feature and the schema is compiled and evaluated with Draft::Draft202012 (FUNCTIONAL_V2_SCHEMA_DRAFT); a regression proves the dialect, compilation,
    golden acceptance and mutation rejection. project_functional_v2 validates every generated document against this schema at runtime, with no
    network resolution, before returning (Schema error otherwise); the schema is not test-only.
  - 'docs/formats.md documents: functional.yaml is compatibility output only and PSG is canonical; version 2; model_hash equals the PSG semantic
    hash; ProjectionMetadata is companion data with its exact fields; the Accepted-only policy and status omissions; BusinessRole, SecurityRole
    and Permission loss behavior; QualityScenario legacy collapse; every notice code with its source_refs; that unsupported objects are never
    fabricated; and that projected YAML is never written back automatically.'
  - 'Tests in crates/plumb-functional/tests/golden.rs (inside a module whose name contains golden) use a hand-built deterministic HR PSG fixture,
    not a pretend full compiled HR graph (the full-HR export belongs to S4.7), covering Term/Concept, Actor, BusinessRole, SecurityRole/Permission,
    Entity/Attribute/relationship/state/transition/invariant, Calendar, Operation/Outcome, Process/ProcessNode, Event, Requirement, DecisionTable,
    Scenario, Assumption, QualityScenario and at least one lossy and one unrepresentable case. They hard-code the hand-authored expected functional.yaml
    bytes, content_hash and expected notices (the fixture''s source semantic hash comes from plumb-psg and is then fixed), and cover at minimum:
    metadata hashes and version, sorted notice refs and byte-identical repetition; layout independence (graphs differing only in View layout_ref/style_ref
    give the same semantic hash, YAML, content hash and metadata); every status (Accepted appears, Proposed/Rejected absent, Suspect/Superseded/Deprecated
    absent with warning) for nodes and edges; roles and security (actor mapping, organization collapse, BusinessRole self-token and operations,
    SecurityRole with one and without a unique Actor, grants/permits, permission scope loss, no graph mutation, no synthetic Actor); NFR mapping
    (entity keys, numeric latency_ms, boolean audit/idempotent, unsupported characteristic, collapse notice, identical duplicate, conflicting
    thresholds); functional mappings (entity membership, attribute values, relationship direction and cardinality, state ownership, operation-triggered
    transition, invariant, performer, attribute and entity-level reads/writes, outcomes, governed_by, event payload via schema_for, requirement
    specified_by, DecisionTable, process trigger/steps/next/emits, scenario, assumption, ordering); every explicit unrepresentable case (calculation,
    generic rule, acceptance criterion, event-triggered transition, process without trigger, operation without performer, scenario without operation,
    assumption without legacy fields); schema acceptance of the golden with the production validator and rejection of version != 2, a bad model_hash,
    a missing collection, an unknown top-level field, an invalid actor kind, an invalid operation kind and a malformed nested object; the keyword-subset
    check; and the output-only source guard.'
  tests:
  - cargo test -p plumb-functional golden
  - cargo test -p plumb-functional
  - cargo test --workspace
  acceptance:
  - The golden hand-built HR PSG projection is byte-identical on repeated runs, validates against schemas/functional-v2.schema.json with the runtime
    validator and matches the hand-authored YAML, content hash and notices; model_hash and source_semantic_hash equal the PSG semantic hash; modifying
    only View layout/style changes neither the YAML nor its metadata; nothing is fabricated, every loss is recorded under a listed code, and no
    functional.yaml -> PSG path exists.
  source_refs:
  - SRCREF-94287B9738
  - SRCREF-A384F23134
  - SRCREF-ED9C3A0EA2
  forbidden:
  - Do not treat functional.yaml as canonical input state.
  - Do not import, round-trip or write projected values back into the PSG, invent notice codes, or fabricate legacy fields from names or text.
  commands:
  - cargo test -p plumb-functional golden
  - cargo test -p plumb-functional
  - cargo fmt --check
  - cargo clippy --workspace --all-targets -- -D warnings
  - cargo test --workspace
  commit_message: 'F0.14: Implement functional.yaml v2 compatibility projection from PSG'
- id: S0.1
  title: Implement Markdown and plain-text source import
  phase: S0
  scope: NOW
  depends_on:
  - F0.14
  files:
  - crates/plumb-import/src/lib.rs
  - crates/plumb-import/src/source.rs
  - crates/plumb-import/src/md.rs
  - crates/plumb-import/src/text.rs
  - crates/plumb-import/tests/md_text.rs
  steps:
  - 'Deterministic parse/build only. Expose pub fn import_markdown(display_name: &str, bytes: &[u8], audit: &ImportAudit) -> Result<ImportedSource,
    ImportError> and pub fn import_plain_text(same arguments). They take no ArtifactStore, SQLite, graph store, clock, network or filesystem
    access: the result is a deterministic function of the arguments, performs no persistence, and artifact persistence stays orchestration/acquisition
    work. ImportAudit { created_by: Id, created_at: Timestamp } is supplied by the caller; no clock or environment is read. ImportedSource {
    source: Node, fragments: Vec<Node>, original_artifact: Artifact, extracted_artifact: Artifact, parse: ParseMetadata } has fragments strictly
    ordered by increasing TextRange start.'
  - Vocabularies defined once in plumb-import. SourceKind { Markdown, PlainText, Docx } with exact SourceArtifact.source_kind strings markdown,
    plain_text, docx and original media types text/markdown, text/plain and application/vnd.openxmlformats-officedocument.wordprocessingml.document;
    the caller's choice of import function decides kind and media type, never the display name; S0.1 emits only markdown and plain_text and S0.2
    reuses Docx. FragmentKind { Heading, ListItem, TableRow, Paragraph } with wire strings heading, list_item, table_row, paragraph; ordered
    and unordered list lines are both list_item with their marker kept in the text; no sentence, non_requirement, code, blockquote or ordered/unordered
    list kinds exist. Both expose ALL and as_str() and reject unknown or wrong-case strings.
  - 'Artifacts. EXTRACTED_TEXT_VERSION: u32 = 1 and ExtractedTextArtifact { version: u32, text: String } (deny_unknown_fields, version == 1).
    The original artifact is kind source-original with the source media type and the exact caller bytes; its hash is SHA-256 of those bytes.
    The extracted artifact is kind source-extracted, media type application/json, and its bytes are the RFC 8785 canonical JSON of ExtractedTextArtifact
    holding the normalized text, never the naked text: the artifact store keys by byte hash only, so storing unchanged text under both roles
    would conflict, and the wrapper gives the extracted role independent bytes. Both artifacts carry ImportAudit.created_at; the importer never
    calls a clock.'
  - 'SourceArtifact. raw_hash is the Generic SHA-256 of the exact input bytes before newline normalization. The source node ID is plumb_psg::source_artifact_id(raw_hash)
    (src:<first 16 hex>, never derived from filename, kind, media type, normalized text or time). Payload: source_kind the SourceKind wire value,
    display_name exactly as supplied, content_hash raw_hash, media_type per SourceKind, and external_uri, external_version, producer, created_at_source,
    language and classification all None. display_name must be non-empty, not surrounded by whitespace and free of control characters (typed
    ImportError, never trimmed or repaired; interior spaces allowed). The source extensions are plumb_import:parse = {"status":"complete","warnings":[]}
    (Hotfix 021 ParseMetadata; ImportedSource.parse equals it) and plumb_import:source_artifacts = SourceArtifactLinks { original_ref: Hash,
    extracted_ref: Hash } (deny_unknown_fields, both Generic, original_ref == content_hash, extracted_ref == the extracted artifact hash).'
  - 'EvidenceFragment. For every fragment: source_ref is the source node ID; locator is EvidenceLocator::TextRange { start, end } (also for table
    rows; TableCell is not used by S0.1); content_hash is the Generic SHA-256 of the exact fragment UTF-8 bytes; extracted_text is Some(exact
    fragment text); speaker and source_timestamp are None. The node ID is plumb_psg::evidence_fragment_id(source_ref, locator) (evd:<first 16
    hex of SHA-256(source_ref || "|" || RFC 8785 locator JSON)>), never derived from text, kind, headers or time. The only extension is plumb_import:fragment
    = FragmentMetadata { kind: FragmentKind, extracted_ref: Hash, header_cells: Option<Vec<String>> (omitted when None) } (deny_unknown_fields):
    extracted_ref is the source''s Generic extracted_ref, header_cells is Some exactly for TableRow and None otherwise, and malformed combinations
    are rejected. No core field is added to SourceArtifact, EvidenceFragment or EvidenceLocator; plumb_import:source_artifacts and plumb_import:fragment
    are the only importer extension keys.'
  - Node envelopes. Every source and fragment node has revision 1, status Accepted, audit created_by/created_at from ImportAudit with updated_by
    and updated_at None, and empty evidence, derivations, standards and tags. S0.1 creates no DerivationRecord, Agent, Edge, Finding or Question.
  - 'Decoding and normalization. Invalid UTF-8 fails with ImportError::SourceEncoding { valid_up_to: usize, error_len: Option<usize> } whose
    code() is E_SOURCE_ENCODING (pub const E_SOURCE_ENCODING: &str = "E_SOURCE_ENCODING"); no lossy conversion or replacement character and no
    partial output. After decoding, CRLF becomes LF and every remaining CR becomes LF; nothing else changes (no trimming, Unicode normalization,
    whitespace collapsing, tab changes, BOM removal or case folding). The normalized string is ExtractedTextArtifact.text.'
  - Coordinates. The normalized text is split into logical lines with their start byte offset, end byte offset excluding the LF and exact text;
    a trailing LF's empty final line yields nothing. start and end are zero-based UTF-8 byte offsets into ExtractedTextArtifact.text, end exclusive,
    start < end <= text byte length, and text.as_bytes()[start..end] equals the fragment's extracted_text bytes exactly. A line is blank only
    when it consists of zero or more ASCII spaces and tabs; blank lines never produce fragments.
  - 'Markdown classification, in this exact precedence, with no line in two fragments and no overlap: (1) a table block, a maximal contiguous
    run of nonblank lines each containing a literal |, recognized only when every cell of its second line (after ASCII space/tab trimming) matches
    ^:?-{3,}:?$ with at least one cell; line 1 is the header, line 2 the delimiter, and each line from 3 on is one TableRow fragment covering
    the whole line with header_cells = the parsed header cells; header and delimiter rows produce no fragment. Cells are parsed by removing an
    optional leading and an optional trailing outer |, splitting on literal |, trimming ASCII space and tab around each cell and keeping empty
    interior cells in order, with no Unicode normalization, case folding, unescaping, inline interpretation or sorting (escaped pipes are outside
    S0.1). (2) An ATX heading line matching ^#{1,6}[ \t]+(.+?)\s*$ is one Heading fragment covering the whole line exactly as stored, marker
    and trailing spaces included; no Setext headings. (3) An unordered list line matching ^[ \t]*[-+*][ \t]+(.+)$ and (4) an ordered list line
    matching ^[ \t]*[0-9]+[.)][ \t]+(.+)$ are each one ListItem fragment covering the whole line; indented and nested items are emitted independently
    in source order and markers are never renumbered. (5) A paragraph is a maximal contiguous run of nonblank lines not consumed above, one Paragraph
    fragment from the first byte of its first line to the last byte of its last line with embedded LFs kept and the final LF excluded. Fenced
    code, blockquotes, HTML, links, images, emphasis, thematic breaks, Setext headings, task checkboxes and escaped pipes get no special treatment
    and no general Markdown parser is used.'
  - 'Plain text recognizes only ordered list items, unordered list items and paragraphs with the same rules; it has no heading or table inference,
    so # lines and pipe blocks are paragraph text. Newline normalization and byte offsets are the same.'
  - Graph compatibility and determinism. Graph::new(project, profile, source + fragments, no edges) must pass current validation with no ID repair.
    Equal bytes, display name, ImportAudit and import mode give identical nodes, artifacts, IDs and hashes; re-importing equal bytes with another
    created_at changes only the operational artifact and audit timestamps. No HashMap iteration influences output.
  - 'Tests in crates/plumb-import/tests/md_text.rs (inside a module whose name contains md_text) cover at minimum: exhaustive SourceKind and
    FragmentKind wire values with unknown and wrong-case rejection and no duplicate fragment-kind type elsewhere; independently calculated fixed
    goldens for one small Markdown document (raw source hash, SourceArtifact ID, extracted canonical JSON and its hash, a TextRange canonical
    JSON, an EvidenceFragment ID and fragment content hash), the exact plumb_import:source_artifacts JSON and FragmentMetadata values for Heading,
    ListItem, TableRow (header order) and Paragraph with unknown-field rejection; artifact kinds, media types, bytes and link equalities for
    both modes; A\r\nB\rC\nD normalizing to A\nB\nC\nD with the raw hash over the original bytes; per-fragment source_ref, Generic content hash,
    exact text, range, ID, extracted_ref and kind; Markdown headings of levels 1 and 6, an invalid 7-hash heading, -, + and * items, 1. and 2)
    items, nested lists, multi-line paragraphs, a paragraph ending at a structural line, a space-only blank line, CRLF, lone CR, non-ASCII text
    before and inside fragments (byte, not char, offsets), tables with and without outer pipes, left/center/right delimiters, two data rows and
    an invalid delimiter falling back to a paragraph; plain text lists and paragraphs with # and pipe lines not being headings or table rows;
    an invalid continuation byte and a truncated sequence returning SourceEncoding with code E_SOURCE_ENCODING and no output; Graph::new acceptance
    for both modes; the read-only fixtures/hr-leave/requirements.md (import succeeds, markdown kind, graph valid, sorted fragments, exact ranges,
    deterministic re-import, no semantic extraction asserted); and source guards that production S0.1 source contains none of HashMap, SystemClock,
    Utc::now, ArtifactStore, Sqlite, rusqlite, std::fs::write, reqwest, InferenceProvider, LlmProvider, Graph::new, SemanticPatch and Proposal.'
  tests:
  - cargo test -p plumb-import md_text
  - cargo test -p plumb-import
  - cargo test --workspace
  acceptance:
  - All classification regexes and precedence rules above are covered by tests; fragment ranges round-trip exactly as UTF-8 byte offsets into
    the extracted text; source and fragment IDs come from the shared plumb-psg helpers and imported nodes pass Graph validation; independently
    calculated ID and hash goldens match; the HR Markdown fixture imports deterministically; no other Markdown construct receives a special fragment
    kind in NOW scope.
  source_refs:
  - SRCREF-52BF75EEBC
  - SRCREF-F3C31C7BB3
  - SRCREF-BC2B9CB618
  forbidden:
  - Do not add fields to SourceArtifact, EvidenceFragment or EvidenceLocator, copy the evidence ID formulas, read a clock or persist anything
    from the importer.
  commands:
  - cargo test -p plumb-import md_text
  - cargo test -p plumb-import
  - cargo fmt --check
  - cargo clippy --workspace --all-targets -- -D warnings
  - cargo test --workspace
