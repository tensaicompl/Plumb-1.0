  - cargo test -p plumb-functional vocabulary
  - cargo test -p plumb-functional
  - cargo fmt --check
  - cargo clippy --workspace --all-targets -- -D warnings
  - cargo test --workspace --no-fail-fast
  commit_message: 'S1.5: Implement vocabulary normalization and typed concept proposals'
- id: S1.6
  title: Implement all F1 validation rules
  phase: S1
  scope: NOW
  depends_on:
  - S1.5
  files:
  - crates/plumb-validation/src/evaluator.rs
  - crates/plumb-validation/src/lib.rs
  - crates/plumb-validation/src/rules/f1.rs
  - crates/plumb-validation/src/rules/mod.rs
  - crates/plumb-validation/tests/evaluator.rs
  - crates/plumb-validation/tests/f1.rs
  - crates/plumb-validation/Cargo.toml
  - Cargo.lock
  steps:
  - Implement all eleven F1 evaluators from the supplied rule YAML and rulebook. Register only this gate's real evaluators
    in crates/plumb-validation/src/rules/mod.rs through the F0.13 EvaluatorRegistry; registration is gate-incremental
    and this gate becomes evaluatable when all of its rules are bound.
  - Each evaluator returns target IDs and deterministic semantic_condition_key.
  - Rules classified external_standard use the supplied metadata only; code must not claim clause-level compliance.
  - F1 gate result must include unresolved lint blockers, vocabulary blockers, duplicates and contradictions.
  - The NO_DUPLICATE_ACCEPTED evaluator consumes the canonical open duplicate-finding state established by the S1 duplicate-analysis
    contract; it must not introduce a second inconsistent lexical similarity algorithm in plumb-validation (Hotfix 028;
    plumb-functional depends on plumb-validation, so plumb-validation cannot depend back on it).
  - PLUMB.F1.REQ.QUALITY_FINDINGS_CLEAR may consume deterministic plumb-lint diagnostics for Accepted Requirements; S1.6
    may add plumb-lint = { path = "../plumb-lint" } to crates/plumb-validation/Cargo.toml (Cargo.lock as Cargo requires),
    reuses plumb-lint and does not clone the fifteen lint algorithms. PLUMB.F1.REQ.TERMS_RESOLVED remains the canonical
    gate rule for unresolved semantic vocabulary; the S1.4 undefined-term lint is an auxiliary post-glossary diagnostic
    and may be NotEvaluated when term-mention context is unavailable (Hotfix 029).
  - TERMS_RESOLVED must reuse the S1.5 vocabulary contract and accepted Term/Concept semantics. It must not re-run vocabulary
    inference or invent another normalization algorithm. S1.5-origin Term nodes are identifiable through plumb_functional:vocabulary_origin.
    If S1.6 needs additional neutral validation input to carry current vocabulary dependency analysis, that input contract
    must be made explicit before implementation; do not guess or re-run the model. No new validation rule is added; the
    canonical F1 rule remains PLUMB.F1.REQ.TERMS_RESOLVED (Hotfix 030).
  - 'Deterministic F1 inputs (Hotfix 031). F1 stays deterministic and replayable: it never re-runs S1.3 duplicate analysis
    or S1.5 vocabulary inference, executes a provider, discovers vocabulary, reimplements S1.4 lint, detects contradictions,
    infers missing human decisions or reads fixture or configuration files. It consumes the canonical Graph, deterministic
    F1 supplemental inputs compiled before validation, rule metadata, the ValidationPolicy and already-acquired artifacts.
    ValidationContext gains f1_inputs: Option<F1ValidationInputs>; ValidationContext::new keeps its signature and sets
    None, and with_f1_inputs(self, graph, inputs) -> Result<Self, EvaluationError> validates and installs them (no interior
    mutability). evaluate_gate for F1 without inputs returns EvaluationError::InvalidContext("F1 validation inputs are
    required") instead of eleven rule errors; other gates ignore f1_inputs, so an I0 report is byte-identical with or
    without attached F1 inputs. F1ValidationInputs { requirements: Vec<F1RequirementValidationInput>, analysis_findings:
    Vec<GeneratedFinding>, lint_policy: plumb_lint::LintPolicy } (deny_unknown_fields) has content_hash() = Generic SHA-256
    of its RFC 8785 JSON; GateReport gains f1_input_hash: Option<Hash> (serde default, skipped when None, so existing
    non-F1 report bytes are unchanged), Some(inputs hash) for F1 and None otherwise, Generic when present, so changing
    any F1 input changes the F1 report hash even with an unchanged graph. crates/plumb-validation/Cargo.toml adds exactly
    plumb-lint = { path = "../plumb-lint" } and no production plumb-functional dependency (plumb-functional -> plumb-validation,
    plumb-functional -> plumb-lint, plumb-validation -> plumb-lint; plumb-lint depends on neither); Cargo.lock changes
    only as Cargo requires. Upstream GeneratedFinding material and lint diagnostics are evaluated through these inputs
    and not persisted by S1.6.'
  - 'Input validation (Hotfix 031). requirements holds exactly one F1RequirementValidationInput { requirement_ref, vocabulary_dependencies:
    Vec<F1VocabularyDependency>, lint_input: plumb_lint::LintInput } per Accepted Requirement and none for any other status
    or node type, strictly sorted by requirement_ref; lint_input.requirement_ref, statement and evidence_refs equal the
    requirement, the current Requirement.statement and the sorted unique Node.evidence IDs; lint_input.term_context is
    None (TERMS_RESOLVED is the canonical vocabulary rule, so UNDEFINED_TERM is never counted by QUALITY_FINDINGS_CLEAR),
    while source_anchor follows S1.4. F1VocabularyDependency { normalized_key (non-empty, trimmed, control-free; not re-normalized),
    range: LintTextRange (a valid UTF-8 range of the current statement), resolution } are strictly sorted by start, end,
    key, without exact duplicates or overlaps (adjacent allowed). F1VocabularyResolution is tagged by kind (snake_case,
    deny_unknown_fields): AcceptedTerm { term_ref } (an existing Accepted Term), AcceptedConcept { concept_ref } (an existing
    Accepted Concept), ExternalIdentifier { decision_ref, identifier } (identifier non-empty, trimmed, control-free, no
    invented syntax; decision_ref a governed decision whose answer is exactly {kind: external_vocabulary_identifier, requirement_ref,
    normalized_key, identifier} matching the requirement, key and identifier) or Unresolved. analysis_findings are strictly
    sorted unique by ID, each with a Generic key equal to finding_key(code, affected_refs, semantic_condition_key), id
    = finding_id(key), sorted unique affected_refs that all resolve to Requirement nodes, family F1 and code NO_DUPLICATE_ACCEPTED,
    NO_CONTRADICTION or TERMS_RESOLVED only (never lint diagnostics). Any missing or extra requirement entry, stale statement
    or evidence, unsorted input, invalid claimed Term, Concept or external decision, or tampered finding identity is EvaluationError::InvalidContext
    before any rule runs; S1.6 never downgrades lying or stale inputs into rule violations. Governed decisions (markers
    human_requirement_origin {kind, requirement_ref}, external_vocabulary_identifier and deferred_verification {kind,
    requirement_ref}, exact fields only) share one check: an Accepted ResolutionDecision with a non-empty trimmed control-free
    rationale whose decided_by is an Accepted Agent with agent_kind human; patch_ref and proposal_ref are not reinterpreted
    and no clock or timestamp ordering is used. A decision that claims one of these kinds but is malformed or ungoverned
    is not silently accepted; unrelated decision kinds are ignored.'
  - 'Active finding material (Hotfix 031). The state-based rules NO_DUPLICATE_ACCEPTED, NO_CONTRADICTION and TERMS_RESOLVED
    combine the supplemental analysis_findings with Accepted PSG Finding nodes whose payload.status is Open and whose
    code is the evaluated rule, deduplicated by Finding ID; a finding is active only while every affected Requirement
    is currently Accepted (a pair with a now Superseded requirement no longer blocks). Upstream or materialized waiver_ref
    values are not trusted; the aggregate F1 finding is waived only through the existing governed waiver machinery. Each
    rule returns one aggregate RuleEvaluation over Accepted Requirement scope with sorted unique targets and evidence,
    generated through GeneratedFinding::for_violation by the engine (no local finding-key code), and with an empty Accepted
    Requirement set every rule passes with empty targets except LINEAGE and CRITERIA_FOR_BEHAVIOR, which are NOT_APPLICABLE
    with their reasons. NO_CONTRADICTION performs no NLP, modality comparison, LLM, similarity or business-rule reasoning:
    it checks finding state only, passes when no contradiction finding exists and is exercised with synthetic finding
    material.'
  - 'The eleven rules (Hotfix 031). ISO29148.F1.REQ.STATEMENT_PRESENT fails Accepted Requirements whose statement has
    no non-whitespace character (accepted_requirement_statement_missing; ''Accepted requirements must have a non-empty
    statement.''; ''Provide an explicit requirement statement grounded in authoritative evidence.''). PLUMB.F1.REQ.GROUNDED
    passes a requirement with non-empty Node.evidence (canonical direct grounding, no redundant edge required), an Accepted
    evidenced_by edge to an Accepted EvidenceFragment, a cycle-protected path of Accepted derived_from edges through Accepted
    nodes to an Accepted EvidenceFragment, or a governed human_requirement_origin decision (accepted_requirement_grounding_missing;
    ''Accepted requirements must be grounded in evidence or an explicit human-origin decision.''; ''Attach authoritative
    evidence or record a governed human-origin decision.''). ISO29148.F1.REQ.LINEAGE applies to Accepted Requirements
    with level other than stakeholder (otherwise NOT_APPLICABLE: ''No accepted non-stakeholder requirement requires intent-lineage
    validation.'') and requires an Accepted addresses edge to an Accepted Goal or Concern, refines to an Accepted parent
    Requirement, incoming decomposes_to from an Accepted parent Requirement, derived_from to an Accepted Need, Goal or
    Concern (the representable Need form; no new relation), or a governed human_requirement_origin decision; plumb_functional:segment_origin
    is source provenance, not intent lineage (accepted_requirement_lineage_missing; ''Accepted non-stakeholder requirements
    must have explicit intent lineage or a human-origin decision.''; ''Link the requirement to its governing intent or
    record a governed human-origin decision.''). PLUMB.F1.REQ.TYPE_KNOWN passes every Accepted Requirement because closed
    typed requirement_kind and level make unknown values unrepresentable in a valid PSG (closed enums are not weakened).
    PLUMB.F1.REQ.NO_DUPLICATE_ACCEPTED fails on active duplicate findings without any Jaccard (accepted_requirement_duplicates_open;
    ''Accepted requirements have unresolved duplicate findings.''; ''Resolve, merge, supersede or govern the duplicate
    requirement pairs.''; evidence the active finding IDs). PLUMB.F1.REQ.NO_CONTRADICTION fails on active contradiction
    findings (accepted_requirement_contradictions_open; ''Accepted requirements have unresolved contradiction findings.'';
    ''Resolve the conflicting requirements through governed semantic decisions.''). PLUMB.F1.REQ.TERMS_RESOLVED fails
    Requirements with an Unresolved dependency or targeted by an active TERMS_RESOLVED finding (AcceptedTerm, AcceptedConcept
    and governed ExternalIdentifier are resolved; evidence term:<requirement_ref>:<start>:<end>:<normalized_key> and finding
    IDs; accepted_requirement_terms_unresolved; ''Accepted requirements contain unresolved semantic vocabulary dependencies.'';
    ''Accept or govern the required vocabulary concepts, or declare the dependency as a governed external identifier.'').
    PLUMB.F1.REQ.MODALITY_EXPLICIT scans whole ASCII case-insensitive words shall, should, may, must, can, not and cannot,
    recognizes shall, shall not (shall, only whitespace, not), should and may, treats should not, may not, must, must
    not, can, can not and cannot as unsupported, and fails a requirement with no supported reading, any unsupported reading
    or a supported reading other than its typed modality (Shall shall, ShallNot shall not, Should should, May may); repeated
    compatible readings pass (accepted_requirement_modality_inconsistent; ''Accepted requirements must express the same
    explicit modality as their typed Requirement.modality.''; ''Correct the requirement wording or its governed modality
    classification.''). PLUMB.F1.REQ.CRITERIA_FOR_BEHAVIOR applies to Accepted functional, interface and security Requirements
    (otherwise NOT_APPLICABLE: ''No accepted behavioral requirement is in the F1 implementation scope.'') and requires
    an Accepted AcceptanceCriterion with an Accepted derived_from edge to the Requirement, an Accepted specified_by edge
    to an Accepted Operation, Process, Rule or QualityScenario, or a governed deferred_verification decision (behavior_requirement_criteria_missing;
    ''Accepted behavioral requirements in implementation scope need acceptance criteria, executable semantics, or an explicit
    deferred-verification decision.''; ''Add governed acceptance criteria or executable semantics, or record a governed
    deferred-verification decision.''). PLUMB.F1.REQ.QUALITY_FINDINGS_CLEAR runs the real plumb_lint::lint_requirement
    on each supplied LintInput with the supplied LintPolicy and fails Requirements with an effective Error diagnostic
    (Warn and Info do not block; no lint Blocker exists; evidence lint:<rule-wire-id>:<requirement-ref>:<start>:<end>;
    accepted_requirement_quality_errors_open; ''Accepted requirements have unresolved error-severity deterministic lint
    diagnostics.''; ''Resolve or govern the high-severity requirement-quality diagnostics.''); a lint error after the
    context accepted the input is EvaluatorFailure code F1_LINT_EVALUATION. PLUMB.F1.REQ.SUPERSEDED_EXCLUDED fails Accepted
    Requirements targeted by an Accepted supersedes edge (superseded_requirement_still_active; ''Requirements targeted
    by an accepted supersedes relation must not remain Accepted.''; ''Apply the governed supersession status transition
    so the old requirement is excluded from active obligation scope.''). External-standard rules use the supplied metadata
    only and claim no clause compliance.'
  - Registration, guard and tests (Hotfix 031). rules/mod.rs declares private mod f1 and re-exports only register_f1_evaluators
    beside the I0 registration, with no rule IDs or evaluator bodies; register_f1_evaluators binds exactly the eleven
    authoritative F1 rule IDs, so a fresh registry misses 6 I0 and 11 F1 rules, I0 registration leaves F1 at 11, F1 registration
    empties F1's missing list and every later NOW gate stays unbound (no f2.rs). Production F1 code contains no std::fs,
    File::open, network, reqwest, InferenceProvider, MockProvider, ArtifactStore, RevisionStore, rusqlite, Clock, SystemClock,
    Utc::now, Instant::now, SemanticPatch, Proposal, apply_patch, commit or unsafe, and no Jaccard, vocabulary normalization,
    singularization, exception table or lint dictionaries; it adds no prompt or schema, no persistence and no validation
    rule (the rules YAML and its 133 rules are unchanged). Tests (cargo test -p plumb-validation evaluator and f1) cover
    the context extension, F1 input hash (an independently computed golden), GateReport binding, I0 compatibility and
    irrelevance, input sensitivity, every input-integrity failure, PASS coverage for every rule and FAIL coverage for
