    for a fixed context with ProviderPolicy(mock, {}), one req: ID and one optional-intent ID (preferably constraint:) as independently computed
    goldens (Python hashlib and canonical JSON, never the helpers under test); context-order determinism and provider-policy sensitivity of
    the request; request tampering (stage, task_kind, context, prompt and schema hashes, input and evidence refs); the exact SegmentOrigin JSON
    and evidence ref; modality (shall, SHALL, shall not, Shall NOT, should, SHOULD, may, MAY via a synthetic ''The system may export the report.''
    candidate; must, must not, can, should not, may not as UnsupportedModality with the lower-case phrase; ''The user cannot approve.'' as MissingModality);
    the explicit-kind override (''REQ-001 [security] The system shall protect data.'' with inference functional/software gives security/software),
    no-prefix inference kind, null kind, null level, missing inference, invalid artifact (wrong request_hash, provider, validated_output_hash),
    schema-invalid inference and coverage errors with no proposals; the Requirement proposal metadata and patch, applied in test code with apply_patch
    to a graph that validates; Goal, Need (accepted stakeholder; unknown, Proposed and wrong-type refs rejected), Concern (whitespace/control
    rejection) and Constraint proposals; audit-timestamp and input/output-order determinism; and the HR corpus through import_markdown, import_docx
    and S0.4 fallback segmentation with a mock classifier returning null kinds and one fixed level (explicitly mock classifier output for S1.1
    mechanics, not an authoritative HR level; the fixture contract defines no level), one source at a time: 32 Proposed Requirement proposals
    per source, source identifiers HR-001..HR-032, statements and kinds equal to fixtures/hr-leave/fixture-contract.yaml (byte-identical clean
    statements across Markdown and DOCX), modality by the generic rule (HR-010 and HR-012 shall, HR-013, HR-014 and HR-016 shall_not, HR-030
    should, the rest shall), HumanConfirm proposals, evidence and segment_origin on every node, no accepted node, and re-import Requirement
    ID stability. S1.1 never reads stakeholders.yaml and HR stakeholders are empty unless Accepted Stakeholder nodes exist in the graph.'
