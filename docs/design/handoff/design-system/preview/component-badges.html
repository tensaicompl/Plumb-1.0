<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #FAFAFA; font-family: var(--font-body); }
  .card {
    box-sizing: border-box;
    width: 700px;
    padding: 28px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--fg-1);
  }
  .card.dark { background: var(--color-midnight); color: var(--fg-on-dark); border-color: var(--color-midnight-light); }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-3); }
  .val   { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style></head><body><div class="card ">
<div class="label" style="margin-bottom:14px;">Badges & chips</div>
<div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
  <span style="background:#EDE9FE; color:#5B21B6; font:600 12px/1 var(--font-body); padding:6px 12px; border-radius:999px;">Brand</span>
  <span style="background:#F1F5F9; color:#334155; font:600 12px/1 var(--font-body); padding:6px 12px; border-radius:999px;">Neutral</span>
  <span style="background:#10B98114; color:#047857; font:600 12px/1 var(--font-body); padding:6px 12px; border-radius:999px;">Success</span>
  <span style="background:#F59E0B14; color:#B45309; font:600 12px/1 var(--font-body); padding:6px 12px; border-radius:999px;">Warning</span>
  <span style="background:#DC262614; color:#B91C1C; font:600 12px/1 var(--font-body); padding:6px 12px; border-radius:999px;">Danger</span>
  <span style="background:#0F172A; color:#F8FAFC; font:600 12px/1 var(--font-body); padding:6px 12px; border-radius:999px;">Dark</span>
  <span style="background:#fff; color:#0F172A; border:1px solid #E2E8F0; font:600 12px/1 var(--font-body); padding:5px 12px; border-radius:999px;">Outline</span>
  <span style="background:#6D28D9; color:#fff; font:600 11px/1 var(--font-body); padding:4px 8px; border-radius:6px;">NEW</span>
</div>
</div></body></html>
