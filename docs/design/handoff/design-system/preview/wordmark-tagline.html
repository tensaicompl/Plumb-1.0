<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #FAFAFA; font-family: var(--font-body); }
  .card {
    box-sizing: border-box;
    width: 700px;
    padding: 28px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--fg-1);
  }
  .card.dark { background: var(--color-midnight); color: var(--fg-on-dark); border-color: var(--color-midnight-light); }
  .card.black { background: #000; color: #fff; border-color: #1a1a1a; }
  .row { display: flex; align-items: center; gap: 16px; }
  .col { display: flex; flex-direction: column; }
  .grid { display: grid; gap: 12px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-3); }
  .label.dark { color: var(--fg-sub-dark); }
  .val   { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .val.dark { color: var(--fg-sub-dark); }
</style></head><body><div class="card ">
<div style="padding:8px 0;">
  <div style="font-family:var(--font-display); font-weight:800; font-size:64px; letter-spacing:-0.02em; line-height:1; color:var(--color-midnight);">TensAI</div>
  <div style="font-family:var(--font-body); font-weight:400; font-size:20px; color:var(--color-midnight-muted); margin-top:8px;">Driving innovation.</div>
  <div style="display:flex; gap:24px; margin-top:24px; padding-top:16px; border-top:1px solid var(--border);">
    <div><div class="label">Name</div><div style="font-size:13px; color:var(--fg-2); margin-top:4px;">TensAI · always capital T, capital AI</div></div>
    <div><div class="label">Tagline</div><div style="font-size:13px; color:var(--fg-2); margin-top:4px;">Driving innovation.</div></div>
  </div>
</div></div></body></html>
