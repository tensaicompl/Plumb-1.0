<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #FAFAFA; font-family: var(--font-body); }
  .card {
    box-sizing: border-box;
    width: 700px;
    padding: 28px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--fg-1);
  }
  .card.dark { background: var(--color-midnight); color: var(--fg-on-dark); border-color: var(--color-midnight-light); }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-3); }
  .val   { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style></head><body><div class="card ">
<div class="label" style="margin-bottom:14px;">Type scale</div>
<div style="display:flex; flex-direction:column; gap:10px;">
  <div style="display:flex; align-items:baseline; gap:18px;"><div style="font-family:var(--font-display); font-weight:700; font-size:56px; letter-spacing:-0.02em; line-height:1; color:#0F172A;">H1</div><div class="val">56 · Montserrat 700 · -0.02em</div></div>
  <div style="display:flex; align-items:baseline; gap:18px;"><div style="font-family:var(--font-display); font-weight:700; font-size:40px; letter-spacing:-0.02em; line-height:1; color:#0F172A;">H2</div><div class="val">40 · Montserrat 700</div></div>
  <div style="display:flex; align-items:baseline; gap:18px;"><div style="font-family:var(--font-display); font-weight:600; font-size:28px; letter-spacing:-0.02em; line-height:1; color:#0F172A;">H3</div><div class="val">28 · Montserrat 600</div></div>
  <div style="display:flex; align-items:baseline; gap:18px;"><div style="font-family:var(--font-display); font-weight:600; font-size:22px; line-height:1; color:#0F172A;">H4</div><div class="val">22 · Montserrat 600</div></div>
  <div style="display:flex; align-items:baseline; gap:18px;"><div style="font-family:var(--font-body); font-weight:400; font-size:20px; color:#334155;">Lead</div><div class="val">20 · Inter 400</div></div>
  <div style="display:flex; align-items:baseline; gap:18px;"><div style="font-family:var(--font-body); font-weight:400; font-size:16px; color:#334155;">Body</div><div class="val">16 · Inter 400</div></div>
  <div style="display:flex; align-items:baseline; gap:18px;"><div style="font-family:var(--font-body); font-weight:400; font-size:14px; color:#6B7280;">Small</div><div class="val">14 · Inter 400</div></div>
  <div style="display:flex; align-items:baseline; gap:18px;"><div style="font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.14em; color:#6B7280;">Eyebrow</div><div class="val">11 · 600 · +0.14em</div></div>
</div>
</div></body></html>
