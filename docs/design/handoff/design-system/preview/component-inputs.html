<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #FAFAFA; font-family: var(--font-body); }
  .card {
    box-sizing: border-box;
    width: 700px;
    padding: 28px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--fg-1);
  }
  .card.dark { background: var(--color-midnight); color: var(--fg-on-dark); border-color: var(--color-midnight-light); }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-3); }
  .val   { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style></head><body><div class="card ">
<div class="label" style="margin-bottom:14px;">Form inputs</div>
<div style="display:flex; flex-direction:column; gap:12px;">
  <div>
    <label style="font-size:12px; font-weight:600; color:#334155; display:block; margin-bottom:6px;">Email</label>
    <input type="text" placeholder="you@company.com" style="width:100%; box-sizing:border-box; padding:12px 14px; border:1px solid #E2E8F0; border-radius:8px; font:400 14px/1 var(--font-body); color:#0F172A; background:#fff; outline:none;">
  </div>
  <div>
    <label style="font-size:12px; font-weight:600; color:#334155; display:block; margin-bottom:6px;">Focused</label>
    <input type="text" value="ada@tensai.com" style="width:100%; box-sizing:border-box; padding:12px 14px; border:1px solid #6D28D9; border-radius:8px; font:400 14px/1 var(--font-body); color:#0F172A; background:#fff; outline:none; box-shadow:0 0 0 3px rgba(109,40,217,0.16);">
  </div>
  <div>
    <label style="font-size:12px; font-weight:600; color:#334155; display:block; margin-bottom:6px;">Error</label>
    <input type="text" value="not-an-email" style="width:100%; box-sizing:border-box; padding:12px 14px; border:1px solid #DC2626; border-radius:8px; font:400 14px/1 var(--font-body); color:#0F172A; background:#fff; outline:none;">
    <div style="font-size:12px; color:#DC2626; margin-top:6px;">Please enter a valid email address.</div>
  </div>
</div>
</div></body></html>
