<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #FAFAFA; font-family: var(--font-body); }
  .card {
    box-sizing: border-box;
    width: 700px;
    padding: 28px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--fg-1);
  }
  .card.dark { background: var(--color-midnight); color: var(--fg-on-dark); border-color: var(--color-midnight-light); }
  .card.black { background: #000; color: #fff; border-color: #1a1a1a; }
  .row { display: flex; align-items: center; gap: 16px; }
  .col { display: flex; flex-direction: column; }
  .grid { display: grid; gap: 12px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-3); }
  .label.dark { color: var(--fg-sub-dark); }
  .val   { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .val.dark { color: var(--fg-sub-dark); }
</style></head><body><div class="card dark">
<div class="label dark" style="margin-bottom:14px;">Midnight scale · dark surfaces</div>
<div style="display:grid; grid-template-columns:repeat(5, 1fr); gap:14px;">
  
  <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="background:#F8FAFC; aspect-ratio:1.4; border-radius:10px; border:1px solid rgba(15,23,42,0.08);"></div>
    <div>
      <div style="font-size:13px; font-weight:600; color:var(--fg-on-dark);">On dark</div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--fg-sub-dark); margin-top:2px;">#F8FAFC</div>
      <div style="font-size:11px; color:var(--fg-sub-dark); margin-top:2px;">Primary text</div>
    </div>
  </div>
  
  <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="background:#94A3B8; aspect-ratio:1.4; border-radius:10px; border:1px solid rgba(15,23,42,0.08);"></div>
    <div>
      <div style="font-size:13px; font-weight:600; color:var(--fg-on-dark);">Subtext</div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--fg-sub-dark); margin-top:2px;">#94A3B8</div>
      <div style="font-size:11px; color:var(--fg-sub-dark); margin-top:2px;">Secondary</div>
    </div>
  </div>
  
  <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="background:#334155; aspect-ratio:1.4; border-radius:10px; border:1px solid rgba(15,23,42,0.08);"></div>
    <div>
      <div style="font-size:13px; font-weight:600; color:var(--fg-on-dark);">Muted</div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--fg-sub-dark); margin-top:2px;">#334155</div>
      <div style="font-size:11px; color:var(--fg-sub-dark); margin-top:2px;">Body</div>
    </div>
  </div>
  
  <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="background:#1E293B; aspect-ratio:1.4; border-radius:10px; border:1px solid rgba(15,23,42,0.08);"></div>
    <div>
      <div style="font-size:13px; font-weight:600; color:var(--fg-on-dark);">Lighter</div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--fg-sub-dark); margin-top:2px;">#1E293B</div>
      <div style="font-size:11px; color:var(--fg-sub-dark); margin-top:2px;">Cards</div>
    </div>
  </div>
  
  <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="background:#0F172A; aspect-ratio:1.4; border-radius:10px; border:1px solid rgba(15,23,42,0.08);"></div>
    <div>
      <div style="font-size:13px; font-weight:600; color:var(--fg-on-dark);">Base</div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--fg-sub-dark); margin-top:2px;">#0F172A</div>
      <div style="font-size:11px; color:var(--fg-sub-dark); margin-top:2px;">Background</div>
    </div>
  </div>
</div></div></body></html>
