<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #FAFAFA; font-family: var(--font-body); }
  .card {
    box-sizing: border-box;
    width: 700px;
    padding: 28px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--fg-1);
  }
  .card.dark { background: var(--color-midnight); color: var(--fg-on-dark); border-color: var(--color-midnight-light); }
  .card.black { background: #000; color: #fff; border-color: #1a1a1a; }
  .row { display: flex; align-items: center; gap: 16px; }
  .col { display: flex; flex-direction: column; }
  .grid { display: grid; gap: 12px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-3); }
  .label.dark { color: var(--fg-sub-dark); }
  .val   { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .val.dark { color: var(--fg-sub-dark); }
</style></head><body><div class="card ">
<div style="display:flex; align-items:center; gap:36px; padding:24px 0;">
  <img src="../assets/logos/logo-lockup-black.svg" alt="TensAI" style="height:160px; width:auto;">
  <div style="border-left:1px solid var(--border); padding-left:36px;">
    <div class="label">Primary lockup</div>
    <div style="font-size:14px; color:var(--fg-2); margin-top:8px; line-height:1.6;">
      Enso + wordmark + tagline.<br>Use on light surfaces.<br>Minimum height: 80px.
    </div>
  </div>
</div></div></body></html>
