<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #FAFAFA; font-family: var(--font-body); }
  .card {
    box-sizing: border-box;
    width: 700px;
    padding: 28px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--fg-1);
  }
  .card.dark { background: var(--color-midnight); color: var(--fg-on-dark); border-color: var(--color-midnight-light); }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-3); }
  .val   { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style></head><body><div class="card ">
<div class="label" style="margin-bottom:14px;">Mono · JetBrains Mono</div>
<pre style="font-family:var(--font-mono); font-size:13px; color:#0F172A; background:#F1F5F9; border:1px solid #E2E8F0; padding:14px 16px; border-radius:8px; line-height:1.55; overflow:hidden;">
const tensai = await TensAI.complete({
  model: "tensai-v1",
  temperature: 0.2,
  messages: [{ role: "user", content: input }],
});
</pre>
<div class="val" style="margin-top:10px;">JetBrains Mono · 13px · for code, model IDs, technical values</div>
</div></body></html>
