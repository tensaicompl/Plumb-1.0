<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #FAFAFA; font-family: var(--font-body); }
  .card {
    box-sizing: border-box;
    width: 700px;
    padding: 28px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--fg-1);
  }
  .card.dark { background: var(--color-midnight); color: var(--fg-on-dark); border-color: var(--color-midnight-light); }
  .card.black { background: #000; color: #fff; border-color: #1a1a1a; }
  .row { display: flex; align-items: center; gap: 16px; }
  .col { display: flex; flex-direction: column; }
  .grid { display: grid; gap: 12px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-3); }
  .label.dark { color: var(--fg-sub-dark); }
  .val   { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .val.dark { color: var(--fg-sub-dark); }
</style></head><body><div class="card ">
<div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;">
  <div style="background:#FAFAFA; border-radius:12px; padding:32px; display:flex; align-items:center; justify-content:center; aspect-ratio:1; border:1px solid var(--border);">
    <img src="../assets/logos/icon-purple.svg" alt="" style="width:100%; height:100%; object-fit:contain;">
  </div>
  <div style="background:var(--color-midnight); border-radius:12px; padding:32px; display:flex; align-items:center; justify-content:center; aspect-ratio:1;">
    <img src="../assets/logos/icon-black.svg" alt="" style="width:100%; height:100%; object-fit:contain; filter:invert(1);">
  </div>
  <div style="background:#000; border-radius:12px; padding:32px; display:flex; align-items:center; justify-content:center; aspect-ratio:1;">
    <img src="../assets/logos/icon-purple.svg" alt="" style="width:100%; height:100%; object-fit:contain;">
  </div>
</div>
<div class="label" style="margin-top:16px;">Icon mark — three context variants</div>
</div></body></html>
