<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #FAFAFA; font-family: var(--font-body); }
  .card {
    box-sizing: border-box;
    width: 700px;
    padding: 28px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--fg-1);
  }
  .card.dark { background: var(--color-midnight); color: var(--fg-on-dark); border-color: var(--color-midnight-light); }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-3); }
  .val   { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style></head><body><div class="card ">
<div class="label" style="margin-bottom:14px;">Body · Inter</div>
<div style="font-family:var(--font-body); font-weight:400; font-size:16px; color:#334155; line-height:1.6;">
  We're building TensAI to be the calmest, most decisive intelligence layer your team has ever worked with. One brushstroke. One system. Less ceremony, more progress.
</div>
<div style="margin-top:14px; display:flex; gap:24px; font-size:12px;">
  <div><div class="label">Family</div><div class="val" style="color:var(--fg-1); margin-top:4px;">Inter</div></div>
  <div><div class="label">Size</div><div class="val" style="color:var(--fg-1); margin-top:4px;">16px / 1.6</div></div>
  <div><div class="label">Weight</div><div class="val" style="color:var(--fg-1); margin-top:4px;">400 Regular</div></div>
</div>
</div></body></html>
