<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #FAFAFA; font-family: var(--font-body); }
  .card {
    box-sizing: border-box;
    width: 700px;
    padding: 28px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--fg-1);
  }
  .card.dark { background: var(--color-midnight); color: var(--fg-on-dark); border-color: var(--color-midnight-light); }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-3); }
  .val   { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style></head><body><div class="card ">
<div class="label" style="margin-bottom:18px;">Elevation · shadow system</div>
<div style="display:grid; grid-template-columns:repeat(5, 1fr); gap:18px; padding-bottom:6px;">

  <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
    <div style="width:80px; height:80px; background:#fff; border-radius:12px; box-shadow:0 1px 2px rgba(15, 23, 42, 0.04);"></div>
    <div style="font-size:11px; font-weight:600; color:#0F172A;">xs</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
    <div style="width:80px; height:80px; background:#fff; border-radius:12px; box-shadow:0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);"></div>
    <div style="font-size:11px; font-weight:600; color:#0F172A;">sm</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
    <div style="width:80px; height:80px; background:#fff; border-radius:12px; box-shadow:0 4px 12px rgba(15, 23, 42, 0.08), 0 2px 4px rgba(15, 23, 42, 0.04);"></div>
    <div style="font-size:11px; font-weight:600; color:#0F172A;">md</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
    <div style="width:80px; height:80px; background:#fff; border-radius:12px; box-shadow:0 12px 32px rgba(15, 23, 42, 0.10), 0 4px 8px rgba(15, 23, 42, 0.04);"></div>
    <div style="font-size:11px; font-weight:600; color:#0F172A;">lg</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
    <div style="width:80px; height:80px; background:#fff; border-radius:12px; box-shadow:0 24px 64px rgba(15, 23, 42, 0.14), 0 8px 16px rgba(15, 23, 42, 0.06);"></div>
    <div style="font-size:11px; font-weight:600; color:#0F172A;">xl</div>
  </div>
</div>
<div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border); display:flex; align-items:center; gap:18px;">
  <div style="width:80px; height:80px; background:#6D28D9; border-radius:12px; box-shadow:0 12px 32px rgba(109,40,217,0.28);"></div>
  <div><div style="font-size:13px; font-weight:600; color:#0F172A;">Brand accent shadow</div><div class="val" style="margin-top:4px;">0 12px 32px rgba(109,40,217,0.28)</div></div>
</div>
</div></body></html>
