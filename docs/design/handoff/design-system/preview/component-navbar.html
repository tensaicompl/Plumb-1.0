<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #FAFAFA; font-family: var(--font-body); }
  .card {
    box-sizing: border-box;
    width: 700px;
    padding: 28px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--fg-1);
  }
  .card.dark { background: var(--color-midnight); color: var(--fg-on-dark); border-color: var(--color-midnight-light); }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-3); }
  .val   { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style></head><body><div class="card ">
<div class="label" style="margin-bottom:12px;">Top navigation</div>
<div style="background:rgba(250,250,250,0.85); backdrop-filter:blur(12px); border:1px solid #E2E8F0; border-radius:14px; padding:18px 24px; display:flex; align-items:center; justify-content:space-between;">
  <div style="display:flex; align-items:center; gap:40px;">
    <div style="display:flex; align-items:center;">
      <img src="../assets/logos/icon-black.svg" style="height:80px; width:80px; object-fit:contain; display:block;" alt="">
      <span style="font-family:var(--font-display); font-weight:800; font-size:22px; letter-spacing:-0.02em; color:#0F172A; line-height:1; margin-left:-10px;">TensAI</span>
    </div>
    <div style="display:flex; gap:24px; font:500 14px/1 var(--font-body); color:#334155;">
      <span>Product</span><span>Solutions</span><span>Pricing</span><span>Docs</span>
    </div>
  </div>
  <div style="display:flex; gap:10px; align-items:center;">
    <button style="background:transparent; color:#334155; border:0; padding:8px 12px; font:500 14px/1 var(--font-body); cursor:pointer;">Sign in</button>
    <button style="background:#6D28D9; color:#fff; border:0; padding:10px 20px; border-radius:999px; font:600 13px/1 var(--font-body); cursor:pointer;">Get started</button>
  </div>
</div>
</div></body></html>
