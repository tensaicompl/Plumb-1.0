<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #FAFAFA; font-family: var(--font-body); }
  .card {
    box-sizing: border-box;
    width: 700px;
    padding: 28px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--fg-1);
  }
  .card.dark { background: var(--color-midnight); color: var(--fg-on-dark); border-color: var(--color-midnight-light); }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-3); }
  .val   { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style></head><body><div class="card ">
<div class="label" style="margin-bottom:14px;">Spacing · 4px grid</div>
<div style="display:flex; align-items:flex-end; gap:12px;">

  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:4px; height:4px; background:#6D28D9; border-radius:4px;"></div>
    <div class="val" style="font-size:10px;">1 · 4</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:8px; height:8px; background:#6D28D9; border-radius:4px;"></div>
    <div class="val" style="font-size:10px;">2 · 8</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:12px; height:12px; background:#6D28D9; border-radius:4px;"></div>
    <div class="val" style="font-size:10px;">3 · 12</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:16px; height:16px; background:#6D28D9; border-radius:4px;"></div>
    <div class="val" style="font-size:10px;">4 · 16</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:20px; height:20px; background:#6D28D9; border-radius:4px;"></div>
    <div class="val" style="font-size:10px;">5 · 20</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:24px; height:24px; background:#6D28D9; border-radius:4px;"></div>
    <div class="val" style="font-size:10px;">6 · 24</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:32px; height:32px; background:#6D28D9; border-radius:4px;"></div>
    <div class="val" style="font-size:10px;">8 · 32</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:40px; height:40px; background:#6D28D9; border-radius:4px;"></div>
    <div class="val" style="font-size:10px;">10 · 40</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:48px; height:48px; background:#6D28D9; border-radius:4px;"></div>
    <div class="val" style="font-size:10px;">12 · 48</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:64px; height:64px; background:#6D28D9; border-radius:4px;"></div>
    <div class="val" style="font-size:10px;">16 · 64</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:80px; height:80px; background:#6D28D9; border-radius:4px;"></div>
    <div class="val" style="font-size:10px;">20 · 80</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:96px; height:96px; background:#6D28D9; border-radius:4px;"></div>
    <div class="val" style="font-size:10px;">24 · 96</div>
  </div>
</div>
</div></body></html>
