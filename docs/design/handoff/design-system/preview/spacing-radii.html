<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #FAFAFA; font-family: var(--font-body); }
  .card {
    box-sizing: border-box;
    width: 700px;
    padding: 28px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--fg-1);
  }
  .card.dark { background: var(--color-midnight); color: var(--fg-on-dark); border-color: var(--color-midnight-light); }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-3); }
  .val   { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style></head><body><div class="card ">
<div class="label" style="margin-bottom:14px;">Corner radii</div>
<div style="display:grid; grid-template-columns:repeat(6, 1fr); gap:12px; text-align:center;">

  <div>
    <div style="width:100%; aspect-ratio:1; background:#EDE9FE; border:1px solid #C4B5FD; border-radius:4px;"></div>
    <div style="font-size:11px; font-weight:600; color:#0F172A; margin-top:6px;">xs</div>
    <div class="val" style="font-size:10px;">4px</div>
  </div>
  <div>
    <div style="width:100%; aspect-ratio:1; background:#EDE9FE; border:1px solid #C4B5FD; border-radius:8px;"></div>
    <div style="font-size:11px; font-weight:600; color:#0F172A; margin-top:6px;">sm</div>
    <div class="val" style="font-size:10px;">8px</div>
  </div>
  <div>
    <div style="width:100%; aspect-ratio:1; background:#EDE9FE; border:1px solid #C4B5FD; border-radius:12px;"></div>
    <div style="font-size:11px; font-weight:600; color:#0F172A; margin-top:6px;">md</div>
    <div class="val" style="font-size:10px;">12px</div>
  </div>
  <div>
    <div style="width:100%; aspect-ratio:1; background:#EDE9FE; border:1px solid #C4B5FD; border-radius:16px;"></div>
    <div style="font-size:11px; font-weight:600; color:#0F172A; margin-top:6px;">lg</div>
    <div class="val" style="font-size:10px;">16px</div>
  </div>
  <div>
    <div style="width:100%; aspect-ratio:1; background:#EDE9FE; border:1px solid #C4B5FD; border-radius:24px;"></div>
    <div style="font-size:11px; font-weight:600; color:#0F172A; margin-top:6px;">xl</div>
    <div class="val" style="font-size:10px;">24px</div>
  </div>
  <div>
    <div style="width:100%; aspect-ratio:1; background:#EDE9FE; border:1px solid #C4B5FD; border-radius:32px;"></div>
    <div style="font-size:11px; font-weight:600; color:#0F172A; margin-top:6px;">2xl</div>
    <div class="val" style="font-size:10px;">32px</div>
  </div>
</div>
<div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--border); display:flex; align-items:center; gap:14px;">
  <div style="width:80px; height:32px; background:#6D28D9; border-radius:999px;"></div>
  <div><div style="font-size:11px; font-weight:600; color:#0F172A;">pill · 999px</div><div class="val">Chips, primary CTAs</div></div>
</div>
</div></body></html>
