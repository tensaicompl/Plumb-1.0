<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../tokens/colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #FAFAFA; font-family: var(--font-body); }
  .card {
    box-sizing: border-box;
    width: 700px;
    padding: 28px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--fg-1);
  }
  .card.dark { background: var(--color-midnight); color: var(--fg-on-dark); border-color: var(--color-midnight-light); }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-3); }
  .val   { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style></head><body><div class="card ">
<div class="label" style="margin-bottom:14px;">Display · Montserrat ExtraBold</div>
<div style="font-family:var(--font-display); font-weight:800; font-size:88px; letter-spacing:-0.025em; line-height:1; color:#0F172A;">Tensai</div>
<div style="margin-top:16px; display:flex; gap:24px; font-size:12px; color:var(--fg-3);">
  <div><div class="label">Family</div><div class="val" style="color:var(--fg-1); margin-top:4px;">Montserrat</div></div>
  <div><div class="label">Weight</div><div class="val" style="color:var(--fg-1); margin-top:4px;">800 · ExtraBold</div></div>
  <div><div class="label">Tracking</div><div class="val" style="color:var(--fg-1); margin-top:4px;">-0.025em</div></div>
</div></div></body></html>
